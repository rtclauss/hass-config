add_cat:
  fields:
    name:
      required: true
      selector:
        text:
    weight_lbs:
      selector:
        number:
          min: 0.5
          max: 40
          step: 0.1
          unit_of_measurement: lb
    active_from:
      selector:
        datetime:

rename_cat:
  fields:
    cat_id:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:

remove_cat:
  fields:
    cat_id:
      required: true
      selector:
        text:

backfill:
  fields:
    days:
      required: true
      default: 1460
      selector:
        number:
          min: 1
          max: 3650
          unit_of_measurement: days

get_visits:
  fields:
    cat_id:
      selector:
        text:
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    limit:
      default: 500
      selector:
        number:
          min: 1
          max: 20000
