# Repo mirror of the live AppDaemon add-on config (/addon_configs/a0d7b954_appdaemon,
# mounted as /config in the add-on). See docs/appdaemon_sync.md.

secrets: /homeassistant/secrets.yaml
#log:
#  logfile: /config/logs/appdaemon.log
#  errorfile: /config/logs/appdaemon_error.log
logs:
  main_log:
    filename: /homeassistant/logs/appdaemon.log
    log_level: DEBUG
  error_log:
    filename: /homeassistant/logs/appdaemon_error.log
  # chatgpt_bed_log:
  #   filename: /homeassistant/logs/chatgpt_bed_occupancy.log
  #   log_level: DEBUG
appdaemon:
  # app_dir belongs under `appdaemon:` (AppDaemon 4.5). It used to sit at the top
  # level pointing at /homeassistant/appdaemon/apps/, where AppDaemon ignored it
  # and fell back to /config/apps (#1223). /config/apps is the add-on tree that
  # appdaemon_sync.py pushes to and that holds the rendered apps.yaml, so pin it
  # explicitly. The git-pulled /homeassistant/appdaemon/apps/ has no rendered
  # apps.yaml and must not be selected.
  app_dir: /config/apps
  latitude: !secret home_latitude
  longitude: !secret home_longitude
  elevation: !secret home_elevation
  time_zone: America/Chicago
  thread_duration_warning_threshold: 240
  internal_function_timeout: 240
  plugins:
    HASS:
      type: hass
      #timewarp: 100
      token: !env_var SUPERVISOR_TOKEN
http:
  url: http://0.0.0.0:5050
# hadashboard:
api:
admin:
