# Example only. Keep the active configuration and secret.yaml on the HA host.
homeassistant:
  enabled: true
mqtt:
  server: mqtt://192.0.2.10:1883
  user: example-user
  password: '!secret.yaml mqtt_password'
serial:
  port: /dev/serial/by-id/EXAMPLE_COORDINATOR
advanced:
  network_key: '!secret.yaml network_key'
frontend:
  enabled: true
availability:
  enabled: true
health:
  interval: 10
  reset_on_check: false
device_options:
  hue_native_control: true
devices:
  '0x0000000000000001':
    friendly_name: Arrival Sensor
  '0x0000000000000002':
    friendly_name: Owner Suite/Lamp Bulb 1
groups:
  '1':
    friendly_name: Deck/Hue
  '2':
    friendly_name: Outside/Front Hue
