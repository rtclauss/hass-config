version: 2
last_updated: "2026-07-16"
owner: "rtclauss"
summary: "Canonical Home Assistant labels for cross-cutting domain, behavior, privacy, and operational context."
labels:
  - label_id: hallway
    name: "Hallway"
    description: "Shared hallway context spanning the main and upstairs hallway areas."
    scopes:
      - area
    lifecycle: active
    owner: "room_naming"
    reason: "Preserves the existing cross-area hallway grouping without replacing physical areas."
    icon: "mdi:floor-plan"
    color: "blue"
  - label_id: guest_sensitive
    name: "Guest Sensitive"
    description: "Objects whose behavior must respect guest presence and guest-capable rooms."
    scopes:
      - area
      - device
      - entity
      - automation
      - script
      - scene
      - helper
    lifecycle: active
    owner: "room_intent"
    reason: "Supports privacy-first review and suppression of intrusive behavior."
    icon: "mdi:account-group"
    color: "purple"
  - label_id: sleep_sensitive
    name: "Sleep Sensitive"
    description: "Objects that can disturb occupants who may be sleeping."
    scopes:
      - area
      - device
      - entity
      - automation
      - script
      - scene
      - helper
    lifecycle: active
    owner: "room_intent"
    reason: "Makes sleep-impacting lighting, media, climate, and physical actions searchable."
    icon: "mdi:sleep"
    color: "indigo"
  - label_id: privacy_sensitive
    name: "Privacy Sensitive"
    description: "Objects that affect private rooms, private sensors, cameras, or private notifications."
    scopes:
      - area
      - device
      - entity
      - automation
      - script
      - scene
      - helper
    lifecycle: active
    owner: "room_intent"
    reason: "Highlights behavior requiring explicit privacy review."
    icon: "mdi:shield-lock"
    color: "deep-purple"
