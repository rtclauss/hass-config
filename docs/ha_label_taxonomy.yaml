      - area
      - device
      - entity
      - automation
      - script
      - scene
      - helper
    lifecycle: active
    owner: "operations"
    reason: "Marks behavior requiring conservative changes and explicit verification."
    icon: "mdi:alert-circle"
    color: "red"
