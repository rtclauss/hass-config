# Home Assistant package for TV activity scenes and playback state handling.
# It wraps on, off, pause, and resume behaviors so other automations can react to TV usage without embedding low-level media-player logic everywhere.

################################################################
## Packages / TV
################################################################

################################################
## Customize
################################################

homeassistant:
  customize:
    ################################################
    ## Node Anchors
    ################################################

    package.node_anchors:
      customize: &customize
        package: "tv"

      expose: &expose
        <<: *customize
        haaska_hidden: false
        homebridge_hidden: false

    ################################################
    ## Automations
    ################################################

    ################################################
    ## Scenes
    ################################################

    ################################################
    ## Scripts
    ################################################
    script.watch_tv:
      <<: *expose
      friendly_name: "Watch TV"
      icon: mdi:television

    script.watch_youtube:
      <<: *expose
      friendly_name: "Watch YouTube"
      icon: mdi:youtube-tv

    script.watch_netflix:
      <<: *expose
      friendly_name: "Watch Netflix"
      icon: mdi:netflix

    script.watch_plex:
      <<: *expose
      friendly_name: "Watch Plex"
      icon: mdi:plex

    script.watch_f1:
      <<: *expose
      friendly_name: "Watch F1"
      icon: mdi:flag-checkered

    script.watch_letterkenny:
      <<: *expose
      friendly_name: "Watch Letterkenny"
      icon: mdi:television-play

    script.watch_the_simpsons:
      <<: *expose
      friendly_name: "Watch The Simpsons"
      icon: mdi:television-play

    script.watch_american_dad:
      <<: *expose
      friendly_name: "Watch American Dad"
      icon: mdi:television-play

    script.watch_aqua_teen:
      <<: *expose
      friendly_name: "Watch Aqua Teen"
      icon: mdi:television-play

    script.watch_bobs_burgers:
      <<: *expose
      friendly_name: "Watch Bob's Burgers"
      icon: mdi:television-play

    script.watch_ds9:
      <<: *expose
      friendly_name: "Watch DS9"
      icon: mdi:television-play

    script.watch_rick_and_morty:
      <<: *expose
      friendly_name: "Watch Rick and Morty"
      icon: mdi:television-play

    script.watch_tng:
      <<: *expose
      friendly_name: "Watch TNG"
      icon: mdi:television-play

    script.watch_basement_tv_startup:
      <<: *expose
      friendly_name: "Basement TV Startup"
      icon: mdi:television

    script.watch_plex_show:
      <<: *expose
      friendly_name: "Watch Plex Show"
      icon: mdi:plex

################################################
## Automation
################################################

automation:
  - id: tv_off
    alias: tv_off
    description: "Reset the basement lighting scene and turn off the TV bias light when the basement LG TV turns off or drops offline."
    trace:
      stored_traces: 50
    trigger:
      - trigger: state
        entity_id: media_player.lg_webos_smart_tv
        from: "on"
        to: "off"
        for:
          seconds: 5
      - trigger: state
        entity_id: media_player.lg_webos_smart_tv
        from: "on"
        to: "unavailable"
        for:
          seconds: 5
    action:
      - action: scene.turn_on
        target:
          entity_id: scene.scene_reset_basement
        data:
          transition: 4
      - action: light.turn_off
        target:
          entity_id: light.basement_tv_bias
        data:
          transition: 4

  - id: tv_on
    alias: tv_on
    description: "Turn on the basement TV bias light and pause whole-home audio when the basement TV has been on for 10 seconds and nobody is in bed."
    trace:
      stored_traces: 50
    trigger:
      - trigger: state
        entity_id: media_player.lg_webos_smart_tv
        to: "on"
        for:
          seconds: 10
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: binary_sensor.bayesian_bed_occupancy
          state: "off"
    action:
      - action: light.turn_on
        target:
          entity_id: light.basement_tv_bias
      - delay:
          seconds: 2
      - action: script.music_assistant_pause_house_audio

  - id: tv_off_at_night_bed_prep
    alias: tv_off_at_night_bed_prep
    description: "From 20:00 to 04:00, when the basement TV or Apple TV turns off or the hall button is pressed, start bedtime prep: set bedroom/bathroom volumes, apply the bedroom prep scene, start bedtime audio, and turn off sleep mode (skipped in guest mode or when someone is already in bed)."
    trace:
      stored_traces: 50
    trigger:
      - trigger: state
        id: lg-tv-off
        entity_id: media_player.lg_webos_smart_tv
        from: "on"
        to: "off"
        for:
          seconds: 15
      - trigger: state
        id: lg-tv-unavailable
        entity_id: media_player.lg_webos_smart_tv
        from: "on"
        to: "unavailable"
        for:
          seconds: 15
      - trigger: state
        id: lg-tv-off-to-unavailable
        entity_id: media_player.lg_webos_smart_tv
        from: "off"
        to: "unavailable"
        for:
          seconds: 10
      - trigger: state
        id: basement-player-off
        entity_id: media_player.basement_great_room_basement_atv
        to: "off"
        for:
          seconds: 5
      - trigger: state
        entity_id:
          - sensor.hall_button_action
        to: "single"
    condition:
      condition: and
      conditions:
        - condition: time
          after: "20:00:00"
          before: "04:00:00"
        - condition: state
          entity_id: input_boolean.guest_mode
          state: "off"
        - condition: state
          entity_id: binary_sensor.bayesian_bed_occupancy
          state: "off"
        - condition: or
          conditions:
            - condition: template
              value_template: "{{ trigger.id != 'basement-player-off' }}"
            - condition: or
              conditions:
                - condition: state
                  entity_id: media_player.lg_webos_smart_tv
                  state: "off"
                - condition: state
                  entity_id: media_player.lg_webos_smart_tv
                  state: "unavailable"
                - condition: state
                  entity_id: media_player.plex_basement_apple_tv
                  state: "unavailable"
    action:
      - action: media_player.volume_set
        continue_on_error: true
        target:
          entity_id:
            - media_player.ma_bedroom
            - media_player.ma_bathroom
        data:
          volume_level: 0.02
      - action: scene.turn_on
        continue_on_error: true
        target:
          entity_id: scene.bedroom_prep
        data:
          transition: 60
      - action: script.turn_on
        continue_on_error: true
        target:
          entity_id: script.spotify_bedtime
      - delay: "00:20:00"
      - action: switch.turn_off
        target:
          entity_id: switch.sleep_mode

  - id: tv_paused
    alias: tv_paused
    description: "Apply the TV-paused lighting scene when basement playback pauses in the evening (skipped in guest mode)."
    initial_state: true
    trace:
      stored_traces: 50
    trigger:
      - trigger: state
        entity_id: media_player.basement_great_room_basement_atv
        from: "playing"
        to: "paused"
        for:
          seconds: 5
      - trigger: state
        entity_id: media_player.plex_basement_apple_tv
        from: "playing"
        to: "paused"
        for:
          seconds: 5
      - trigger: state
        entity_id: media_player.lg_webos_smart_tv
        from: "playing"
        to: "paused"
        for:
          seconds: 2
    condition:
      condition: and
      conditions:
        - condition: time
          after: "19:30:00"
          before: "23:59:00"
        - condition: state
          entity_id: input_boolean.guest_mode
          state: "off"
    action:
      - action: scene.turn_on
        target:
          entity_id: scene.tv_paused
        data:
          transition: 4

  - id: tv_watching_scotland
    alias: tv_watching_scotland
    description: "Turn the basement TV bias light magenta while a title containing Scotland is playing on the basement Apple TV or Plex."
    initial_state: true
    trace:
      stored_traces: 50
    trigger:
      - trigger: state
        entity_id: media_player.basement_great_room_basement_atv
        to: "playing"
        for:
          seconds: 5
      - trigger: state
        entity_id: media_player.plex_basement_apple_tv
        to: "playing"
        for:
          seconds: 5
      - trigger: state
        entity_id: media_player.lg_webos_smart_tv
        from: "playing"
        to: "paused"
        for:
          seconds: 2
    condition:
      condition: and
      conditions:
        - >-
          {{ 'Scotland' in (state_attr('media_player.basement_great_room_basement_atv', 'media_title') or '')
          or 'Scotland' in
          (state_attr('media_player.plex_basement_apple_tv', 'media_title') or '') }}
    action:
      - action: light.turn_on
        target:
          entity_id: light.basement_tv_bias
        data:
          rgb_color:
            - 254
            - 11
            - 255

  - id: tv_resumed
    alias: tv_resumed
    description: "When basement playback starts or resumes in the evening, pause other room audio, apply the TV-resumed scene, and set night TV switch modes (skipped in guest mode)."
    initial_state: true
    trace:
      stored_traces: 50
    trigger:
      - trigger: state
        entity_id: media_player.lg_webos_smart_tv
        to: "playing"
        for:
          seconds: 10
      - trigger: state
        entity_id: media_player.basement_great_room_basement_atv
        to: "playing"
        for:
          seconds: 5
      - trigger: state
        entity_id: media_player.plex_basement_apple_tv
        to: "playing"
        for:
          seconds: 5
    condition:
      condition: and
      conditions:
        - condition: time
          after: "19:30:00"
          before: "23:59:00"
        - condition: state
          entity_id: input_boolean.guest_mode
          state: "off"
        - condition: state
          entity_id: media_player.lg_webos_smart_tv
          state: "on"
    action:
      - action: media_player.media_pause
        continue_on_error: true
        target:
          entity_id:
            - media_player.ma_office
            - media_player.ma_den
      - action: scene.turn_on
        continue_on_error: true
        target:
          entity_id: scene.tv_resumed
      - action: script.turn_on
        continue_on_error: true
        target:
          entity_id: script.night_tv_mode_switches
      - action: media_player.media_pause
        continue_on_error: true
        target:
          entity_id:
            - media_player.ma_den
      - action: script.music_assistant_pause_house_audio
        continue_on_error: true

################################################
## Scenes
################################################

scene:
  - id: tv_paused
    name: tv_paused
    entities:
      light.basement_great_room:
        state: "on"
        brightness: 128

  - id: tv_resumed
    name: tv_resumed
    entities:
      light.basement_great_room:
        state: "off"

################################################
## Scripts
################################################

script:
  wait_for_basement_media_player_ready:
    alias: "Wait for Basement Media Player"
    description: "Wait until the basement Apple TV is ready (not off or unavailable) before callers send it commands."
    mode: parallel
    trace:
      stored_traces: 50
    sequence:
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: media_player.basement_great_room_basement_atv
                state: "off"
        then:
          - stop: Basement player already ready
      - repeat:
          sequence:
            - wait_for_trigger:
                - trigger: state
                  entity_id: media_player.basement_great_room_basement_atv
                  from: "off"
              timeout: "00:00:01"
              continue_on_timeout: true
          until:
            - condition: not
              conditions:
                - condition: state
                  entity_id: media_player.basement_great_room_basement_atv
                  state: "off"

  wait_for_basement_plex_client_ready:
    alias: "Wait for Basement Plex Client"
    description: "Wait until the basement Plex client is discoverable and ready before callers start Plex playback."
    mode: parallel
    trace:
      stored_traces: 50
    sequence:
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: media_player.plex_basement_apple_tv
                state: "unavailable"
        then:
          - stop: Plex client already ready
      - repeat:
          count: 10
          sequence:
            - wait_for_trigger:
                - trigger: state
                  entity_id: media_player.plex_basement_apple_tv
                  from: "unavailable"
              timeout: "00:00:01"
              continue_on_timeout: true
            - if:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: media_player.plex_basement_apple_tv
                      state: "unavailable"
              then:
                - stop: Plex client ready
      - condition: not
        conditions:
          - condition: state
            entity_id: media_player.plex_basement_apple_tv
            state: "unavailable"

  # Shared preamble: power on basement media player, wait for ready,
  # then switch the LG TV to HDMI 3. Called by all watch_* scripts.
  watch_basement_tv_startup:
    alias: "Basement TV Startup"
    description: "Shared startup for basement watch scripts: power on the Apple TV, wait for it, and switch the LG TV to the Apple TV input."
    mode: parallel
    trace:
      stored_traces: 50
    sequence:
      - action: media_player.turn_on
        target:
          entity_id: media_player.basement_great_room_basement_atv
      - action: script.wait_for_basement_media_player_ready
      - delay:
          seconds: 10
      - action: media_player.select_source
        target:
          entity_id: media_player.lg_webos_smart_tv
        data:
          source: "HDMI 3"

  # Shared Plex-show launcher. Runs startup, selects Plex source, scans
  # for the Apple TV Plex client, then plays the requested show shuffled.
  watch_plex_show:
    alias: "Watch Plex Show"
    description: "Start the basement TV, open Plex, find the Apple TV Plex client, and play the requested show shuffled while pausing house audio."
    mode: parallel
    trace:
      stored_traces: 50
    fields:
      show_name:
        description: "Plex library show name (must match library exactly)"
        required: true
        selector:
          text:
    sequence:
      - action: script.watch_basement_tv_startup
      - action: media_player.select_source
        target:
          entity_id: media_player.basement_great_room_basement_atv
        data:
          source: "Plex"
      - delay:
          seconds: 2
      - action: button.press
        target:
          entity_id: button.fermentor_scan_clients
      - action: script.wait_for_basement_plex_client_ready
      - action: media_player.play_media
        target:
          entity_id: media_player.plex_basement_apple_tv
        data:
          media_content_type: EPISODE
          media_content_id: >-
            { "library_name": "TV", "show_name": "{{ show_name }}", "shuffle": "1" }
      - delay:
          seconds: 2
      - action: script.music_assistant_pause_house_audio
        continue_on_error: true

  watch_tv:
    alias: "Watch TV"
    description: "Start the basement TV on the live TV app."
    trace:
      stored_traces: 50
    sequence:
      - action: script.watch_basement_tv_startup
      - action: media_player.select_source
        target:
          entity_id: media_player.basement_great_room_basement_atv
        data:
          source: "YouTube TV"

  watch_youtube:
    alias: "Watch YouTube"
    description: "Start the basement TV on YouTube."
    trace:
      stored_traces: 50
    sequence:
      - action: script.watch_basement_tv_startup
      - action: media_player.select_source
        target:
          entity_id: media_player.basement_great_room_basement_atv
        data:
          source: "YouTube"

  watch_netflix:
    alias: "Watch Netflix"
    description: "Start the basement TV on Netflix and pause house audio."
    trace:
      stored_traces: 50
    sequence:
      - action: script.watch_basement_tv_startup
      - action: media_player.select_source
        target:
          entity_id: media_player.basement_great_room_basement_atv
        data:
          source: "Netflix"
      - delay:
          seconds: 2
      - action: script.music_assistant_pause_house_audio
        continue_on_error: true

  watch_plex:
    alias: "Watch Plex"
    description: "Start the basement TV on Plex and pause house audio."
    trace:
      stored_traces: 50
    sequence:
      - action: script.watch_basement_tv_startup
      - action: media_player.select_source
        target:
          entity_id: media_player.basement_great_room_basement_atv
        data:
          source: "Plex"
      - delay:
          seconds: 2
      - action: script.music_assistant_pause_house_audio
        continue_on_error: true

  watch_f1:
    alias: "Watch F1"
    description: "Start the basement TV on the F1 app and pause house audio."
    trace:
      stored_traces: 50
    sequence:
      - action: script.watch_basement_tv_startup
      - action: media_player.select_source
        target:
          entity_id: media_player.basement_great_room_basement_atv
        data:
          source: "F1 TV"
      - delay:
          seconds: 2
      - action: script.music_assistant_pause_house_audio
        continue_on_error: true

  watch_letterkenny:
    alias: "Watch Letterkenny"
    description: "Shuffle Letterkenny on the basement TV via Plex."
    trace:
      stored_traces: 50
    sequence:
      - action: script.watch_plex_show
        data:
          show_name: "Letterkenny"

  watch_the_simpsons:
    alias: "Watch The Simpsons"
    description: "Shuffle The Simpsons on the basement TV via Plex."
    trace:
      stored_traces: 50
    sequence:
      - action: script.watch_plex_show
        data:
          show_name: "The Simpsons"

  watch_american_dad:
    alias: "Watch American Dad"
    description: "Shuffle American Dad on the basement TV via Plex."
    trace:
      stored_traces: 50
    sequence:
      - action: script.watch_plex_show
        data:
          show_name: "American Dad"

  watch_aqua_teen:
    alias: "Watch Aqua Teen"
    description: "Shuffle Aqua Teen Hunger Force on the basement TV via Plex."
    trace:
      stored_traces: 50
    sequence:
      - action: script.watch_plex_show
        data:
          show_name: "Aqua Teen Hunger Force"

  watch_bobs_burgers:
    alias: "Watch Bobs Burgers"
    description: "Shuffle Bob's Burgers on the basement TV via Plex."
    trace:
      stored_traces: 50
    sequence:
      - action: script.watch_plex_show
        data:
          show_name: "Bob's Burgers"

  watch_ds9:
    alias: "Watch DS9"
    description: "Shuffle Star Trek: Deep Space Nine on the basement TV via Plex."
    trace:
      stored_traces: 50
    sequence:
      - action: script.watch_plex_show
        data:
          show_name: "Star Trek: Deep Space Nine"

  watch_rick_and_morty:
    alias: "Watch Rick and Morty"
    description: "Shuffle Rick and Morty on the basement TV via Plex."
    trace:
      stored_traces: 50
    sequence:
      - action: script.watch_plex_show
        data:
          show_name: "Rick and Morty"

  watch_tng:
    alias: "Watch TNG"
    description: "Shuffle Star Trek: The Next Generation on the basement TV via Plex."
    trace:
      stored_traces: 50
    sequence:
      - action: script.watch_plex_show
        data:
          show_name: "Star Trek: The Next Generation"
