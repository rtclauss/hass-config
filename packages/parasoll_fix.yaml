# IKEA PARASOLL (E2013) — battery drain & drop-off fix
#
# Root cause (github.com/Koenkk/zigbee2mqtt/issues/22579):
#   1. Drop off / marked offline: the factory MAXIMUM reporting interval of
#      65000 s (~18 h) on ssIasZone/zoneStatus (and the battery attributes) is
#      longer than any sane availability timeout, so a healthy sleepy device is
#      marked offline.  The community fix (jhenkens' reporting-interval
#      blueprint) clamps max to 14400 s (4 h); this package does the same via
#      script.parasoll_enforce_intervals.
#   2. Stuck state: a regression removed the ssIasZone binding and zoneStatus
#      min reporting was not 0, so rapid open/close pairs were dropped.  The
#      converter now binds ssIasZone on ep2 and sets zoneStatus min = 0.
#   3. Battery drain: largely a downstream symptom of (1) — drop-offs trigger
#      rejoin loops that burn the battery.  genPollCtrl is left unbound as a
#      precaution.
#
# This package pairs with zigbee2mqtt/external_converters/parasoll.js.
# Z2M 2.x auto-scans the external_converters/ subdirectory — no configuration.yaml
# entry is needed.
# Deployment order:
#   1. Ensure zigbee2mqtt/external_converters/parasoll.js is present.
#   2. Restart Zigbee2MQTT.  Devices should show "PARASOLL door/window sensor (patched)".
#   3. Run script.parasoll_reconfigure_all from Developer Tools or the UI.  This
#      reconfigures every joined sensor AND enforces the 14400 s max intervals.
#   4. For sensors that are fully unresponsive: pull the battery, reinsert, then
#      the automation below handles them automatically as they re-join.

################################################################
## Helpers
################################################################

input_text:
  parasoll_configure_state:
    name: "PARASOLL Configure State"
    # Compact CSV: <last4_ieee>:<mod_hour>,...
    # mod_hour = floor(unix_time / 3600) % 10000  — 4-digit cyclical counter
    #            that wraps every ~416 days; cooldown checks use modular diff.
    # Key is the last 4 hex chars of the device IEEE address, giving 65 536
    # possible values — collision is extremely unlikely across ~20 home devices.
    # Capacity: 25+ devices fit within the 255-char HA state limit.
    # Written on every configure attempt (success, failure, or timeout).
    # Used solely to gate notification frequency (1 h cooldown per device);
    # the configure decision is made from Z2M bridge/devices binding state.
    max: 255
    initial: ""

################################################################
## Scripts
################################################################

script:
  # Clamp the maximum reporting interval to 14400 s (4 h) on the three
  # attributes whose factory default of 65000 s (~18 h) lets PARASOLL sensors be
  # marked offline by availability checks (Koenkk/zigbee2mqtt#22579), and pin
  # zoneStatus min to 0 so rapid open/close pairs are never dropped.  This is the
  # actual drop-off fix; it mirrors jhenkens' reporting-interval blueprint.
  # Commands are queued by Z2M for sleepy devices and applied on the next wakeup.
  parasoll_enforce_intervals:
    alias: "PARASOLL - Enforce Reporting Intervals"
    description: >
      Sets maximum_report_interval = 14400 s on ssIasZone/zoneStatus (ep2),
      genPowerCfg/batteryPercentageRemaining (ep1) and genPowerCfg/batteryVoltage
      (ep1) for a single PARASOLL sensor, identified by IEEE address.  Mins and
      reportable changes are left at the herdsman-converters factory values
      (zoneStatus min 0; battery min 3600, change 10).
    fields:
      ieee:
        description: "IEEE address of the PARASOLL sensor."
        required: true
        example: "0x04e3e5fffec73748"
    # parallel so the per-device loop in parasoll_reconfigure_all and the
    # join/announce automation can both call it without serialising the fleet.
    mode: parallel
    max: 30
    trace:
      stored_traces: 10
    sequence:
      - repeat:
          for_each:
            - endpoint: 2
              cluster: ssIasZone
              attribute: zoneStatus
              minimum: 0
            - endpoint: 1
              cluster: genPowerCfg
              attribute: batteryPercentageRemaining
              minimum: 3600
              change: 10
            - endpoint: 1
              cluster: genPowerCfg
              attribute: batteryVoltage
              minimum: 3600
              change: 10
          sequence:
            - action: mqtt.publish
              data:
                topic: zigbee2mqtt/bridge/request/device/reporting/configure
                # reportable_change is omitted for zoneStatus (a bitmap) — it has
                # no "change" key in the loop, matching the proven blueprint.
                payload: >
                  {"id": "{{ ieee }}",
                   "endpoint": {{ repeat.item.endpoint }},
                   "cluster": "{{ repeat.item.cluster }}",
                   "attribute": "{{ repeat.item.attribute }}",
                   "minimum_report_interval": {{ repeat.item.minimum }},
                   "maximum_report_interval": 14400
                   {%- if repeat.item.change is defined %},
                   "reportable_change": {{ repeat.item.change }}
                   {%- endif %}}
            - delay:
                milliseconds: 300

  parasoll_reconfigure_all:
    alias: "PARASOLL - Reconfigure All"
    description: >
      For every joined PARASOLL sensor: presses the identify button to nudge the
      device awake, then sends a Z2M reconfigure command so the patched converter
      settings (ssIasZone binding, no genPollCtrl) are applied.  Both commands are
      queued by Z2M for sleepy devices and processed together on the next check-in.
      Sensors that are completely dead still need a battery pull first.
    mode: single
    trace:
      stored_traces: 10
    sequence:
      - variables:
          parasoll_devices: >
            {% set ns = namespace(devices=[]) %}
            {% for entity in states.binary_sensor %}
              {% if device_attr(entity.entity_id, 'model') == 'PARASOLL door/window sensor (patched)' %}
                {% set ids = device_attr(entity.entity_id, 'identifiers') | list %}
                {% for id_tuple in ids %}
                  {% if id_tuple[0] == 'mqtt' %}
                    {% set ieee = id_tuple[1] | replace('zigbee2mqtt_', '') %}
                    {% set identify_btn = device_entities(device_id(entity.entity_id))
                                          | select('match', 'button\\..*identify')
                                          | first | default('') %}
                    {% if ieee not in (ns.devices | map(attribute='ieee') | list) %}
                      {% set ns.devices = ns.devices + [{'ieee': ieee, 'identify': identify_btn}] %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {{ ns.devices }}
      - repeat:
          for_each: "{{ parasoll_devices }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.item.identify != '' }}"
              then:
                - action: button.press
                  target:
                    entity_id: "{{ repeat.item.identify }}"
            - delay:
                milliseconds: 500
            # Unbind genPollCtrl — devices paired with the stock converter
            # retain this binding even after the patched converter is loaded.
            # genPollCtrl is the cluster that writes an aggressive check-in
            # interval and is the primary cause of rapid battery drain.
            - action: mqtt.publish
              data:
                topic: zigbee2mqtt/bridge/request/device/unbind
                payload: >
                  {"from": "{{ repeat.item.ieee }}", "from_endpoint": "1",
                   "to": "Coordinator",
                   "clusters": ["genPollCtrl"]}
            - delay:
                milliseconds: 500
            - action: mqtt.publish
              data:
                topic: zigbee2mqtt/bridge/request/device/configure
                payload: '{"id": "{{ repeat.item.ieee }}"}'
            - delay:
                milliseconds: 1500
            # Clamp max reporting intervals to 14400 s AFTER configure, since
            # configure re-applies the converter's factory 65000 s max.
            - action: script.parasoll_enforce_intervals
              data:
                ieee: "{{ repeat.item.ieee }}"
            - delay:
                milliseconds: 500

################################################################
## Automations
################################################################

automation:
  - alias: "PARASOLL - Auto-Reconfigure on Join or Announce"
    id: parasoll_auto_reconfigure_on_join
    trace:
      stored_traces: 10
    description: >
      Reconfigures PARASOLL sensors only when the Z2M bridge/devices state shows
      a gap.  Four invariants are checked on every trigger:
        • ssIasZone bound on ep2       — device will send contact-state reports
        • genPollCtrl NOT bound on ep1 — no aggressive check-in → no battery drain
        • genPowerCfg has configured reportings — battery/voltage actively reported
        • max reporting interval ≤ 14400 s on zoneStatus + battery attrs —
          device reports often enough to never be marked offline (the actual
          drop-off fix; without it the factory 65000 s default applies)
      Triggers:
        • device_interview — brand-new join (always reconfigures; no bindings yet)
        • device_announce  — re-join / reboot (reconfigures only if bridge shows gap)
        • contact_change   — PARASOLL state change (reconfigures only if bridge shows
                             genPollCtrl bound or power reporting absent; active contact
                             report already proves IAS zone is enrolled)
      Notifications gated by 1 h since last successful configure per device;
      contact_change is always silent.
    mode: queued
    # The fleet is roughly 20 PARASOLL sensors, and each run can wait up to 60 s
    # for a sleepy-device configure response. Keep queued execution to avoid
    # input_text write races, but allow a full fleet burst plus headroom.
    max: 30
    trigger:
      - platform: mqtt
        topic: zigbee2mqtt/bridge/event
        id: bridge_event
      # State triggers fire for indoor/low-frequency PARASOLL sensors only.
      # High-frequency sensors (mailbox) are omitted — bridge_event handles them.
      # Using state (not MQTT wildcard) avoids triggering on every Z2M message.
      - platform: state
        entity_id:
          - binary_sensor.basement_window_contact
          - binary_sensor.dining_room_north_window_contact
          - binary_sensor.dining_room_south_window_contact
          - binary_sensor.guest_bathroom_window_contact
          - binary_sensor.guest_room_window_contact
          - binary_sensor.kitchen_bay_middle_window_contact
          - binary_sensor.kitchen_bay_north_window_contact
          - binary_sensor.kitchen_bay_south_window_contact
          - binary_sensor.kitchen_north_window_contact
          - binary_sensor.kitchen_south_window_contact
          - binary_sensor.office_window_contact
          - binary_sensor.owner_suite_bathroom_bay_north_middle_window_contact
          - binary_sensor.owner_suite_bathroom_bay_north_window_contact
          - binary_sensor.owner_suite_bathroom_bay_south_middle_window_contact
          - binary_sensor.owner_suite_bathroom_bay_south_window_contact
          - binary_sensor.owner_suite_north_window_contact
          - binary_sensor.owner_suite_south_window_contact
          - binary_sensor.powder_room_window_contact
          - binary_sensor.unfinished_basement_window_contact
        from:
          - "on"
          - "off"
        to:
          - "on"
          - "off"
        id: contact_change
    condition:
      - condition: template
        value_template: >
          {% if trigger.id == 'contact_change' %}
            true
          {% else %}
            {% set type = trigger.payload_json.type %}
            {% set ieee = trigger.payload_json.data.ieee_address %}
            {% if type == 'device_interview' %}
              {{ trigger.payload_json.data.get('definition', {}).get('model', '') == 'E2013' }}
            {% elif type == 'device_announce' %}
              {% set ns = namespace(found=false) %}
              {% for entity in states.binary_sensor %}
                {% if device_attr(entity.entity_id, 'model') == 'PARASOLL door/window sensor (patched)' %}
                  {% set ids = device_attr(entity.entity_id, 'identifiers') | list %}
                  {% for id_tuple in ids %}
                    {% if id_tuple[0] == 'mqtt' and id_tuple[1] == 'zigbee2mqtt_' ~ ieee %}
                      {% set ns.found = true %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
              {% endfor %}
              {{ ns.found }}
            {% else %}
              {{ false }}
            {% endif %}
          {% endif %}
    action:
      # Join/announce: wait for Z2M to finish interview setup.
      # Contact-change: no delay — device is awake right now; every ms counts
      # before it goes back to sleep and Z2M loses the unbind command.
      - delay:
          milliseconds: "{{ 5000 if trigger.id == 'bridge_event' else 0 }}"

      # ── Resolve device identity ──────────────────────────────────────────────
      - variables:
          _silent: "{{ trigger.id == 'contact_change' }}"
          _ieee: >
            {% if trigger.id == 'bridge_event' %}
              {{ trigger.payload_json.data.ieee_address }}
            {% else %}
              {% set ns = namespace(value='') %}
              {% for id_tuple in device_attr(trigger.entity_id, 'identifiers') | list %}
                {% if id_tuple[0] == 'mqtt' %}
                  {% set ns.value = id_tuple[1] | replace('zigbee2mqtt_', '') %}
                {% endif %}
              {% endfor %}
              {{ ns.value }}
            {% endif %}
          _name: >
            {% if trigger.id == 'bridge_event' %}
              {{ trigger.payload_json.data.friendly_name }}
            {% else %}
              {{ device_attr(trigger.entity_id, 'name') }}
            {% endif %}
          parasoll_identify_btn: >
            {% set ns = namespace(entity='') %}
            {% for entity in states.button %}
              {% if 'identify' in entity.entity_id %}
                {% for id_tuple in device_attr(entity.entity_id, 'identifiers') | list %}
                  {% if id_tuple[0] == 'mqtt' and id_tuple[1] == 'zigbee2mqtt_' ~ _ieee %}
                    {% set ns.entity = entity.entity_id %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {{ ns.entity }}

      # ── Query Z2M for current binding state (retained → instant) ────────────
      # bridge/devices is a retained topic; the broker delivers it immediately
      # on subscribe, so this wait completes in milliseconds in practice.
      - wait_for_trigger:
          - platform: mqtt
            topic: zigbee2mqtt/bridge/devices
        timeout:
          seconds: 5
        continue_on_timeout: true

      # ── Determine whether reconfiguration is actually needed ──────────────────
      # Parse the bridge/devices payload to find this device and inspect endpoints.
      # Four invariants must hold for the device to be considered fully configured:
      #   _ias_ok      — ssIasZone is bound on ep2 (PARASOLL IAS zone cluster is on
      #                  endpoint 2, confirmed by Z2M Bind tab "Source endpoint 2")
      #   _pollctrl_ok — genPollCtrl is NOT bound on ep1 (no aggressive check-in)
      #   _power_ok    — genPowerCfg has at least one configured reporting on ep1
      #   _interval_ok — max reporting interval ≤ 14400 s on zoneStatus (ep2) AND
      #                  on both battery attrs (ep1); false means the factory
      #                  65000 s default is still in effect → device drops off
      # device_interview always reconfigures (fresh join: no bindings exist yet).
      # If bridge/devices times out or device is absent, defaults to true (safe).
      - variables:
          _z2m_device: >
            {% if wait.trigger %}
              {{ (wait.trigger.payload_json
                   | selectattr('ieee_address', 'eq', _ieee)
                   | first | default(none)) }}
            {% else %}
              {{ none }}
            {% endif %}
          _ep1_bindings: >
            {% if _z2m_device %}
              {{ (_z2m_device.get('endpoints', {}).get('1', {})
                   .get('bindings', []) | map(attribute='cluster') | list) }}
            {% else %}
              []
            {% endif %}
          _ep2_bindings: >
            {% if _z2m_device %}
              {{ (_z2m_device.get('endpoints', {}).get('2', {})
                   .get('bindings', []) | map(attribute='cluster') | list) }}
            {% else %}
              []
            {% endif %}
          _ep1_reportings: >
            {% if _z2m_device %}
              {{ (_z2m_device.get('endpoints', {}).get('1', {})
                   .get('configured_reportings', []) | map(attribute='cluster') | list) }}
            {% else %}
              []
            {% endif %}
          # Full reporting objects (cluster + attribute + intervals) for the
          # _interval_ok check below.  _ep1_reportings above keeps only the
          # cluster names and is used solely for _power_ok.
          _ep1_reportings_full: >
            {% if _z2m_device %}
              {{ _z2m_device.get('endpoints', {}).get('1', {}).get('configured_reportings', []) }}
            {% else %}
              []
            {% endif %}
          _ep2_reportings_full: >
            {% if _z2m_device %}
              {{ _z2m_device.get('endpoints', {}).get('2', {}).get('configured_reportings', []) }}
            {% else %}
              []
            {% endif %}
          _ias_ok: "{{ 'ssIasZone' in _ep2_bindings }}"
          _pollctrl_ok: "{{ 'genPollCtrl' not in _ep1_bindings }}"
          _power_ok: "{{ 'genPowerCfg' in _ep1_reportings }}"
          _interval_ok: >
            {% set ns = namespace(zone=false, bpct=false, bv=false) %}
            {% for r in _ep2_reportings_full %}
              {% if r.cluster == 'ssIasZone' and r.attribute == 'zoneStatus'
                    and r.maximum_report_interval | int(99999) <= 14400 %}
                {% set ns.zone = true %}
              {% endif %}
            {% endfor %}
            {% for r in _ep1_reportings_full %}
              {% if r.cluster == 'genPowerCfg' and r.attribute == 'batteryPercentageRemaining'
                    and r.maximum_report_interval | int(99999) <= 14400 %}
                {% set ns.bpct = true %}
              {% endif %}
              {% if r.cluster == 'genPowerCfg' and r.attribute == 'batteryVoltage'
                    and r.maximum_report_interval | int(99999) <= 14400 %}
                {% set ns.bv = true %}
              {% endif %}
            {% endfor %}
            {{ ns.zone and ns.bpct and ns.bv }}
          _needs_configure: >
            {% if trigger.id == 'bridge_event' and trigger.payload_json.type == 'device_interview' %}
              true
            {% elif _z2m_device is none %}
              true
            {% else %}
              {{ not _ias_ok or not _pollctrl_ok or not _power_ok or not _interval_ok }}
            {% endif %}
          # Notification cooldown: suppress within 1 h of last configure attempt.
          # Store format: <last4_ieee>:<mod_hour>,...  (wraps every ~416 days).
          # contact_change is always silent regardless.
          _store: >
            {% set raw = states('input_text.parasoll_configure_state') | trim %}
            {% set ns = namespace(store={}) %}
            {% if raw.startswith('{') %}
              {% set ns.store = raw | from_json %}
            {% else %}
              {% for item in raw.split(',') if ':' in item %}
                {% set parts = item.split(':') %}
                {% set key = parts[0] | trim %}
                {% set hour = parts[1] | int(default=none) %}
                {% if key | length == 4 and hour is number %}
                  {% set ns.store = dict(ns.store, **{key: hour}) %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.store }}
          _cur_h: "{{ (now().timestamp() / 3600) | int % 10000 }}"
          _prev_h: "{{ _store.get(_ieee[-4:]) }}"
          _hours_since: >
            {% if _prev_h is none %}
              9999
            {% else %}
              {{ (_cur_h | int - _prev_h | int) % 10000 }}
            {% endif %}
          _can_notify: "{{ not _silent and _hours_since | int >= 1 }}"

      # ── Skip if bridge/devices confirms all three invariants hold ───────────────
      - if:
          - condition: template
            value_template: "{{ _needs_configure }}"
        then:
          # Press identify only on join/announce to nudge the device awake.
          # On contact_change the device is already awake — no need.
          - if:
              - condition: template
                value_template: "{{ parasoll_identify_btn != '' and not _silent }}"
            then:
              - action: button.press
                target:
                  entity_id: "{{ parasoll_identify_btn }}"
              - delay:
                  seconds: 2

          - if:
              - condition: template
                value_template: "{{ _can_notify }}"
            then:
              - action: notify.mobile_app_wethop
                data:
                  title: "PARASOLL"
                  message: "Reconfiguring {{ _name }}…"

          - action: mqtt.publish
            data:
              topic: zigbee2mqtt/bridge/request/device/unbind
              payload: >
                {"from": "{{ _ieee }}",
                 "from_endpoint": "1", "to": "Coordinator",
                 "clusters": ["genPollCtrl"]}
          - delay:
              milliseconds: 500
          - action: mqtt.publish
            data:
              topic: zigbee2mqtt/bridge/request/device/configure
              payload: '{"id": "{{ _ieee }}"}'
          - wait_for_trigger:
              - platform: mqtt
                topic: zigbee2mqtt/bridge/response/device/configure
                value_template: "{{ value_json.data.get('id') == _ieee }}"
            timeout:
              seconds: 60
            continue_on_timeout: true

          # Clamp max reporting intervals to 14400 s AFTER configure, since
          # configure re-applies the converter's factory 65000 s max.  This is
          # the actual drop-off fix (Koenkk/zigbee2mqtt#22579).
          - action: script.parasoll_enforce_intervals
            data:
              ieee: "{{ _ieee }}"

          # ── Update persistent store (gates notification cooldown) ───────────────
          # Always stamp the device after a configure attempt so _can_notify
          # suppresses repeat notifications for 1 h regardless of outcome.
          # configure failed / queued still counts — the user was already told.
          - variables:
              _configure_ok: >
                {% set resp = wait.trigger.payload_json if wait.trigger else none %}
                {{ resp is not none and resp.get('status') == 'ok' }}
          - action: input_text.set_value
            target:
              entity_id: input_text.parasoll_configure_state
            data:
              value: >
                {% set raw = states('input_text.parasoll_configure_state') | trim %}
                {% set key = _ieee[-4:] %}
                {% set hour = ((now().timestamp() / 3600) | int % 10000) | string %}
                {% set ns = namespace(pairs=[], replaced=false) %}
                {% if raw.startswith('{') %}
                  {% set store = raw | from_json %}
                  {% for item_key, item_hour in store.items() %}
                    {% if item_key == key %}
                      {% set ns.pairs = ns.pairs + [key ~ ':' ~ hour] %}
                      {% set ns.replaced = true %}
                    {% else %}
                      {% set ns.pairs = ns.pairs + [item_key ~ ':' ~ item_hour] %}
                    {% endif %}
                  {% endfor %}
                {% else %}
                  {% for item in raw.split(',') if ':' in item %}
                    {% set parts = item.split(':') %}
                    {% set item_key = parts[0] | trim %}
                    {% set item_hour = parts[1] | int(default=none) %}
                    {% if item_key == key %}
                      {% set ns.pairs = ns.pairs + [key ~ ':' ~ hour] %}
                      {% set ns.replaced = true %}
                    {% elif item_key | length == 4 and item_hour is number %}
                      {% set ns.pairs = ns.pairs + [item_key ~ ':' ~ item_hour] %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
                {% if not ns.replaced %}
                  {% set ns.pairs = ns.pairs + [key ~ ':' ~ hour] %}
                {% endif %}
                {{ ns.pairs | join(',') }}

          - if:
              - condition: template
                value_template: "{{ _can_notify }}"
            then:
              - action: notify.mobile_app_wethop
                data:
                  title: "PARASOLL"
                  message: >
                    {% set resp = wait.trigger.payload_json if wait.trigger else none %}
                    {% if resp and resp.get('status') == 'ok' %}
                      ✓ {{ _name }} — all settings applied
                    {% elif resp %}
                      ✗ {{ _name }} — {{ resp.get('data', {}).get('error', 'configure failed') }}
                    {% else %}
                      ⏳ {{ _name }} — configure queued (sleepy; settings apply on next wakeup)
                    {% endif %}
