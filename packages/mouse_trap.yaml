homeassistant:
  customize:
    package.node_anchors:
      customize: &customize
        package: "mouse_trap"

########################
## Counter
########################
counter:
  mice_caught:
    name: "Mice Caught"
    icon: mdi:rodent
    minimum: 0
    restore: true

########################
## Automation
########################
automation:
  - id: mouse_bucket_notify_and_count_on_catch
    alias: "Mouse Bucket — Notify and count on catch"
    description: >
      When the mouse bucket door sensor opens (closed→open), increment the
      mice caught counter and send a notification with the running total.
    trace:
      stored_traces: 100
    trigger:
      - platform: state
        entity_id: binary_sensor.basement_mouse_bucket_contact
        from: "off"
        to: "on"
    action:
      - action: counter.increment
        target:
          entity_id: counter.mice_caught
      - action: notify.notify
        data:
          title: "Mouse Caught!"
          message: >
            The basement mouse bucket door opened.
            Total caught: {{ states('counter.mice_caught') }}.
          data:
            tag: mice-caught
            group: mouse-trap
            # Long-press (iOS) or expand (Android) to reveal the action.
            actions:
              - action: MICE_CAUGHT_RESET
                title: "Reset to zero"
                destructive: true
    mode: single

  - id: mouse_bucket_reset_counter_from_notification
    alias: "Mouse Bucket — Reset counter from notification"
    description: >
      Reset the mice caught counter to zero when the "Reset to zero" action
      is chosen on the catch notification.
    trace:
      stored_traces: 10
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: MICE_CAUGHT_RESET
    action:
      - action: counter.reset
        target:
          entity_id: counter.mice_caught
      - action: notify.notify
        data:
          title: "Mouse Counter Reset"
          message: "Mice caught counter reset to {{ states('counter.mice_caught') }}."
          data:
            tag: mice-caught
            group: mouse-trap
    mode: single
