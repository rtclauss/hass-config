# Reporting only. Trigger restoration and evidence attributes require YAML templates.
# These observers never call services or change device-control policy.
template:
- triggers:
  - trigger: state
    entity_id:
    - input_boolean.trip
    - sensor.next_flight_home_arrival
    - sensor.pre_arrival_clean_start
    - sensor.pre_arrival_clean_finish_by
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: dashboard_status_refresh
  sensor:
  - name: Dashboard Return Cycle
    unique_id: dashboard_return_cycle
    default_entity_id: sensor.dashboard_return_cycle
    state: '{% from ''dashboard_status.jinja'' import cycle %}{{ (cycle(this.attributes, trigger) | from_json).cycle_id }}'
    attributes:
      cycle_id: '{% from ''dashboard_status.jinja'' import cycle %}{{ (cycle(this.attributes, trigger) | from_json).cycle_id
        }}'
      landing_at: '{% from ''dashboard_status.jinja'' import cycle %}{{ (cycle(this.attributes, trigger) | from_json).landing_at
        }}'
      window_start: '{% from ''dashboard_status.jinja'' import cycle %}{{ (cycle(this.attributes, trigger) | from_json).window_start
        }}'
      finish_by: '{% from ''dashboard_status.jinja'' import cycle %}{{ (cycle(this.attributes, trigger) | from_json).finish_by
        }}'
      trip_started_at: '{% from ''dashboard_status.jinja'' import cycle %}{{ (cycle(this.attributes, trigger) | from_json).trip_started_at
        }}'
      closed_at: '{% from ''dashboard_status.jinja'' import cycle %}{{ (cycle(this.attributes, trigger) | from_json).closed_at
        }}'
- triggers:
  - trigger: mqtt
    topic: valetudo/upstairs-vacuum/StatusStateAttribute/status
  sensor:
  - name: Dashboard Upstairs Activity
    unique_id: dashboard_upstairs_activity
    default_entity_id: sensor.dashboard_upstairs_activity
    state: '{{ trigger.payload if trigger.payload in [''error'', ''docked'', ''idle'', ''returning'', ''cleaning'', ''paused'',
      ''manual_control'', ''moving''] else ''unknown'' }}'
    attributes:
      source: valetudo/upstairs-vacuum/StatusStateAttribute/status
      observed_at: '{{ this.attributes.get(''observed_at'', '''') if this.state == trigger.payload else now().isoformat()
        }}'
      reason: Activity only; retained messages and docking do not prove completion.
- sensor:
  - name: Dashboard Context
    unique_id: dashboard_context
    default_entity_id: sensor.dashboard_context
    state: '{% from ''dashboard_status.jinja'' import context %}{{ context() }}'
  - name: Dashboard Readiness Security
    unique_id: dashboard_readiness_security
    default_entity_id: sensor.dashboard_readiness_security
    state: '{% from ''dashboard_status.jinja'' import readiness %}{{ (readiness(''security'') | from_json).status }}'
    attributes:
      reason: '{% from ''dashboard_status.jinja'' import readiness %}{{ (readiness(''security'') | from_json).reason }}'
      evidence_at: '{% from ''dashboard_status.jinja'' import readiness %}{{ (readiness(''security'') | from_json).evidence_at
        }}'
      source: '{% from ''dashboard_status.jinja'' import readiness %}{{ (readiness(''security'') | from_json).source }}'
      cycle_id: '{% from ''dashboard_status.jinja'' import readiness %}{{ (readiness(''security'') | from_json).cycle_id }}'
