# Home Assistant package for whole-house water usage insights built on top
# of the water meter (packages/water_meter.yaml, water_meter/) and existing
# appliance instrumentation (packages/cleaning.yaml).
#
# What's here today:
#   - Detecting the dishwasher and washing machine running at the same time,
#     reusing their existing power/vibration-derived binary sensors.
#   - Per-bathroom "humidity event" duration/count tracking, reusing the
#     humidity-high binary sensors that already drive the bathroom exhaust
#     fan automation (packages/climate.yaml). This tracks any hot-water
#     humidity spike (shower or bath fill) - there's no fixture-level sensor
#     to tell those apart yet.
#   - An armed-away/armed-night leak check against the whole-house meter:
#     if the reading keeps climbing while nobody should be using water, it
#     alerts once per armed episode.
#
# What's NOT here, because there's no sensor to build on yet: water heater,
# tubs (as distinct from showers), reverse osmosis, sprinklers/irrigation,
# and sinks have zero existing instrumentation in this config. Each would
# need its own hardware (a power/flow sensor, a smart valve, etc.) before an
# automation here could mean anything. See docs/water_meter.md for the
# water meter's own 10-minute polling cadence, which is too coarse to
# disaggregate short single-fixture events (e.g. one shower) from the
# whole-house total - that only works for something as sustained/obvious as
# an all-night leak.

################################################################
## Packages / Water Usage
################################################################

homeassistant:
  customize:
    package.node_anchors:
      customize: &customize
        package: "water_usage"

    binary_sensor.dishwasher_and_washer_running:
      <<: *customize
      friendly_name: "Dishwasher And Washer Running Together"
      icon: mdi:water-alert

    sensor.owner_suite_bathroom_humidity_events_today:
      <<: *customize
      friendly_name: "Owner Suite Bathroom Humidity Events Today"
      icon: mdi:shower-head
    sensor.owner_suite_bathroom_humid_time_today:
      <<: *customize
      friendly_name: "Owner Suite Bathroom Humid Time Today"
      icon: mdi:timer-water-outline

    sensor.basement_bathroom_humidity_events_today:
      <<: *customize
      friendly_name: "Basement Bathroom Humidity Events Today"
      icon: mdi:shower-head
    sensor.basement_bathroom_humid_time_today:
      <<: *customize
      friendly_name: "Basement Bathroom Humid Time Today"
      icon: mdi:timer-water-outline

    sensor.guest_bathroom_humidity_events_today:
      <<: *customize
      friendly_name: "Guest Bathroom Humidity Events Today"
      icon: mdi:shower-head
    sensor.guest_bathroom_humid_time_today:
      <<: *customize
      friendly_name: "Guest Bathroom Humid Time Today"
      icon: mdi:timer-water-outline

########################
## Automation
########################
automation:
  - id: water_leak_while_armed
    alias: water_leak_while_armed
    trace:
      stored_traces: 10
    trigger:
      - trigger: state
        entity_id: sensor.water_meter
    condition:
      - alias: "Reading actually changed (not a startup/unavailable blip)"
        condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state not in ['unknown', 'unavailable'] }}
      - alias: "House has been armed away or armed night for a while"
        condition: state
        entity_id: alarm_control_panel.home_alarm
        state:
          - armed_away
          - armed_night
        for:
          minutes: 20
      - alias: "Rise is bigger than normal meter jitter"
        condition: template
        value_template: >-
          {{ (trigger.to_state.state | float(0)) - (trigger.from_state.state | float(0))
             > (states('input_number.water_leak_threshold_gallons') | float(1)) }}
      - alias: "Haven't already alerted for this armed episode"
        condition: state
        entity_id: input_boolean.water_leak_alert_sent
        state: "off"
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.water_leak_alert_sent
      - action: persistent_notification.create
        data:
          title: Possible water leak
          message: >-
            The water meter rose from {{ trigger.from_state.state }} to
            {{ trigger.to_state.state }} gallons while the house has been
            {{ states('alarm_control_panel.home_alarm') }} for at least 20
            minutes - nothing should be drawing water right now. Check for a
            running toilet, dripping fixture, or irrigation leak.
      - action: notify.all
        data:
          title: Possible water leak
          message: >-
            Water meter is rising while the house is armed - check for a leak.

  - id: water_leak_alert_reset
    alias: water_leak_alert_reset
    trace:
      stored_traces: 10
    trigger:
      - trigger: state
        entity_id: alarm_control_panel.home_alarm
        to: disarmed
    condition:
      - condition: state
        entity_id: input_boolean.water_leak_alert_sent
        state: "on"
    action:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.water_leak_alert_sent

########################
# Input Boolean
########################
input_boolean:
  water_leak_alert_sent:
    name: Water Leak Alert Sent
    icon: mdi:bell-check

########################
# Input Number
########################
input_number:
  water_leak_threshold_gallons:
    name: Water Leak Alert Threshold
    icon: mdi:water-alert-outline
    min: 0.2
    max: 20
    mode: box
    step: 0.1
    unit_of_measurement: gal
    initial: 1.0

########################
## Sensor
########################
sensor:
  - platform: history_stats
    name: Owner Suite Bathroom Humidity Events Today
    unique_id: owner_suite_bathroom_humidity_events_today
    entity_id: binary_sensor.bathroom_humidity_high
    state: "on"
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Owner Suite Bathroom Humid Time Today
    unique_id: owner_suite_bathroom_humid_time_today
    entity_id: binary_sensor.bathroom_humidity_high
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Basement Bathroom Humidity Events Today
    unique_id: basement_bathroom_humidity_events_today
    entity_id: binary_sensor.basement_bathroom_humidity_high
    state: "on"
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Basement Bathroom Humid Time Today
    unique_id: basement_bathroom_humid_time_today
    entity_id: binary_sensor.basement_bathroom_humidity_high
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Guest Bathroom Humidity Events Today
    unique_id: guest_bathroom_humidity_events_today
    entity_id: binary_sensor.guest_bathroom_humidity_high
    state: "on"
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Guest Bathroom Humid Time Today
    unique_id: guest_bathroom_humid_time_today
    entity_id: binary_sensor.guest_bathroom_humidity_high
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"

########################
## Template
########################
template:
  - binary_sensor:
      - name: dishwasher_and_washer_running
        unique_id: dishwasher_and_washer_running
        state: >-
          {{ is_state('binary_sensor.dishwasher_running', 'on')
             and is_state('binary_sensor.washing_machine_running', 'on') }}
