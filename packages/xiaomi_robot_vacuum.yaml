scene: []

########################
# Scripts
########################
script:
  x40_ultra_main_level_vacuum_only:
    alias: "X40 Ultra Main Level Vacuum Only"
    description: >-
      Run a sweeping-only pass across all mapped main-level X40 Ultra rooms.
    mode: queued
    trace:
      stored_traces: 10
    sequence:
      - action: dreame_vacuum.vacuum_set_custom_cleaning
        target:
          entity_id: vacuum.x40_ultra
        data:
          segment_id: [4, 3, 1, 2, 6, 5]
          suction_level: [1, 1, 1, 1, 1, 1]
          water_volume: [1, 1, 1, 1, 1, 1]
          wetness_level: [16, 16, 16, 16, 16, 16]
          cleaning_mode: [0, 0, 0, 0, 0, 0]
          repeats: [1, 1, 1, 1, 1, 1]
          mop_temperature: [0, 0, 0, 0, 0, 0]
          mop_pressure: [0, 0, 0, 0, 0, 0]
      - action: dreame_vacuum.vacuum_clean_segment
        target:
          entity_id: vacuum.x40_ultra
        data:
          segments: [4, 3, 1, 2, 6, 5]
          repeats: 1
          suction_level: 1

  x40_ultra_main_level_mop_after_vacuum:
    alias: "X40 Ultra Main Level Mop After Vacuum"
    description: >-
      Vacuum the full main level first, then run a mop-only pass and update the
      persistent mop schedule only after the mop pass finishes successfully.
    mode: queued
    trace:
      stored_traces: 10
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.x40_ultra_mop_pass_pending
      - action: script.x40_ultra_main_level_vacuum_only
      - wait_for_trigger:
          - trigger: state
            entity_id: vacuum.x40_ultra
            to: "cleaning"
          - trigger: state
            entity_id: sensor.x40_ultra_task_status
            to: "cleaning"
        timeout:
          minutes: 10
        continue_on_timeout: true
      - wait_for_trigger:
          - trigger: state
            entity_id: vacuum.x40_ultra
            to: "docked"
          - trigger: state
            entity_id: vacuum.x40_ultra
            to: "idle"
          - trigger: state
            entity_id: vacuum.x40_ultra
            to: "error"
          - trigger: state
            entity_id: sensor.x40_ultra_task_status
            to: "completed"
          - trigger: state
            entity_id: sensor.x40_ultra_task_status
            to: "failed"
        timeout:
          hours: 6
        continue_on_timeout: true
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: vacuum.x40_ultra
                state: "error"
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.x40_ultra_task_status
                state: "failed"
        then:
          - action: dreame_vacuum.vacuum_set_custom_cleaning
            target:
              entity_id: vacuum.x40_ultra
            data:
              segment_id: [4, 3, 1, 2, 6, 5]
              suction_level: [0, 0, 0, 0, 0, 0]
              water_volume: [2, 2, 2, 2, 2, 2]
              wetness_level: [16, 16, 16, 16, 16, 16]
              cleaning_mode: [1, 1, 1, 1, 1, 1]
              repeats: [1, 1, 1, 1, 1, 1]
              mop_temperature: [1, 1, 1, 1, 1, 1]
              mop_pressure: [2, 2, 2, 2, 2, 2]
          - action: dreame_vacuum.vacuum_clean_segment
            target:
              entity_id: vacuum.x40_ultra
            data:
              segments: [4, 3, 1, 2, 6, 5]
              repeats: 1
              water_volume: 2
          - wait_for_trigger:
              - trigger: state
                entity_id: vacuum.x40_ultra
                to: "cleaning"
              - trigger: state
                entity_id: sensor.x40_ultra_task_status
                to: "cleaning"
            timeout:
              minutes: 10
            continue_on_timeout: true
          - wait_for_trigger:
              - trigger: state
                entity_id: vacuum.x40_ultra
                to: "docked"
              - trigger: state
                entity_id: vacuum.x40_ultra
                to: "idle"
              - trigger: state
                entity_id: vacuum.x40_ultra
                to: "error"
              - trigger: state
                entity_id: sensor.x40_ultra_task_status
                to: "completed"
              - trigger: state
                entity_id: sensor.x40_ultra_task_status
                to: "failed"
            timeout:
              hours: 6
            continue_on_timeout: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ wait.completed
                         and not is_state('vacuum.x40_ultra', 'error')
                         and not is_state('sensor.x40_ultra_task_status', 'failed') }}
                sequence:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.x40_ultra_last_mopped_at
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.x40_ultra_mop_pass_pending
            default:
              - action: notify.all
                data:
                  data:
                    url: "/ryan-new-mushroom/cleaning"
                  message: >-
                    X40 Ultra mop pass did not complete; it will retry on the
                    next scheduled cleaning run.
        else:
          - action: notify.all
            data:
              data:
                url: "/ryan-new-mushroom/cleaning"
              message: >-
                X40 Ultra vacuum pass did not complete, so the mop pass was
                deferred until the next scheduled cleaning run.

  x40_ultra_main_level_policy_clean:
    alias: "X40 Ultra Main Level Policy Clean"
    description: >-
      Vacuum the main level every run, and add a mop pass when forced, pending,
      or the last successful mop is at least three days old.
    mode: queued
    trace:
      stored_traces: 10
    fields:
      force_mop:
        description: "Force a mop pass regardless of the last successful mop timestamp."
        example: true
    variables:
      force_mop_requested: "{{ force_mop | default(false) | bool }}"
      last_mopped_timestamp: >-
        {% set raw = states('input_datetime.x40_ultra_last_mopped_at') %}
        {{ as_timestamp(raw, default=0) }}
      mop_due: >-
        {{ force_mop_requested
           or is_state('input_boolean.x40_ultra_mop_pass_pending', 'on')
           or (last_mopped_timestamp | float(0)) <= 0
           or as_timestamp(now()) - (last_mopped_timestamp | float(0)) >= 3 * 24 * 60 * 60 }}
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ mop_due }}"
            sequence:
              - action: script.x40_ultra_main_level_mop_after_vacuum
        default:
          - action: script.x40_ultra_main_level_vacuum_only

  vacuum_main_level_full_floor:
    alias: "Vacuum Main Level Full Floor"
    description: >-
      Run the X40 Ultra main-level cleaning policy.
    mode: queued
    trace:
      stored_traces: 10
    fields:
      force_mop:
        description: "Force a mop pass after the vacuum pass."
        example: true
    sequence:
      - action: script.x40_ultra_main_level_policy_clean
        data:
          force_mop: "{{ force_mop | default(false) | bool }}"

  vacuum_upstairs_full_floor:
    alias: "Vacuum Upstairs Full Floor"
    trace:
      stored_traces: 10
    sequence:
      - action: mqtt.publish
        data:
          topic: valetudo/upstairs-vacuum/BasicControlCapability/operation/set
          payload: START

  vacuum_main_and_upstairs_levels:
    alias: "Vacuum Main And Upstairs Levels"
    description: Run one full-floor cleaning pass on both resident levels.
    mode: queued
    trace:
      stored_traces: 10
    fields:
      force_mop:
        description: "Force a main-level mop pass after the X40 vacuum pass."
        example: true
    sequence:
      - action: script.vacuum_main_level_full_floor
        data:
          force_mop: "{{ force_mop | default(false) | bool }}"
        continue_on_error: true
      - action: script.vacuum_upstairs_full_floor
        continue_on_error: true

  vacuum_master_bedroom:
    alias: "Vacuum Master Bedroom"
    trace:
      stored_traces: 10
    sequence:
      - action: mqtt.publish
        data:
          topic: valetudo/upstairs-vacuum/MapSegmentationCapability/clean/set
          payload: >-
            {"action": "start_segment_action","segment_ids": ["7"],"iterations": 4,"customOrder": true}

  vacuum_guest_room:
    alias: "Vacuum Guest Room"
    trace:
      stored_traces: 10
    sequence:
      - action: mqtt.publish
        data:
          topic: valetudo/upstairs-vacuum/MapSegmentationCapability/clean/set
          payload: >-
            {"action": "start_segment_action","segment_ids": ["5"],"iterations": 4,"customOrder": true}
  vacuum_bathroom:
    alias: "Vacuum Bathroom"
    trace:
      stored_traces: 10
    sequence:
      - action: mqtt.publish
        data:
          topic: valetudo/upstairs-vacuum/MapSegmentationCapability/clean/set
          payload: >-
            {"action": "start_segment_action","segment_ids": ["4"],"iterations": 4,"customOrder": true}
  # Entryway not working correctly
  vacuum_hallway:
    alias: "Vacuum Hallway"
    trace:
      stored_traces: 10
    sequence:
      - action: mqtt.publish
        data:
          topic: valetudo/upstairs-vacuum/MapSegmentationCapability/clean/set
          payload: >-
            {"action": "start_segment_action","segment_ids": ["6","1"],"iterations": 4,"customOrder": true}
  vacuum_kitchen:
    alias: "Vacuum Kitchen"
    trace:
      stored_traces: 10
    sequence:
      - action: dreame_vacuum.vacuum_clean_segment
        target:
          entity_id: vacuum.x40_ultra
        data:
          segments: 4
          repeats: 1
          suction_level: 1
  vacuum_living_room:
    alias: "Vacuum Living Room"
    trace:
      stored_traces: 10
    sequence:
      - action: dreame_vacuum.vacuum_clean_segment
        target:
          entity_id: vacuum.x40_ultra
        data:
          segments: 5
          repeats: 1
          suction_level: 1
  vacuum_office:
    alias: "Vacuum Office"
    trace:
      stored_traces: 10
    sequence:
      - action: mqtt.publish
        data:
          topic: valetudo/upstairs-vacuum/MapSegmentationCapability/clean/set
          payload: >-
            {"action": "start_segment_action","segment_ids": ["2"],"iterations": 4,"customOrder": true}

