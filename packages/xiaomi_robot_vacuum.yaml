########################
# Alarm Panel
########################
alarm_control_panel: []

########################
## Automation
########################
automation:
  - alias: "Resume vacuum on error (den)"
    id: resume_vacuum_on_error_den
    mode: single
    trace:
      stored_traces: 10
    trigger:
      - trigger: state
        entity_id: vacuum.valetudo_den
        to: "error"
    condition:
      - condition: state
        entity_id: binary_sensor.den_doors_contact
        state: "off"
      - condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
    action:
      - delay: "00:00:05"
      - action: vacuum.start
        target:
          entity_id: vacuum.valetudo_den

  - id: x40_ultra_force_clean_after_four_home_days
    alias: x40_ultra_force_clean_after_four_home_days
    description: >-
      Run a forced main-level mop cycle when the house has stayed occupied for
      four days, so floors still get mopped even without an away trigger.
    mode: single
    trace:
      stored_traces: 10
    trigger:
      - trigger: time
        at: "13:00:00"
      - trigger: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
      - condition: state
        entity_id: binary_sensor.bayesian_zeke_home
        state: "on"
        for:
          days: 4
      - condition: state
        entity_id: binary_sensor.bayesian_bed_occupancy
        state: "off"
    action:
      - action: script.vacuum_main_and_upstairs_levels
        data:
          force_mop: true

