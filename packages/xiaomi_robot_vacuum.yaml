# Home Assistant package for the Xiaomi/Valetudo vacuum.
# It wraps whole-floor and room-cleaning scripts, schedule helpers, and error
# recovery so the vacuum can be controlled by name instead of raw segment
# commands.

################################################################
## Packages / Xiaomi Vacuum
################################################################

################################################
## Customize
################################################

homeassistant:
  customize:
    ################################################
    ## Node Anchors
    ################################################

    package.node_anchors:
      customize: &customize
        package: "vacuum"

      expose: &expose
        <<: *customize
        haaska_hidden: false
        homebridge_hidden: false

    ################################################
    ## Alarm Panels
    ################################################

    ################################################
    ## Automations
    ################################################

    ################################################
    ## Binary Sensors
    ################################################

    ################################################
    ## Cameras
    ################################################

    ################################################
    ## Device Trackers
    ################################################

    ################################################
    ## Frontend
    ################################################

    ################################################
    ## Groups
    ################################################

    ################################################
    ## Input Boolean
    ################################################

    ################################################
    ## Input Numbers
    ################################################

    ################################################
    ## Input Select
    ################################################

    ################################################
    ## iOS
    ################################################

    ################################################
    ## Light
    ################################################

    ################################################
    ## Media Player
    ################################################

    ################################################
    ## Plant
    ################################################

    ################################################
    ## Proximity
    ################################################

    ################################################
    ## Scripts
    ################################################

    ################################################
    ## Sensors
    ################################################

    ################################################
    ## Thermostats
    ################################################

    ################################################
    ## Zone
    ################################################

########################
# Alarm Panel
########################
alarm_control_panel: []

########################
## Automation
########################
automation:
  - alias: "Resume vacuum on error (den)"
    id: resume_vacuum_on_error_den
    mode: single
    trace:
      stored_traces: 10
    trigger:
      - trigger: state
        entity_id: vacuum.valetudo_den
        to: "error"
    action:
      - delay: "00:00:05"
      - action: script.vacuum_den_pet_safe_start

  - id: x40_ultra_maintenance_clean_after_four_home_days
    alias: x40_ultra_maintenance_clean_after_four_home_days
    description: >-
      Run a daily main-level maintenance clean at 13:00 once the house has stayed
      occupied for four days, so floors still get cleaned even without an away
      trigger. Main level only (the X40) — it does NOT start the upstairs robot,
      to avoid running bedroom/guest-area vacuums at 13:00 while someone is home.
      Does NOT force a mop: the policy vacuums every run and mops only when due
      (mop pending, or last successful mop >= 3 days old), so this fires daily
      but mops roughly every three days instead of every day.
    mode: single
    trace:
      stored_traces: 10
    trigger:
      # Only the 13:00 window — no `homeassistant: start` trigger, which would
      # otherwise fire this clean at arbitrary restart/reload times (e.g. an
      # evening config reload) whenever the streak condition happens to hold.
      - trigger: time
        at: "13:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
      - condition: state
        entity_id: binary_sensor.bayesian_zeke_home
        state: "on"
      - condition: state
        entity_id: binary_sensor.bayesian_bed_occupancy
        state: "off"
      # Four continuous home days, measured from when the house last BECAME home
      # (the start of the current streak) via a persistent timestamp, so it
      # counts real occupancy and survives HA restarts. Returning from a long
      # trip does NOT immediately satisfy this: the streak restarts at the
      # return. An unset value (epoch 0) reads as "streak unknown" -> does not
      # fire (conservative), until the first return or startup seed records it.
      - condition: template
        value_template: >-
          {% set hs = as_timestamp(states('input_datetime.x40_ultra_home_since_at'), default=0) %}
          {{ hs > 0 and (as_timestamp(now()) - hs) >= 4 * 24 * 60 * 60 }}
    action:
      - action: script.vacuum_main_level_full_floor

  - id: vacuum_pet_policy_acclimation_dock
    alias: vacuum_pet_policy_acclimation_dock
    description: >-
      Fail closed when the pet-safety policy enters Acclimation by stopping
      active cleaning and returning all three robots to their docks. Also
      reconciles on Home Assistant startup: the helper is re-initialized to
      Acclimation during entity setup (before this listener is active), so no
      to:"Acclimation" transition is observed — but the documented fail-closed
      default after every restart means a robot that was cleaning through the
      restart must still be docked.
    mode: restart
    trace:
      stored_traces: 10
    trigger:
      - trigger: state
        entity_id: input_select.vacuum_pet_policy
        to: "Acclimation"
      - trigger: homeassistant
        event: start
    action:
      - action: script.vacuum_dock_all_robots

  - id: vacuum_dock_supervised_on_presence_loss
    alias: vacuum_dock_supervised_on_presence_loss
    description: >-
      Supervised runs assume the owner is present to watch the cats. If confirmed
      presence is lost (bayesian_zeke_home -> off) while the policy is still
      Supervised, dock all robots so a room clean started while home cannot keep
      running with nobody present. Unattended is unaffected (it is the explicit
      hands-off mode); Acclimation already docks on entry.
    mode: single
    trace:
      stored_traces: 10
    trigger:
      - trigger: state
        entity_id: binary_sensor.bayesian_zeke_home
        to: "off"
    condition:
      - condition: state
        entity_id: input_select.vacuum_pet_policy
        state: "Supervised"
    action:
      - action: script.vacuum_dock_all_robots

  - id: x40_ultra_record_home_since
    alias: x40_ultra_record_home_since
    description: >-
      Persist the timestamp the house last became home (start of the current
      home streak) so the four-home-days maintenance clean measures real
      occupancy and survives HA restarts. Set on the away->home edge; seeded once
      on startup if never recorded. A restart mid-streak keeps the existing value
      (the from:"off" trigger ignores the unknown->on transition at startup, and
      the startup seed only fires when the value is unset), so the streak is not
      reset.
    mode: single
    trace:
      stored_traces: 10
    trigger:
      - trigger: state
        entity_id: binary_sensor.bayesian_zeke_home
        from: "off"
        to: "on"
        id: returned
      - trigger: homeassistant
        event: start
        id: boot
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: returned
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.x40_ultra_home_since_at
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - conditions:
              - condition: trigger
                id: boot
              - condition: template
                value_template: >-
                  {{ as_timestamp(states('input_datetime.x40_ultra_home_since_at'), default=0) <= 0 }}
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.x40_ultra_home_since_at
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

########################
# Binary Sensors
########################
binary_sensor: []

########################
# Cameras
########################
camera: []

########################
# Device Trackers
########################
device_tracker: []

########################
# Frontend
########################
frontend: {}

########################
# Groups
########################
group: {}

########################
# Input Booleans
########################
input_boolean:
  x40_ultra_mop_pass_pending:
    name: X40 Ultra Mop Pass Pending
    icon: mdi:robot-vacuum-alert
  # Run-scoped latch: reset off at the start of every main-level vacuum pass and
  # set on only when THAT pass reaches a real `completed` finish. The mop
  # orchestrator gates on this (not the ambient task_status, which can read a
  # stale `completed` from an earlier run) so a failed/no-op vacuum never mops.
  x40_ultra_vacuum_pass_completed:
    name: X40 Ultra Vacuum Pass Completed
    icon: mdi:robot-vacuum

########################
# Input Datetime
########################
input_datetime:
  x40_ultra_last_mopped_at:
    name: X40 Ultra Last Mopped At
    has_date: true
    has_time: true
  # Persistent "house last became home" timestamp (start of the current home
  # streak). Used instead of a state `for: days: 4` duration (which resets on
  # every HA restart/reload) so the four-continuous-home-days maintenance clean
  # measures real occupancy and survives restarts.
  x40_ultra_home_since_at:
    name: X40 Ultra Home Since At
    has_date: true
    has_time: true

########################
# Input Numbers
########################
input_number: {}

########################
# Input Select
########################
input_select:
  vacuum_pet_policy:
    name: Vacuum Pet Safety Policy
    icon: mdi:cat
    options:
      - Acclimation
      - Supervised
      - Unattended
    initial: Acclimation
  vacuum_room:
    name: Choose a room to clean
    options:
      - Select Input
      - Master Bedroom
      - Guest Room
      - Living Room
      - Bathroom
      - Hallway
      - Kitchen
      - Office
    initial: Select Input

########################
# iOS
########################
ios: {}

########################
# Light
########################
light: []

########################
# Media Player
########################
media_player: []

########################
# Plant
########################
plant: {}

########################
# Scenes
########################
scene: []

########################
# Scripts
########################
script:
  vacuum_dock_all_robots:
    alias: "Dock All Robot Vacuums"
    description: >-
      Stop cleaning and return the den, main-level, and upstairs robots to
      their docks. Safe to call when a robot is already docked or unavailable.
    mode: restart
    trace:
      stored_traces: 10
    sequence:
      - action: vacuum.return_to_base
        continue_on_error: true
        target:
          entity_id: vacuum.valetudo_den
      - action: vacuum.return_to_base
        continue_on_error: true
        target:
          entity_id: vacuum.x40_ultra
      - action: mqtt.publish
        continue_on_error: true
        data:
          topic: valetudo/upstairs-vacuum/BasicControlCapability/operation/set
          payload: HOME

  vacuum_den_pet_safe_start:
    alias: "Start Den Vacuum Through Pet Safety Policy"
    description: >-
      Central boundary for automatic den starts and error retries. Guest mode,
      the pet policy, or an open/unknown den door all fail closed.
    mode: queued
    trace:
      stored_traces: 10
    sequence:
      - alias: "Pet policy explicitly permits automatic cleaning"
        condition: state
        entity_id: input_select.vacuum_pet_policy
        state: "Unattended"
      - alias: "Guest mode vetoes automatic vacuuming"
        condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
      - alias: "Den doors are confirmed closed"
        condition: state
        entity_id: binary_sensor.den_doors_contact
        state: "off"
      - action: vacuum.start
        target:
          entity_id: vacuum.valetudo_den

  x40_ultra_prepare_deterministic_cleaning:
    alias: "X40 Ultra Prepare Deterministic Cleaning"
    description: >-
      Turn CleanGenius off so the cleaning-mode select becomes controllable.
      CleanGenius and manual cleaning-mode/customized-cleaning control are
      mutually exclusive on this device: while CleanGenius is active the
      cleaning-mode select and customized-cleaning switch are `unavailable`.
      Callers restore CleanGenius with x40_ultra_restore_cleangenius.
    mode: queued
    trace:
      stored_traces: 10
    sequence:
      - action: select.select_option
        continue_on_error: true
        target:
          entity_id: select.x40_ultra_cleangenius
        data:
          option: "off"
      # Wait for the cleaning-mode select to leave `unavailable`. wait_template
      # is used deliberately: it passes immediately if CleanGenius was already
      # off, whereas wait_for_trigger would block for the full timeout.
      - wait_template: >-
          {{ states('select.x40_ultra_cleaning_mode') not in
             ['unavailable', 'unknown'] }}
        timeout:
          seconds: 30
        continue_on_timeout: true

  x40_ultra_restore_cleangenius:
    alias: "X40 Ultra Restore CleanGenius"
    description: >-
      Restore CleanGenius to Deep cleaning after a deterministic policy run so
      manual/app-initiated cleans keep the user's default behavior. The select
      can briefly recover as off and become unavailable again while the dock
      finishes post-clean work, so wait for stable availability, retry the
      request, and fail visibly if the postcondition never becomes true.
    mode: queued
    trace:
      stored_traces: 10
    sequence:
      - repeat:
          sequence:
            # wait_template is deliberate: it passes immediately when the
            # select is already available, unlike wait_for_trigger.
            - wait_template: >-
                {{ states('select.x40_ultra_cleangenius') not in
                   ['unavailable', 'unknown'] }}
              timeout:
                minutes: 2
              continue_on_timeout: true
            # The select can briefly expose `off` before post-clean dock work
            # makes it unavailable again. Require it to stay available before
            # issuing the restore request.
            - delay:
                seconds: 2
            - if:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: select.x40_ultra_cleangenius
                      state:
                        - "unavailable"
                        - "unknown"
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: select.x40_ultra_cleangenius
                      state: "deep_cleaning"
              then:
                - action: select.select_option
                  # A post-dock race can still occur between the stable-state
                  # guard and the call. The bounded loop verifies and retries;
                  # the terminal check below makes a persistent failure loud.
                  continue_on_error: true
                  target:
                    entity_id: select.x40_ultra_cleangenius
                  data:
                    option: "deep_cleaning"
                - wait_template: >-
                    {{ is_state('select.x40_ultra_cleangenius',
                                'deep_cleaning') }}
                  timeout:
                    seconds: 15
                  continue_on_timeout: true
          until:
            - condition: or
              conditions:
                - condition: state
                  entity_id: select.x40_ultra_cleangenius
                  state: "deep_cleaning"
                - condition: template
                  value_template: "{{ repeat.index >= 3 }}"
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: select.x40_ultra_cleangenius
                state: "deep_cleaning"
        then:
          - action: persistent_notification.create
            data:
              notification_id: x40_cleangenius_restore_failed
              title: X40 CleanGenius restore failed
              message: >-
                The X40 finished its deterministic run but CleanGenius did not
                return to Deep cleaning after three verified attempts. Check
                the Dreame integration before the next manual or app clean.
          - stop: X40 CleanGenius did not restore to Deep cleaning
            error: true
        else:
          # A prior run may have left x40_cleangenius_restore_failed active;
          # this run verified the restore, so clear it. dismiss is a no-op
          # if no such notification exists (Codex P2 on #960).
          - action: persistent_notification.dismiss
            data:
              notification_id: x40_cleangenius_restore_failed

  x40_ultra_wait_until_docked:
    alias: "X40 Ultra Wait Until Docked"
    description: >-
      Block until an already-running X40 truly finishes. Completion is judged on
      the vacuum entity only: mid-task mop washes read as `cleaning`, low-battery
      recharges read as `paused`, and rewash returns read as `returning`, so the
      entity reaches `docked`/`idle` only when the whole run (including any
      rewash/recharge) is done. Call this ONLY after confirming the run actually
      started, otherwise the entity is already docked and this waits the full
      timeout for a transition that never comes.
    mode: queued
    trace:
      stored_traces: 10
    sequence:
      - wait_for_trigger:
          - trigger: state
            entity_id: vacuum.x40_ultra
            to: "docked"
          - trigger: state
            entity_id: vacuum.x40_ultra
            to: "idle"
          - trigger: state
            entity_id: vacuum.x40_ultra
            to: "error"
        timeout:
          hours: 6
        continue_on_timeout: true

  x40_ultra_main_level_vacuum_only:
    alias: "X40 Ultra Main Level Vacuum Only"
    description: >-
      Sweep-only pass across the main level. Disables CleanGenius, forces the
      cleaning mode to sweeping, cleans the mapped main floor, then always
      restores CleanGenius. Publishes a run-scoped completion latch
      (input_boolean.x40_ultra_vacuum_pass_completed): reset off at the start and
      set on only when THIS pass reaches a real `completed` finish, so the mop
      orchestrator can tell a genuine finish from a no-op/failed/arrival-docked
      run without trusting the ambient (possibly stale) task_status.
    mode: queued
    trace:
      stored_traces: 10
    sequence:
      # Reset the run-scoped completion latch: only this pass reaching a real
      # `completed` finish may set it on, so a failed/no-op run leaves it off.
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.x40_ultra_vacuum_pass_completed
      - action: script.x40_ultra_prepare_deterministic_cleaning
      # Recheck rest AFTER preparation and BEFORE changing the mode: the
      # dispatcher's entry gate can go stale during prepare's up-to-30s wait. If
      # an external run started, skip the mode change (the guard below then fails
      # and we fall through to the fail-closed wait + restore) so we never change
      # the mode on a robot mid-run.
      - if:
          - alias: "X40 still at rest before selecting the mode"
            condition: state
            entity_id: vacuum.x40_ultra
            state:
              - "docked"
              - "idle"
        then:
          - action: select.select_option
            continue_on_error: true
            target:
              entity_id: select.x40_ultra_cleaning_mode
            data:
              option: "sweeping"
      # Guard: only start once the mode actually became `sweeping`. If the mode
      # select was unavailable or rejected the option, starting now would run in
      # a leftover mode (e.g. mopping_after_sweeping) and mop on a not-due run.
      # Also recheck policy AND guest mode here: the CleanGenius wait can take up
      # to 30s, during which either may change, and the start must honor that.
      - if:
          - condition: state
            entity_id: select.x40_ultra_cleaning_mode
            state: "sweeping"
          - alias: "Recheck pet policy immediately before vacuum start"
            condition: state
            entity_id: input_select.vacuum_pet_policy
            state: "Unattended"
          - alias: "Recheck guest-mode veto immediately before vacuum start"
            condition: state
            entity_id: input_boolean.guest_mode
            state: "off"
          # Only credit a FRESH full-floor pass: require the robot to be at rest
          # before starting. If it is already `cleaning` (a manual, app, or
          # room-segment run), our vacuum.start would be a no-op and the
          # start-confirmation below would credit that unrelated run as the
          # full-floor sweep — setting the completion latch and launching a mop
          # without a real full dry pass.
          - alias: "Robot must be idle/docked so only a fresh pass is credited"
            condition: state
            entity_id: vacuum.x40_ultra
            state:
              - "docked"
              - "idle"
        then:
          - action: vacuum.start
            continue_on_error: true
            target:
              entity_id: vacuum.x40_ultra
          # Confirm a real start. wait_template (not wait_for_trigger) so it
          # passes immediately if vacuum.start already flipped the entity to
          # `cleaning` before this step registered; a genuine no-op start times
          # out with wait.completed false. The idle/docked guard above ensures
          # the `cleaning` we observe is our run, not a pre-existing one.
          - wait_template: "{{ is_state('vacuum.x40_ultra', 'cleaning') }}"
            timeout:
              minutes: 10
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ wait.completed }}"
            then:
              - action: script.x40_ultra_wait_until_docked
              # Mark THIS run complete only on a real `completed` task status,
              # checked while CleanGenius is still off (before the restore). An
              # arrival-triggered return-to-base docks WITHOUT `completed`, so the
              # latch stays off and the mop orchestrator skips the mop.
              - if:
                  - condition: state
                    entity_id: sensor.x40_ultra_task_status
                    state: "completed"
                then:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.x40_ultra_vacuum_pass_completed
        else:
          - action: notify.all
            data:
              data:
                url: "/ryan-new-mushroom/cleaning"
              message: >-
                X40 Ultra vacuum-only run skipped: sweeping mode did not apply,
                or the pet policy / guest mode changed during preparation.
      # Do not restore CleanGenius on top of a still-active run — a manual/app run
      # that began during prep, or our own pass still going if x40_ultra_wait_until
      # _docked hit its 6h timeout. Wait for the robot to be at rest first, fail
      # closed (13h beyond the 6h max run; if still not at rest, stop WITHOUT
      # restoring — the next deterministic run heals CleanGenius). On the normal
      # path the robot is already docked here, so this passes immediately.
      - alias: "Wait for the robot to be at rest before restoring CleanGenius (fail closed)"
        wait_template: "{{ states('vacuum.x40_ultra') in ['docked', 'idle'] }}"
        timeout:
          hours: 13
        continue_on_timeout: false
      # Always restore CleanGenius, even if the mode change or start failed.
      - action: script.x40_ultra_restore_cleangenius

  x40_ultra_main_level_mop_after_vacuum:
    alias: "X40 Ultra Main Level Mop After Vacuum"
    description: >-
      Clean the main level as two distinct full passes: a complete sweep-only
      vacuum of the whole floor, then — only if that vacuum actually finished —
      a dedicated mop-only pass. Running the passes separately (instead of the
      interleaved "mopping_after_sweeping" mode) means all dry debris is picked
      up before any water is applied. Both child scripts are mode: queued and
      awaited, so the mop never starts until the vacuum pass has docked. The mop
      is gated on the vacuum reaching a real `completed` task status: an arrival
      mid-run (vacuum_return_home -> return_to_base) or a rejected/no-op start
      docks the robot WITHOUT `completed`, so the mop is skipped and the mop debt
      is left pending to retry next run — this preserves both the arrival-to-dock
      protection and the vacuum-before-water ordering. Mopping requires the
      Unattended pet policy; x40_ultra_main_level_mop_only owns the persistent
      mop-schedule bookkeeping.
    mode: queued
    trace:
      stored_traces: 10
    sequence:
      - alias: "Mopping requires explicit unattended pet policy"
        condition: state
        entity_id: input_select.vacuum_pet_policy
        state: "Unattended"
      - action: script.x40_ultra_main_level_vacuum_only
      # Only mop if THIS vacuum pass genuinely completed. The vacuum-only script
      # resets input_boolean.x40_ultra_vacuum_pass_completed off at its start and
      # sets it on only on a real `completed` finish of this run, so a no-op /
      # failed start or an arrival-triggered return-to-base leaves it off and we
      # skip the mop — never trusting an ambient (possibly stale) task_status and
      # never putting water on a floor that was not fully vacuumed.
      - if:
          - condition: state
            entity_id: input_boolean.x40_ultra_vacuum_pass_completed
            state: "on"
        then:
          - action: script.x40_ultra_main_level_mop_only
        else:
          - action: notify.all
            data:
              data:
                url: "/ryan-new-mushroom/cleaning"
              message: >-
                X40 Ultra vacuum pass did not finish cleanly, so the mop was
                skipped; it remains due and will retry on the next run.

  x40_ultra_main_level_mop_only:
    alias: "X40 Ultra Main Level Mop Only"
    description: >-
      Mop-only pass across the main level (cleaning mode "mopping"), intended to
      run after a full vacuum pass has already picked up dry debris. Disables
      CleanGenius for deterministic control and always restores it. The
      persistent mop schedule is cleared only when the mop mode actually applied,
      the robot really started, and the run reached a real `completed` finish —
      so a rejected mode change, a no-op start, or an arrival-triggered
      return-to-base all keep the pending flag set to retry next run.
    mode: queued
    trace:
      stored_traces: 10
    sequence:
      - alias: "Mopping requires explicit unattended pet policy"
        condition: state
        entity_id: input_select.vacuum_pet_policy
        state: "Unattended"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.x40_ultra_mop_pass_pending
      - action: script.x40_ultra_prepare_deterministic_cleaning
      # Recheck rest AFTER preparation and BEFORE changing the mode: the
      # dispatcher's entry gate can go stale during prepare's up-to-30s wait. If
      # an external run started, skip the mode change (the guard below then fails
      # and we fall through to the fail-closed wait + restore) so we never change
      # the mode on a robot mid-run.
      - if:
          - alias: "X40 still at rest before selecting the mode"
            condition: state
            entity_id: vacuum.x40_ultra
            state:
              - "docked"
              - "idle"
        then:
          - action: select.select_option
            continue_on_error: true
            target:
              entity_id: select.x40_ultra_cleaning_mode
            data:
              option: "mopping"
      # Guard: only clean if the mop mode actually took. If the mode select was
      # unavailable or rejected the option, a leftover mode (e.g. sweeping from
      # the preceding vacuum pass) must not be recorded as a mop. Recheck policy
      # AND guest mode here too: the preceding vacuum pass can run for hours,
      # during which either may change, and the mop start must honor that.
      - if:
          - condition: state
            entity_id: select.x40_ultra_cleaning_mode
            state: "mopping"
          - alias: "Recheck pet policy immediately before mop start"
            condition: state
            entity_id: input_select.vacuum_pet_policy
            state: "Unattended"
          - alias: "Recheck guest-mode veto immediately before mop start"
            condition: state
            entity_id: input_boolean.guest_mode
            state: "off"
          # Only credit a FRESH mop pass: require the robot at rest before start.
          # If it is already `cleaning` (a manual/app/segment run), our start is a
          # no-op and the confirmation below would credit that unrelated run as a
          # finished mop, clearing the mop debt without a real mop.
          - alias: "Robot must be idle/docked so only a fresh mop is credited"
            condition: state
            entity_id: vacuum.x40_ultra
            state:
              - "docked"
              - "idle"
        then:
          - action: vacuum.start
            continue_on_error: true
            target:
              entity_id: vacuum.x40_ultra
          # Confirm a real start (guards against a resting dock with a stale
          # `completed` task status being counted as a finished mop).
          # wait_template (not wait_for_trigger) so it passes immediately if
          # vacuum.start already flipped the entity to `cleaning` before this
          # step registered; a genuine no-op start times out with
          # wait.completed false and keeps the pending flag set for retry.
          - wait_template: "{{ is_state('vacuum.x40_ultra', 'cleaning') }}"
            timeout:
              minutes: 10
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ wait.completed }}"
            then:
              - action: script.x40_ultra_wait_until_docked
              # Success requires a real `completed` task status, not just a dock
              # state. An arrival mid-run fires vacuum_return_home ->
              # vacuum.return_to_base, which parks the robot at docked/idle
              # WITHOUT a `completed` task status. Reliable here because
              # CleanGenius is OFF: a single pass emits `completed` once at true
              # end (not per sub-pass), and it only reaches `completed` if this
              # run — now known to have really started — actually finished.
              - if:
                  - condition: state
                    entity_id: sensor.x40_ultra_task_status
                    state: "completed"
                then:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.x40_ultra_last_mopped_at
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.x40_ultra_mop_pass_pending
                else:
                  - action: notify.all
                    data:
                      data:
                        url: "/ryan-new-mushroom/cleaning"
                      message: >-
                        X40 Ultra mop pass did not finish cleanly; it will retry
                        on the next scheduled cleaning run.
            else:
              - action: notify.all
                data:
                  data:
                    url: "/ryan-new-mushroom/cleaning"
                  message: >-
                    X40 Ultra mop pass never started; it will retry on the next
                    scheduled cleaning run.
        else:
          - action: notify.all
            data:
              data:
                url: "/ryan-new-mushroom/cleaning"
              message: >-
                X40 Ultra could not switch to mop mode (CleanGenius or the mode
                select was unavailable); mop deferred to the next run.
      # Do not restore CleanGenius on top of a still-active run — a manual/app run
      # that began during prep, or our own pass still going if x40_ultra_wait_until
      # _docked hit its 6h timeout. Wait for the robot to be at rest first, fail
      # closed (13h beyond the 6h max run; if still not at rest, stop WITHOUT
      # restoring — the next deterministic run heals CleanGenius). On the normal
      # path the robot is already docked here, so this passes immediately.
      - alias: "Wait for the robot to be at rest before restoring CleanGenius (fail closed)"
        wait_template: "{{ states('vacuum.x40_ultra') in ['docked', 'idle'] }}"
        timeout:
          hours: 13
        continue_on_timeout: false
      # Always restore CleanGenius, even if the mode change or start failed.
      - action: script.x40_ultra_restore_cleangenius

  x40_ultra_main_level_policy_clean:
    alias: "X40 Ultra Deterministic Run (Full Floor Or Segment)"
    description: >-
      THE single serialized entry (mode: queued) for every deterministic X40 run
      that toggles CleanGenius / cleaning mode — both the automatic full-floor
      pass and the supervised one-segment clean. Because every such run is an
      invocation of THIS one queued script, the queue serializes them atomically:
      no two runs can interleave their CleanGenius/mode changes, so no separate
      lock helper (and its non-atomic check-then-set) is needed. kind=full_floor
      (the default) vacuums the main level and adds a mop when one is pending or
      the last mop is >= 3 days old; kind=segment runs one vacuum-only segment
      via x40_ultra_segment_vacuum_only. The run is skipped entirely when the X40
      is already busy with an external (manual/app) run, so we never disable
      CleanGenius or change the mode on a robot we are not driving.
    mode: queued
    trace:
      stored_traces: 10
    fields:
      kind:
        description: "full_floor (default) or segment."
        example: full_floor
      segments:
        description: "For kind=segment: the X40 map segment id."
        example: 4
      suction_level:
        description: "For kind=segment: Dreame suction level (1 = quiet)."
        example: 1
    variables:
      last_mopped_timestamp: >-
        {% set raw = states('input_datetime.x40_ultra_last_mopped_at') %}
        {{ as_timestamp(raw, default=0) }}
      mop_due: >-
        {{ is_state('input_select.vacuum_pet_policy', 'Unattended')
           and (is_state('input_boolean.x40_ultra_mop_pass_pending', 'on')
                or (last_mopped_timestamp | float(0)) <= 0
                or as_timestamp(now()) - (last_mopped_timestamp | float(0)) >= 3 * 24 * 60 * 60) }}
    sequence:
      # Reject the run if the X40 is already cleaning from an external (manual or
      # app-initiated) run we do not control: our queue only serializes OUR
      # invocations, so an external run must gate us out before we disable
      # CleanGenius or change the mode on a robot mid-run.
      - if:
          - condition: state
            entity_id: vacuum.x40_ultra
            state:
              - "docked"
              - "idle"
        then:
          - if:
              - condition: template
                value_template: "{{ (kind | default('full_floor')) == 'segment' }}"
            then:
              - action: script.x40_ultra_segment_vacuum_only
                data:
                  segments: "{{ segments | int }}"
                  suction_level: "{{ suction_level | default(1) | int }}"
            else:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ mop_due }}"
                    sequence:
                      - action: script.x40_ultra_main_level_mop_after_vacuum
                default:
                  - action: script.x40_ultra_main_level_vacuum_only
        else:
          - action: notify.all
            data:
              data:
                url: "/ryan-new-mushroom/cleaning"
              message: >-
                X40 Ultra deterministic clean skipped: the robot is already busy
                with a manual or app-initiated run.

  vacuum_main_level_full_floor:
    alias: "Vacuum Main Level Full Floor"
    description: >-
      Launch the main-level clean. Fire-and-forget: it starts the (long-running,
      self-observing) clean via script.turn_on and returns immediately, so
      callers such as vacuum_main_and_upstairs_levels start the upstairs robot
      and send trip notifications without waiting for the whole run. A forced mop
      launches the mop script directly; otherwise the policy decides. Routing on
      the force here (rather than a shared latch) keeps each request tied to its
      own queued run.
    mode: queued
    trace:
      stored_traces: 10
    fields:
      force_mop:
        description: "Force a mop pass on this run regardless of the schedule."
        example: true
    sequence:
      - alias: "Full-floor cleaning requires explicit unattended pet policy"
        condition: state
        entity_id: input_select.vacuum_pet_policy
        state: "Unattended"
      # A forced mop is expressed by marking a mop pending — a "mop owed" latch
      # that only a successful mop clears, so it cannot be lost to a concurrent
      # non-forced call. Everything then funnels through the SINGLE serialized
      # entry (x40_ultra_main_level_policy_clean, mode: queued) so X40 runs never
      # overlap: per-script queueing alone would not serialize different child
      # scripts (vacuum-only vs mop) against the same robot.
      - if:
          - condition: template
            value_template: "{{ force_mop | default(false) | bool }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.x40_ultra_mop_pass_pending
      - action: script.turn_on
        target:
          entity_id: script.x40_ultra_main_level_policy_clean

  vacuum_upstairs_full_floor:
    alias: "Vacuum Upstairs Full Floor"
    trace:
      stored_traces: 10
    sequence:
      # Recheck the pet policy and guest veto immediately before the START
      # publish. The whole-house gate can pass under Unattended, then the owner
      # flips to Acclimation/Supervised (whose dock automation publishes HOME to
      # this robot) before we get here; an unconditional START would restart it
      # despite the fail-closed transition. Bare conditions stop the script here,
      # so no START is published when the policy no longer allows it.
      - alias: "Recheck pet policy immediately before the upstairs START"
        condition: state
        entity_id: input_select.vacuum_pet_policy
        state: "Unattended"
      - alias: "Recheck guest-mode veto immediately before the upstairs START"
        condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
      - action: mqtt.publish
        data:
          topic: valetudo/upstairs-vacuum/BasicControlCapability/operation/set
          payload: START

  vacuum_main_and_upstairs_levels:
    alias: "Vacuum Main And Upstairs Levels"
    description: Run one full-floor cleaning pass on both resident levels.
    mode: queued
    trace:
      stored_traces: 10
    fields:
      force_mop:
        description: "Force a main-level mop pass after the X40 vacuum pass."
        example: true
    sequence:
      - alias: "Whole-house cleaning requires explicit unattended pet policy"
        condition: state
        entity_id: input_select.vacuum_pet_policy
        state: "Unattended"
      - action: script.vacuum_main_level_full_floor
        data:
          force_mop: "{{ force_mop | default(false) | bool }}"
        continue_on_error: true
      - action: script.vacuum_upstairs_full_floor
        continue_on_error: true

  vacuum_master_bedroom:
    alias: "Vacuum Master Bedroom"
    trace:
      stored_traces: 10
    sequence:
      - action: mqtt.publish
        data:
          topic: valetudo/upstairs-vacuum/MapSegmentationCapability/clean/set
          payload: >-
            {"action": "start_segment_action","segment_ids": ["7"],"iterations": 4,"customOrder": true}

  vacuum_guest_room:
    alias: "Vacuum Guest Room"
    trace:
      stored_traces: 10
    sequence:
      - action: mqtt.publish
        data:
          topic: valetudo/upstairs-vacuum/MapSegmentationCapability/clean/set
          payload: >-
            {"action": "start_segment_action","segment_ids": ["5"],"iterations": 4,"customOrder": true}
  vacuum_bathroom:
    alias: "Vacuum Bathroom"
    trace:
      stored_traces: 10
    sequence:
      - action: mqtt.publish
        data:
          topic: valetudo/upstairs-vacuum/MapSegmentationCapability/clean/set
          payload: >-
            {"action": "start_segment_action","segment_ids": ["4"],"iterations": 4,"customOrder": true}
  # Entryway not working correctly
  vacuum_hallway:
    alias: "Vacuum Hallway"
    trace:
      stored_traces: 10
    sequence:
      - action: mqtt.publish
        data:
          topic: valetudo/upstairs-vacuum/MapSegmentationCapability/clean/set
          payload: >-
            {"action": "start_segment_action","segment_ids": ["6","1"],"iterations": 4,"customOrder": true}
  vacuum_kitchen:
    alias: "Vacuum Kitchen"
    trace:
      stored_traces: 10
    sequence:
      - action: dreame_vacuum.vacuum_clean_segment
        target:
          entity_id: vacuum.x40_ultra
        data:
          segments: 4
          repeats: 1
          suction_level: 1
  vacuum_living_room:
    alias: "Vacuum Living Room"
    trace:
      stored_traces: 10
    sequence:
      - action: dreame_vacuum.vacuum_clean_segment
        target:
          entity_id: vacuum.x40_ultra
        data:
          segments: 5
          repeats: 1
          suction_level: 1
  vacuum_office:
    alias: "Vacuum Office"
    trace:
      stored_traces: 10
    sequence:
      - action: mqtt.publish
        data:
          topic: valetudo/upstairs-vacuum/MapSegmentationCapability/clean/set
          payload: >-
            {"action": "start_segment_action","segment_ids": ["2"],"iterations": 4,"customOrder": true}

  x40_ultra_segment_vacuum_only:
    alias: "X40 Ultra Segment Vacuum Only"
    description: >-
      Vacuum-only clean of one X40 map segment with CleanGenius deterministically
      disabled and the cleaning mode forced to `sweeping` first, so a leftover
      mopping mode can never put water down. Quiet suction by default. Invoked
      ONLY from x40_ultra_main_level_policy_clean (kind=segment) so it inherits
      that single queue's serialization and its at-rest entry guard; the raw
      dreame_vacuum.vacuum_clean_segment call alone does not establish sweeping
      and could mop under CleanGenius.
    mode: queued
    trace:
      stored_traces: 10
    fields:
      segments:
        description: "X40 map segment id to clean."
        example: 4
      suction_level:
        description: "Dreame suction level (1 = quiet). Defaults to 1."
        example: 1
    sequence:
      # Do not disable CleanGenius or touch the cleaning mode unless the X40 is
      # at rest: an external (manual/app) run must gate us out BEFORE any config
      # mutation, so we never change controls on a robot that is mid-run. Only
      # inside this gate do we prepare/restore, so a busy robot is left untouched.
      - if:
          - alias: "X40 must be at rest before any deterministic mutation"
            condition: state
            entity_id: vacuum.x40_ultra
            state:
              - "docked"
              - "idle"
        then:
          - action: script.x40_ultra_prepare_deterministic_cleaning
          # Recheck rest AFTER preparation and BEFORE changing the mode: the entry
          # gate can go stale during prepare's up-to-30s wait. If an external run
          # started, skip the mode change (the guard below then fails and we fall
          # through to the fail-closed wait + restore) so we never change the mode
          # on a robot mid-run.
          - if:
              - alias: "X40 still at rest before selecting the mode"
                condition: state
                entity_id: vacuum.x40_ultra
                state:
                  - "docked"
                  - "idle"
            then:
              - action: select.select_option
                continue_on_error: true
                target:
                  entity_id: select.x40_ultra_cleaning_mode
                data:
                  option: "sweeping"
          # Guard: only start once the mode actually became `sweeping`, so a
          # leftover mopping/CleanGenius mode cannot turn a supervised vacuum into
          # a mop. Also recheck the pet policy and guest-mode veto here (the
          # CleanGenius wait can take up to 30s, during which the owner may flip
          # to Acclimation or enable guest mode), and recheck the robot is STILL
          # at rest so an external run started during that wait is not miscredited
          # as our start.
          - if:
              - condition: state
                entity_id: select.x40_ultra_cleaning_mode
                state: "sweeping"
              - alias: "Recheck pet policy immediately before segment start"
                condition: state
                entity_id: input_select.vacuum_pet_policy
                state:
                  - "Supervised"
                  - "Unattended"
              - alias: "Supervised requires the owner home (Unattended does not)"
                condition: template
                value_template: >-
                  {{ is_state('input_select.vacuum_pet_policy', 'Unattended')
                     or is_state('binary_sensor.bayesian_zeke_home', 'on') }}
              - alias: "Recheck guest-mode veto immediately before segment start"
                condition: state
                entity_id: input_boolean.guest_mode
                state: "off"
              - alias: "Recheck the X40 is still at rest immediately before segment start"
                condition: state
                entity_id: vacuum.x40_ultra
                state:
                  - "docked"
                  - "idle"
            then:
              - action: dreame_vacuum.vacuum_clean_segment
                continue_on_error: true
                target:
                  entity_id: vacuum.x40_ultra
                data:
                  segments: "{{ segments | int }}"
                  repeats: 1
                  suction_level: "{{ suction_level | default(1) | int }}"
              # vacuum_clean_segment only dispatches the command, so hold the
              # deterministic sweeping mode until the run reaches a terminal dock —
              # otherwise CleanGenius would be restored mid-sweep. wait_template
              # (not wait_for_trigger) passes immediately if the entity already
              # flipped to `cleaning`; only then wait for the finish.
              - wait_template: "{{ is_state('vacuum.x40_ultra', 'cleaning') }}"
                timeout:
                  minutes: 10
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                then:
                  - action: script.x40_ultra_wait_until_docked
            else:
              - action: notify.all
                data:
                  data:
                    url: "/ryan-new-mushroom/cleaning"
                  message: >-
                    X40 Ultra supervised room vacuum skipped: the sweeping mode
                    did not apply, or the pet policy / guest mode changed during
                    preparation, so it cannot mop or run against policy.
          # If an external run grabbed the robot during the prep wait, do not
          # restore CleanGenius on top of it: wait until the robot is at rest
          # again (their run ended) before restoring. On our own run this passes
          # immediately (already docked). Fail CLOSED: an external run can take up
          # to 6h (the X40 terminal wait), so wait well beyond that and, if it is
          # STILL not at rest, stop WITHOUT restoring rather than changing
          # CleanGenius on top of an active run — the next deterministic run's
          # restore heals it. continue_on_timeout: false ties the restore to an
          # actual idle/docked state.
          - alias: "Wait for any external run to end before restoring CleanGenius (fail closed)"
            wait_template: "{{ states('vacuum.x40_ultra') in ['docked', 'idle'] }}"
            timeout:
              hours: 13
            continue_on_timeout: false
          - action: script.x40_ultra_restore_cleangenius
        else:
          - action: notify.all
            data:
              data:
                url: "/ryan-new-mushroom/cleaning"
              message: >-
                X40 Ultra supervised room vacuum skipped: the robot was already
                busy with a manual or app-initiated run.

  vacuum_upstairs_segment_supervised:
    alias: "Vacuum Upstairs Segment (Supervised Boundary)"
    description: >-
      Shared launch boundary for supervised upstairs (Valetudo) room cleans:
      recheck the pet policy (Supervised/Unattended) and guest veto immediately
      before delegating to the requested per-room segment script, so a flip to
      Acclimation (whose dock automation publishes HOME) after the launcher's
      outer gate is not followed by an unconditional segment START. Delegating to
      the existing per-room scripts keeps the segment maps in one place. After
      delegating it BLOCKS until the upstairs run reaches a terminal state,
      tracked via the Valetudo MQTT status topic (the trusted control channel,
      not the flaky upstairs Valetudo HA vacuum entity the config avoids by
      design). Because the per-room scripts are fire-and-forget, this hold is what
      keeps the caller (vacuum_supervised_clean, mode: single) in its single-run
      state for the whole upstairs run, so a second press cannot dispatch a newly
      selected — possibly guest-private — room mid-run. The upstairs robot is
      vacuum-only hardware, so this is a presence/privacy boundary, not a mop one.
    mode: queued
    trace:
      stored_traces: 10
    fields:
      room_script:
        description: "Per-room upstairs script (e.g. script.vacuum_guest_room)."
        example: script.vacuum_guest_room
    sequence:
      - alias: "Recheck pet policy immediately before the upstairs segment START"
        condition: state
        entity_id: input_select.vacuum_pet_policy
        state:
          - "Supervised"
          - "Unattended"
      - alias: "Supervised requires the owner home (Unattended does not)"
        condition: template
        value_template: >-
          {{ is_state('input_select.vacuum_pet_policy', 'Unattended')
             or is_state('binary_sensor.bayesian_zeke_home', 'on') }}
      - alias: "Recheck guest-mode veto immediately before the upstairs segment START"
        condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
      - action: "{{ room_script }}"
      # Confirm the run actually started (status -> cleaning) via MQTT. If it
      # never starts (e.g. a no-op), skip the terminal wait so we do not hang.
      - alias: "Confirm the upstairs run started"
        wait_for_trigger:
          - trigger: mqtt
            topic: valetudo/upstairs-vacuum/StatusStateAttribute/status
            payload: cleaning
        timeout:
          minutes: 5
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ wait.trigger is not none }}"
        then:
          # Hold until a terminal status so the caller's mode: single stays held
          # for the whole run — rejecting a concurrent (stale-room) press.
          - alias: "Hold until the upstairs run reaches a terminal state"
            wait_for_trigger:
              - trigger: mqtt
                topic: valetudo/upstairs-vacuum/StatusStateAttribute/status
                payload: docked
              - trigger: mqtt
                topic: valetudo/upstairs-vacuum/StatusStateAttribute/status
                payload: idle
              - trigger: mqtt
                topic: valetudo/upstairs-vacuum/StatusStateAttribute/status
                payload: error
            timeout:
              hours: 2
            continue_on_timeout: true

  vacuum_supervised_clean:
    alias: "Vacuum Supervised Clean (One Room)"
    description: >-
      Cat-safe supervised launcher: clean the single room selected in
      input_select.vacuum_room, vacuum-only, on one robot. Permitted only when
      the pet policy is Supervised or Unattended and guest mode is off — the
      owner is expected to be present and watching. Upstairs Valetudo rooms
      dispatch to the existing vacuum-only segment scripts (that robot cannot
      mop); X40 rooms route through the single deterministic dispatcher
      (x40_ultra_main_level_policy_clean, kind=segment) so they serialize with
      automatic full-floor runs and force sweeping — a leftover mopping mode can
      never mop during a supervised run. Mopping is never launched from here
      (only the whole-floor Unattended paths mop). mode: single so a second press
      while a run is active is REJECTED, not queued: a queued invocation would
      read the mutable input_select.vacuum_room only when it finally started and
      could clean a newer (possibly guest-private) room. Follow-up: tune the
      upstairs per-room scripts to a single quiet pass; today they inherit their
      existing pass counts.
    mode: single
    trace:
      stored_traces: 10
    sequence:
      - alias: "Supervised cleaning requires Supervised or Unattended policy"
        condition: state
        entity_id: input_select.vacuum_pet_policy
        state:
          - "Supervised"
          - "Unattended"
      # Supervised means the owner is present to watch the cats, so require
      # confirmed presence for it (a remote/away dashboard press must not start a
      # supervised clean). Unattended is the explicit hands-off mode and does not.
      - alias: "Supervised requires the owner home (Unattended does not)"
        condition: template
        value_template: >-
          {{ is_state('input_select.vacuum_pet_policy', 'Unattended')
             or is_state('binary_sensor.bayesian_zeke_home', 'on') }}
      - alias: "Guest mode vetoes automatic/supervised vacuuming"
        condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
      - choose:
          # Upstairs Valetudo rooms route through the shared supervised boundary,
          # which rechecks policy/guest immediately before the segment START.
          - conditions: "{{ is_state('input_select.vacuum_room', 'Master Bedroom') }}"
            sequence:
              - action: script.vacuum_upstairs_segment_supervised
                data:
                  room_script: script.vacuum_master_bedroom
          - conditions: "{{ is_state('input_select.vacuum_room', 'Guest Room') }}"
            sequence:
              - action: script.vacuum_upstairs_segment_supervised
                data:
                  room_script: script.vacuum_guest_room
          - conditions: "{{ is_state('input_select.vacuum_room', 'Living Room') }}"
            sequence:
              # X40 room — route through the single deterministic dispatcher so it
              # serializes with automatic full-floor runs and forces sweeping.
              - action: script.x40_ultra_main_level_policy_clean
                data:
                  kind: segment
                  segments: 5
          - conditions: "{{ is_state('input_select.vacuum_room', 'Bathroom') }}"
            sequence:
              - action: script.vacuum_upstairs_segment_supervised
                data:
                  room_script: script.vacuum_bathroom
          - conditions: "{{ is_state('input_select.vacuum_room', 'Hallway') }}"
            sequence:
              - action: script.vacuum_upstairs_segment_supervised
                data:
                  room_script: script.vacuum_hallway
          - conditions: "{{ is_state('input_select.vacuum_room', 'Kitchen') }}"
            sequence:
              # X40 room — route through the single deterministic dispatcher so it
              # serializes with automatic full-floor runs and forces sweeping.
              - action: script.x40_ultra_main_level_policy_clean
                data:
                  kind: segment
                  segments: 4
          - conditions: "{{ is_state('input_select.vacuum_room', 'Office') }}"
            sequence:
              - action: script.vacuum_upstairs_segment_supervised
