################################################################
## Packages / Zone
################################################################

################################################
## Customize
################################################

homeassistant:
  customize:
    ################################################
    ## Node Anchors
    ################################################

    package.node_anchors:
      customize: &customize
        package: 'zone'

      tracked_devices: &tracked_devices
        <<: *customize
        devices:
          - device_tracker.bayesian_resident_home
          
      track_ios: &track_ios
        <<: *customize
        track_ios: true
          
      expose: &expose
        <<: *customize
        haaska_hidden: false
        homebridge_hidden: false

    ################################################
    ## Automations
    ################################################
    automation.cloudy_home_arrival:
      <<: *customize
      friendly_name: Cloudy Day Arrival
      icon: mdi:weather-cloudy
    automation.doors_open_when_leaving_home:
      <<: *customize
      friendly_name: Doors Left Open When Leaving
      icon: mdi:door-open
    automation.garage_door_open_when_leaving_home:
      <<: *customize
      friendly_name: Garage Door Left Open When Leaving
      icon: mdi:garage-alert
    automation.turn_on_lights_at_night_when_i_get_home:
      <<: *customize
      friendly_name: Night Arrival
    automation.turn_on_bedroom_lights_at_night_when_i_get_home:
      <<: *customize
      friendly_name: Bedroom Night Arrival
    automation.return_from_road_trip:
      <<: *customize
      friendly_name: Returning Home From Road Trip
    automation.return_home_from_twin_cities:
      <<: *customize
      friendly_name: Returning Home From Example Zone 10
      icon: mdi:city
    automation.turn_off_lights_when_i_leave:
      <<: *customize
      friendly_name: Lights Off on Departure
    automation.update_nest_eta:
      <<: *customize
      friendly_name: Update Nest ETA as Approach Home
    automation.vacuum_return_home:
      <<: *customize
      friendly_name: Stop Vacuuming on Arrival
      icon: mdi:robot-vacuum
      
    ################################################
    ## Binary Sensors
    ################################################
    binary_sensor.bayesian_resident_home:
      <<: *customize
      friendly_name: "Home"

    binary_sensor.test_homeward:
      <<: *customize
      friendly_name: "Returning from long road trip (95 minutes)"
    
    ################################################
    ## Device Trackers
    ################################################
    device_tracker.arrival_sensor:
      <<: *customize
      friendly_name: Zwave Arrival Sensor
    ################################################
    ## Groups
    ################################################
    group.bayesian_inputs:
      <<: *customize
      friendly_name: Bayesian Presence Entities
    ################################################
    ## Input Boolean
    ################################################

    ################################################
    ## Input Numbers
    ################################################

    ################################################
    ## Proximity
    ################################################
    proximity.home:
      #<<: *tracked_devices
      friendly_name: Proximity to Home
      icon: mdi:home
    proximity.example_zone_05:
      #<<: *tracked_devices
      friendly_name: Proximity to Example Zone 05
      icon: mdi:curling
    proximity.example_zone_08:
      #<<: *tracked_devices
      friendly_name: Proximity to Example Zone 08
      icon: mdi:curling
    proximity.example_zone_10:
      #<<: *tracked_devices
      friendly_name: Proximity to Example Zone 10
      icon: mdi:city
    proximity.work:
      #<<: *tracked_devices
      friendly_name: Proximity to Work
      
    ################################################
    ## Scripts
    ################################################

    ################################################
    ## Sensors
    ################################################
    sensor.home_distance:
      <<: *customize
      friendly_name: "Distance to Home"
    sensor.home_time:
      <<: *customize
      friendly_name: "Last Change in Home Dir"
    sensor.example_zone_10:
      <<: *customize
      friendly_name: 'Direction of Example Zone 10'
    sensor.heading_home:
      <<: *customize
      friendly_name: 'Direction of Home'
    ################################################
    ## Thermostats
    ################################################

    ################################################
    ## Zone
    ################################################
    zone.home:
      <<: *track_ios
      friendly_name: "Example Zone 02"
      icon: mdi:home
    zone.example_zone_04:
      <<: *track_ios
      friendly_name: "Example Zone 04"
      icon: mdi:airplane-landing
    zone.example_zone_05:
      <<: *track_ios
      friendly_name: "Example Zone 05"
      icon: mdi:curling
    zone.example_zone_07:
      <<: *track_ios
      friendly_name: "Example Zone 07"
      icon: mdi:curling
    zone.example_zone_08:
      <<: *track_ios
      friendly_name: "Example Zone 08"
      icon: mdi:curling
    zone.example_zone_10:
      <<: *track_ios
      friendly_name: "Example Zone 10"
      icon: mdi:city
    zone.work:
      <<: *track_ios
      friendly_name: "Work"
      icon: mdi:domain

################################################
## Automation
################################################
automation:
  - id: cloudy_home_arrival
    alias: cloudy_home_arrival
    trigger:
    - platform: state
      entity_id: binary_sensor.bayesian_resident_home
      from: 'off'
      to: 'on'
    condition:
      condition: and
      conditions:
      - condition: sun
        before: sunset
        before_offset: 02:00:00
      - condition: numeric_state
        entity_id: sensor.dark_sky_cloud_coverage
        above: 50
      - condition: state
        entity_id: binary_sensor.master_bed_occupancy
        state: 'off'
    action:
    - service: scene.turn_on
      entity_id: scene.cloudy_arrive_home
#    - service: notify.all
#      data:
#        message: Cloudy day arrival.

  - id: doors_open_when_leaving_home
    alias: doors_open_when_leaving_home
    trigger:
    - entity_id: binary_sensor.bayesian_resident_home
      platform: state
      from: home
      to: away
    condition:
      condition: or
      conditions:
      - condition: state
        entity_id: binary_sensor.deck_door_contact
        state: open
      - condition: state
        entity_id: binary_sensor.front_door_contact
        state: open
    action:
    - service: notify.all
      data:
        message: Door left open!

  - id: garage_door_open_when_leaving_home
    alias: garage_door_open_when_leaving_home
    trigger:
    - entity_id: binary_sensor.bayesian_resident_home
      from: home
      platform: state
      to: away
    condition:
    - condition: state
      entity_id: cover.garage_door_opener
      state: open
    action:
    - service: notify.all
      data:
        message: Garage door is still open!

  - id: play_spotify_when_i_get_home
    alias: play_spotify_when_i_get_home
    trigger:
    - platform: state
      entity_id: binary_sensor.bayesian_resident_home
      from: 'off'
      to: 'on'
    condition:
    - condition: state
      entity_id: input_boolean.guest_mode
      state: 'off'
    - condition: state
      entity_id: binary_sensor.master_bed_occupancy
      state: 'off'
    action:
    - service: script.turn_on
      entity_id: script.spotify_arrival

  - id: turn_on_lights_at_night_when_i_get_home
    alias: turn_on_lights_at_night_when_i_get_home
    trigger:
    - platform: state
      entity_id: binary_sensor.bayesian_resident_home
      from: 'off'
      to: 'on'
    condition:
      condition: or
      conditions:
      - condition: sun
        after: sunset
        after_offset: "-1:00:00"
      - condition: sun
        before: sunrise
      - condition: state
        entity_id: binary_sensor.master_bed_occupancy
        state: 'off'
    action:
    - service: scene.turn_on
      entity_id: scene.arrive_home
#    - service: notify.all
#      data:
#        message: Home again, home again, jiggity jig.
    - service: vacuum.return_to_base
      entity_id: vacuum.pbw
  
  - id: turn_on_bedroom_lights_at_night_when_i_get_home
    alias: turn_on_bedroom_lights_at_night_when_i_get_home
    trigger:
    - platform: state
      entity_id: binary_sensor.bayesian_resident_home
      from: 'off'
      to: 'on'
    condition:
      condition: or
      conditions:
      - condition: time
        after: '22:00:00'
      - condition: sun
        before: sunrise
      - condition: state
        entity_id: binary_sensor.master_bed_occupancy
        state: 'off'
    action:
    - service: scene.turn_on
      entity_id: scene.bedroom_prep
  
  - id: return_from_road_trip
    alias: return_from_road_trip
    trigger:
    - platform: state
      entity_id: binary_sensor.test_homeward
      to: 'true'
    action:
    - service: nest.set_eta
      data:
        eta:  sensor.time_to_home
        trip_id: Roadtrip return
    - service: climate.set_away_mode
      data:
        entity_id: climate.hallway_glycol
        away_mode: false
    - service: notify.all
      data:
        message: Turn off Nest Away and send ETA of {{sensor.time_to_home}} while you drive home from a road trip.
        
  - id: return_home_from_twin_cities
    alias: return_home_from_twin_cities
    trigger:
    - platform: zone
      entity_id: device_tracker.bayesian_resident_home
      zone: zone.example_zone_10
      event: leave
    condition:
      condition: template
      value_template: '{{ states.binary_sensor.test_homeward.state == "on" }}'
    action:
    - service: nest.set_eta
      data:
        eta:  sensor.time_to_home
        trip_id: Leave Example Zone 10
    - service: climate.set_away_mode
      data:
        entity_id: climate.hallway_glycol
        away_mode: false
    - service: notify.all
      data_template:
        message: Turn off Nest Away and send ETA of {{sensor.time_to_home}} while you drive home from the Cities.

  - id: turn_off_lights_when_i_leave
    alias: turn_off_lights_when_i_leave
    trigger:
    - platform: state
      entity_id: binary_sensor.bayesian_resident_home
      from: 'on'
      to: 'off'
    condition:
    - condition: state
      entity_id: input_boolean.guest_mode
      state: 'off'
    action:
    - service: scene.turn_on
      entity_id: scene.leave_home
    - delay: 25
    - service: scene.turn_on
      entity_id: scene.leave_home
#    - service: notify.all
#      data:
#        message: Auf weidersehen!

  - id: update_nest_eta
    alias: update_nest_eta
    trigger:
    - platform: zone
      entity_id: device_tracker.bayesian_resident_home
      zone: zone.example_zone_07
      event: enter
    action:
    - service: nest.set_eta
      data:
        eta:  sensor.time_to_home
        trip_id: Returning home
    - service: notify.all
      data_template:
        message: Updating ETA to {{sensor.time_to_home}}.

  - id: vacuum_return_home
    alias: vacuum_return_home
    trigger:
    - platform: state
      entity_id: binary_sensor.bayesian_resident_home
      from: 'off'
      to: 'on'
    action:
    - service: vacuum.return_to_base
      entity_id: vacuum.pbw

########################
# Binary Sensors
########################
binary_sensor:
  - platform: template
    sensors:
      test_homeward:
        entity_id: sensor.time
        value_template: >-
          {% if
             (((as_timestamp(now()) - as_timestamp(states.sensor.heading_home.last_changed))//60) > 95) and (states.sensor.heading_home.state=="towards")
          %} true
          {% else %}
            false
          {% endif %}
          
  - platform: bayesian
    prior: 0.1
    name: bayesian_resident_home
    device_class: occupancy
    probability_threshold: 0.85
    observations:
    - entity_id: device_tracker.example_phone
      prob_given_true: 0.97
      prob_given_false: 0.1
      platform: 'state'
      to_state: 'home'
    - entity_id: device_tracker.iphone_bt
      prob_given_true: 0.97
      prob_given_false: 0.10
      platform: 'state'
      to_state: 'home'
    - entity_id: device_tracker.arrival_sensor
      prob_given_true: 0.97
      prob_given_false: 0.21
      platform: 'state'
      to_state: 'present'
    - entity_id: sensor.iphone_battery_state
      prob_given_true: 0.65
      prob_given_false: 0.43
      platform: 'state'
      to_state: 'Charging'
    - entity_id: binary_sensor.nest_home
      prob_given_true: 0.75
      prob_given_false: 0.4
      platform: 'state'
      to_state: 'on'

########################
# Device Trackers
########################
device_tracker:
#  - platform: luci
#  - platform: ubus
#    host: !secret router_host
#    username: root
#    password: !secret router_password
#    consider_home: 120
#    track_new_devices: no
#    interval_seconds: 30
    
  - platform: unifi_direct
    host: !secret unifi_nanohd_ip
    username: !secret unifi_nanohd_user
    password: !secret unifi_nanohd_password
    
  - platform: bluetooth_tracker
    consider_home: 120

########################
# Input Booleans
########################
input_boolean:

########################
# Input Numbers
########################
input_number:

########################
# Groups
########################
group:
  bayesian_inputs:
    entities:
      - device_tracker.bayesian_resident_home
      - device_tracker.example_phone
#      - device_tracker.e0338e39ea8c
      - device_tracker.arrival_sensor
#      - device_tracker.iphone_bt
      - sensor.iphone_battery_state
      - binary_sensor.nest_home

########################
# Proximity
########################
proximity:
  home:
    zone: home
    ignored_zones:
      # - OCC
      # - SPCC
      # - Work
      # - home
      # - example_zone_10
    tolerance: 50
    unit_of_measurement: mi
    devices:
      - device_tracker.bayesian_resident_home
      
  example_zone_05:
    zone: example_zone_05
    ignored_zones:
    #   - SPCC
    #   - Work
    #   - home
    tolerance: 20
    unit_of_measurement: mi
    devices:
      - device_tracker.bayesian_resident_home
      
  example_zone_08:
    zone: example_zone_08
    ignored_zones:
      # - OCC
      # - Work
      # - home
    tolerance: 50
    unit_of_measurement: mi
    devices:
      - device_tracker.bayesian_resident_home
      
  work:
    zone: work
    ignored_zones:
  #     - OCC
  #     - SPCC
  #     - home
    tolerance: 50
    unit_of_measurement: mi
    devices:
      - device_tracker.bayesian_resident_home

  example_zone_10:
    zone: example_zone_10
    ignored_zones:
      # - Work
      # - OCC
    tolerance: 50
    unit_of_measurement: mi
    devices:
      - device_tracker.bayesian_resident_home

########################
# Scenes
########################
scene:

########################
# Scripts
########################
script:

########################
# Sensor
########################
sensor:
##Turn the direction of travel into a sensor which I can use in my automations
##Since sensors have a last changed timestamp.
  - platform: template
    sensors:
      heading_home:
        value_template: '{{ states.proximity.home.attributes.dir_of_travel |default("unknown") }}'
      home_distance:
        entity_id: sensor.time
        value_template: '{{ states.proximity.home.state }}'
        unit_of_measurement: 'mi'
      home_time:
        entity_id: sensor.time
        value_template: '{{ (as_timestamp(now()) - as_timestamp(states.sensor.heading_home.last_changed)) | int //60 }}'
        unit_of_measurement: 'minutes'
      example_zone_10:
        value_template: '{{ states.proximity.example_zone_10.attributes.dir_of_travel |default("unknown") }}'
        
########################
# Zone
########################
zone:
  - name: Home
    latitude: !secret home_latitude
    longitude: !secret home_longitude
    radius: 250

  - name: AAA
    latitude: 44.881071
    longitude: -93.205173
    radius: 900

  - name: OCC
    latitude: REDACTED
    longitude: REDACTED
    radius: 500
    
  - name: Example Zone 07
    latitude: !secret home_latitude
    longitude: !secret home_longitude
    passive: true
    radius: 56327
    
  - name: SPCC
    latitude: REDACTED
    longitude: REDACTED0
    radius: 250
  
  - name: REDACTED
    latitude: REDACTED
    longitude: REDACTED0
    radius: 32187 
    
  - name: Work
    latitude: !secret work_latitude
    longitude: !secret work_longitude
    radius: 400