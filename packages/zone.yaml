################################################################
## Packages / Zone
################################################################

################################################
## Customize
################################################

homeassistant:
  customize:
    ################################################
    ## Node Anchors
    ################################################

    package.node_anchors:
      customize: &customize
        package: 'zone'

      tracked_devices: &tracked_devices
        <<: *customize
        devices:
          - device_tracker.example_phone
          
      track_ios: &track_ios
        <<: *customize
        track_ios: true
          
      expose: &expose
        <<: *customize
        haaska_hidden: false
        homebridge_hidden: false

    ################################################
    ## Automations
    ################################################

    ################################################
    ## Binary Sensors
    ################################################
    binary_sensor.test_homeward:
      <<: *customize
      friendly_name: "Returning from long road trip"
    ################################################
    ## Groups
    ################################################

    ################################################
    ## Input Boolean
    ################################################

    ################################################
    ## Input Numbers
    ################################################

    ################################################
    ## Proximity
    ################################################
    proximity.home:
      <<: *tracked_devices
      friendly_name: Proximity to Home
    proximity.example_zone_05:
      <<: *tracked_devices
      friendly_name: Proximity to Example Zone 05
    proximity.example_zone_08:
      <<: *tracked_devices
      friendly_name: Proximity to Example Zone 08
    proximity.example_zone_10:
      <<: *tracked_devices
      friendly_name: Proximity to Example Zone 10
    proximity.work:
      <<: *tracked_devices
      friendly_name: Proximity to Work
    ################################################
    ## Scripts
    ################################################

    ################################################
    ## Sensors
    ################################################
    sensor.home_distance:
      <<: *customize
      friendly_name: "Distance to Home"
    sensor.home_time:
      <<: *customize
      friendly_name: "Last Change in Home Dir"
    sensor.example_zone_10:
      <<: *customize
      friendly_name: 'Direction of Example Zone 10'
    sensor.heading_home:
      <<: *customize
      friendly_name: 'Direction of Home'
    ################################################
    ## Thermostats
    ################################################

    ################################################
    ## Zone
    ################################################
    zone.home:
      <<: *track_ios
      friendly_name: "Example Zone 02"
      icon: mdi:home
    zone.example_zone_05:
      <<: *track_ios
      friendly_name: "Example Zone 05"
      icon: mdi:curling
    zone.example_zone_08:
      <<: *track_ios
      friendly_name: "Example Zone 08"
      icon: mdi:curling
    zone.example_zone_10:
      <<: *track_ios
      friendly_name: "Example Zone 10"
      icon: mdi:city
    zone.work:
      <<: *track_ios
      friendly_name: "Work"
      icon: mdi:domain

################################################
## Automation
################################################
automation:
  - id: return_from_road_trip
    alias: return_from_road_trip
    trigger:
    - platform: state
      entity_id: binary_sensor.test_homeward
      to: 'true'
    action:
    - service: climate.set_away_mode
      data:
        entity_id: climate.hallway_glycol
        away_mode: false
    - service: notify.all
      data:
        message: Turn off Nest Away while you drive home from a road trip.
########################
# Binary Sensors
########################
binary_sensor:
  - platform: template
    sensors:
      test_homeward:
        entity_id: sensor.time
        value_template: >-
          {% if
             (((as_timestamp(now()) - as_timestamp(states.sensor.heading_home.last_changed))//60) > 95) and (states.sensor.heading_home.state=="towards")
          %} true
          {% else %}
            false
          {% endif %}

########################
# Input Booleans
########################
input_boolean:

########################
# Input Numbers
########################
input_number:

########################
# Groups
########################
group:

########################
# Proximity
########################
proximity:
  home:
    zone: home
    ignored_zones:
      - OCC
      - SPCC
      - Work
      - home
      - example_zone_10
    tolerance: 50
    unit_of_measurement: mi
  example_zone_05:
    zone: example_zone_05
    ignored_zones:
      - SPCC
      - Work
      - home
    tolerance: 20
    unit_of_measurement: mi
  example_zone_08:
    zone: example_zone_08
    ignored_zones:
      - OCC
      - Work
      - home
    tolerance: 50
    unit_of_measurement: mi
  work:
    zone: work
    ignored_zones:
      - OCC
      - SPCC
  #    - home
    tolerance: 50
    unit_of_measurement: mi
  example_zone_10:
    zone: example_zone_10
    ignored_zones:
      - Work
      - OCC
    tolerance: 50
    unit_of_measurement: mi

########################
# Scenes
########################
scene:

########################
# Scripts
########################
script:

########################
# Sensor
########################
sensor:
##Turn the direction of travel into a sensor which I can use in my automations
##Since sensors have a last changed timestamp.
  - platform: template
    sensors:
      heading_home:
        value_template: '{{ states.proximity.home.attributes.dir_of_travel |default("unknown") }}'
      home_distance:
        entity_id: sensor.time
        value_template: '{{ states.proximity.home.state }}'
        unit_of_measurement: 'mi'
      home_time:
        entity_id: sensor.time
        value_template: '{{ (as_timestamp(now()) - as_timestamp(states.sensor.heading_home.last_changed)) | int //60 }}'
        unit_of_measurement: 'minutes'
      example_zone_10:
        value_template: '{{ states.proximity.example_zone_10.attributes.dir_of_travel |default("unknown") }}'
        
########################
# Zone
########################
zone:
  - name: Home
    latitude: !secret home_latitude
    longitude: !secret home_longitude
    radius: 250
    
  - name: OCC
    latitude: REDACTED
    longitude: REDACTED
    radius: 500
  
  - name: SPCC
    latitude: REDACTED
    longitude: REDACTED0
    radius: 250
  
  - name: REDACTED
    latitude: REDACTED
    longitude: REDACTED0
    radius: 32187 
    icon: mdi:city

    -name: Work
    latitude: !secret work_latitude
    longitude: !secret work_longitude
    radius: 400
    icon: mdi:domain