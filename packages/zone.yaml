# Home Assistant package for core presence and arrival/departure behavior.
# Complex areas: it builds the canonical home-state sensors and then uses them to drive ETA updates, arrival lighting, open-door reminders, and vacuum-return logic.

################################################################
## Packages / Zone
################################################################

################################################
## Customize
################################################

homeassistant:
  customize:
    ################################################
    ## Node Anchors
    ################################################

    package.node_anchors:
      customize: &customize
        package: "zone"

      tracked_devices: &tracked_devices
        <<: *customize
        devices:
          - device_tracker.bayesian_zeke_home

      track_ios: &track_ios
        <<: *customize
        track_ios: true

      expose: &expose
        <<: *customize
        haaska_hidden: false
        homebridge_hidden: false

    ################################################
    ## Automations
    ################################################
    automation.zeke_arrival_emitter:
      <<: *customize
      friendly_name: Zeke Arrival Event Emitter
      icon: mdi:home-import-outline
    automation.zeke_departure_emitter:
      <<: *customize
      friendly_name: Zeke Departure Event Emitter
      icon: mdi:home-export-outline
    automation.cloudy_home_arrival:
      <<: *customize
      friendly_name: Cloudy Day Arrival
      icon: mdi:weather-cloudy
    automation.turn_on_lights_at_night_when_i_get_home:
      <<: *customize
      friendly_name: Night Arrival
    automation.turn_on_bedroom_lights_at_night_when_i_get_home:
      <<: *customize
      friendly_name: Bedroom Night Arrival
    automation.run_verified_departure:
      <<: *customize
      friendly_name: Verified Departure
    automation.vacuum_return_home:
      <<: *customize
      friendly_name: Stop Vacuuming on Arrival
      icon: mdi:robot-vacuum

    ################################################
    ## Binary Sensors
    ################################################
    binary_sensor.bayesian_zeke_home:
      <<: *customize
      friendly_name: "Home"
      device_class: presence

    binary_sensor.test_homeward:
      <<: *customize
      friendly_name: "Returning from long road trip (95 minutes)"

      binary_sensor.arrival_sensor_presence:
        <<: *customize
        # friendly_name: Zigbee Arrival Sensor
        #device_class: occupancy

    ################################################
    ## Device Trackers
    ################################################

    ################################################
    ## Groups
    ################################################
    group.bayesian_inputs:
      <<: *customize
      friendly_name: Bayesian Presence Entities
    ################################################
    ## Input Boolean
    ################################################
    input_boolean.bayesian_zeke_home:
      <<: *customize
      friendly_name: Bayesian Presence Constraint
    ################################################
    ## Input Datetime
    ################################################
    input_datetime.contextual_arrival_last_empty_at:
      <<: *customize
      friendly_name: "Contextual Arrival Last Empty House"
    ################################################
    ## Input Numbers
    ################################################

    ################################################
    ## Scripts
    ################################################
    script.update_nest_eta:
      <<: *customize
      friendly_name: "Distance to Home"
    script.departure_integrity:
      <<: *customize
      friendly_name: "Departure Integrity"
      icon: mdi:home-export-outline
    ################################################
    ## Sensors
    ################################################
    sensor.home_time:
      <<: *customize
      friendly_name: "Last Change in Home Dir"
    sensor.zeke_direction:
      <<: *customize
      friendly_name: "Zeke Direction"
    ################################################
    ## Thermostats
    ################################################

    ################################################
    ## Zone
    ################################################
    zone.allianzfield:
      <<: *track_ios
      friendly_name: "Allianz Field"
    zone.home:
      <<: *track_ios
      friendly_name: "The Brewery"
      icon: mdi:home
    zone.msp:
      <<: *track_ios
      friendly_name: "MSP Airport"
      icon: mdi:airplane-landing
    zone.occ:
      <<: *track_ios
      friendly_name: "Owatonna Curling Club"
      icon: mdi:curling
    zone.rochester:
      <<: *track_ios
      friendly_name: "Rochester"
      icon: mdi:city-variant
    zone.spcc:
      <<: *track_ios
      friendly_name: "St Paul Curling Club"
      icon: mdi:curling
    zone.targetfield:
      <<: *track_ios
      friendly_name: "Target Field"
    zone.twincities:
      <<: *track_ios
      friendly_name: "Twin Cities"
      icon: mdi:city
    zone.work:
      <<: *track_ios
      friendly_name: "Work"
      icon: mdi:domain

################################################
## Automation
################################################
automation:
  - id: zeke_arrival_emitter
    alias: zeke_arrival_emitter
    description: >-
      Own the canonical Zeke arrival triggers and emit a shared event so each
      downstream reaction can keep its own mode, trace history, and conditions.
      Additional people should add their own emitter with the same event
      contract and a distinct person value.
    mode: parallel
    trace:
      stored_traces: 10
    trigger:
      - trigger: zone
        id: tracker_entered_home
        entity_id: device_tracker.bayesian_zeke_home
        zone: zone.home
        event: enter
      - trigger: state
        id: bayesian_presence_on
        entity_id: binary_sensor.bayesian_zeke_home
        from: "off"
        to: "on"
    action:
      - event: zeke_arrival
        event_data:
          person: zeke
          reason: zeke_arrival
          source_trigger: "{{ trigger.id }}"
          tracker_entity_id: device_tracker.bayesian_zeke_home
          presence_entity_id: binary_sensor.bayesian_zeke_home

  - id: zeke_departure_emitter
    alias: zeke_departure_emitter
    description: >-
      Own the canonical Zeke departure triggers and emit a shared event so each
      downstream reaction can keep its own mode, trace history, and conditions.
      Additional people should add their own emitter with the same event
      contract and a distinct person value.
    mode: parallel
    trace:
      stored_traces: 10
    trigger:
      - trigger: zone
        id: tracker_left_home
        entity_id: device_tracker.bayesian_zeke_home
        zone: zone.home
        event: leave
      - trigger: state
        id: bayesian_presence_off
        entity_id: binary_sensor.bayesian_zeke_home
        from: "on"
        to: "off"
    action:
      - event: zeke_departure
        event_data:
          person: zeke
          reason: zeke_departure
          source_trigger: "{{ trigger.id }}"
          tracker_entity_id: device_tracker.bayesian_zeke_home
          presence_entity_id: binary_sensor.bayesian_zeke_home

  - id: cloudy_home_arrival
    alias: cloudy_home_arrival
    trace:
      stored_traces: 10
    trigger:
      - trigger: event
        id: cloudy_home_arrival_signal
        event_type: zeke_arrival
        event_data:
          person: zeke
    condition:
      condition: and
      conditions:
        - condition: numeric_state
          entity_id: sensor.tomorrow_io_the_brewery_cloud_cover
          above: 50
        - condition: state
          entity_id: binary_sensor.bayesian_bed_occupancy
          # entity_id: input_boolean.chatgpt_bed_occupied
          state: "off"
          # enabled: false
    action:
      - action: script.contextual_arrival_transition
        data:
          requested_mode: home
          reason: cloudy_home_arrival
          light_scene: scene.cloudy_arrive_home
          light_transition: 30
          notify_message: Cloudy day arrival.

  - id: default_arrive_home
    alias: default_arrive_home
    trace:
      stored_traces: 10
    trigger:
      - trigger: event
        id: default_arrive_home_signal
        event_type: zeke_arrival
        event_data:
          person: zeke
    condition:
      and:
        - condition: state
          entity_id: binary_sensor.bayesian_bed_occupancy
          # entity_id: input_boolean.chatgpt_bed_occupied
          state: "off"
        - alias: "I'm driving home"
          condition: state
          entity_id: sensor.wethop_activity
          state: "Automotive"
    action:
      - action: script.contextual_arrival_transition
        data:
          requested_mode: home
          reason: default_arrive_home
      # - alias: "Notify action"
      #   action: notify.mobile_app_wethop
      #   data:
      #     message: >-
      #       Arriving home with wethop activity {{ states('sensor.wethop_activity') }}

  - alias: input_boolean_tracker_on
    id: input_boolean_tracker_on
    trace:
      stored_traces: 10
    trigger:
      - trigger: state
        entity_id: binary_sensor.bayesian_zeke_home
        to: "on"
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bayesian_zeke_home

  - alias: input_boolean_tracker_off
    id: input_boolean_tracker_off
    trace:
      stored_traces: 10
    trigger:
      - trigger: event
        id: empty_house_tracker_signal
        event_type: zeke_departure
        event_data:
          person: zeke
    condition:
      # Only the emitter's from:on -> off Bayesian source updates the empty-house
      # timestamp; the GPS zone leave source can fire before the house is empty.
      - alias: "Only update empty-house timestamp from Bayesian departure"
        condition: template
        value_template: "{{ trigger.event.data.source_trigger == 'bayesian_presence_off' }}"
    action:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bayesian_zeke_home
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.contextual_arrival_last_empty_at
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  - id: play_spotify_when_i_get_home
    alias: play_spotify_when_i_get_home
    trace:
      stored_traces: 10
    trigger:
      - trigger: event
        id: arrival_music_signal
        event_type: zeke_arrival
        event_data:
          person: zeke
    condition:
      - alias: "Arrival music allowed when guest mode is off"
        condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
      - condition: state
        entity_id: binary_sensor.bayesian_bed_occupancy
        # entity_id: input_boolean.chatgpt_bed_occupied
        state: "off"
      - alias: "I'm driving home"
        condition: state
        entity_id: sensor.wethop_activity
        state: "Automotive"
      # - condition: template
      #   value_template: >-
      #     {{ not is_state('media_player.spotify_ryan_claussen', 'playing') }}
    action:
      - action: script.turn_on
        target:
          entity_id: script.spotify_arrival
      - action: notify.all
        data:
          message: "Welcome Home"

  - id: turn_on_lights_at_night_when_i_get_home
    alias: turn_on_lights_at_night_when_i_get_home
    trace:
      stored_traces: 50
    trigger:
      - trigger: event
        id: night_arrival_signal
        event_type: zeke_arrival
        event_data:
          person: zeke
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: binary_sensor.bayesian_bed_occupancy
          # entity_id: input_boolean.chatgpt_bed_occupied
          state: "off"
          # enabled: false
        - condition: or
          conditions:
            - condition: sun
              after: sunset
              after_offset: "-1:00:00"
            - condition: sun
              before: sunrise
    action:
      - action: script.contextual_arrival_transition
        data:
          requested_mode: night
          reason: night_arrival
          light_transition: 30
      - action: vacuum.return_to_base
        target:
          entity_id: all
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.long_range_travel

  - id: turn_on_bedroom_lights_at_night_when_i_get_home
    alias: turn_on_bedroom_lights_at_night_when_i_get_home
    trace:
      stored_traces: 50
    trigger:
      - trigger: event
        id: bedroom_prep_arrival_signal
        event_type: zeke_arrival
        event_data:
          person: zeke
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: binary_sensor.bayesian_bed_occupancy
          # entity_id: input_boolean.chatgpt_bed_occupied
          state: "off"
          # enabled: false
        - condition: or
          conditions:
            - condition: time
              after: "22:00:00"
            - condition: sun
              before: sunrise
    action:
      - action: script.contextual_arrival_transition
        data:
          requested_mode: night
          reason: bedroom_prep_arrival
          extra_scene: scene.bedroom_prep
      - action: notify.all
        data:
          data:
            url: "/ryan-new-mushroom/owner-suite"
          message: "Bedroom Prep Activated"

  # Use Ecobee Vacation mode now.
  # - id: return_from_road_trip
  #   alias: return_from_road_trip
  #   trigger:
  #     - platform: state
  #       entity_id: binary_sensor.test_homeward
  #       to: "true"
  #   action:
  #     # - action: nest.set_eta
  #     #   data_template:
  #     #     eta: '{{states.sensor.time_to_home.state}}'
  #     #     trip_id: "{{ states.input_select.trip_origin.state }}"
  #     - action: climate.set_temperature
  #       data:
  #         temperature: 70
  #         # Z-Wave Thermostat
  #         # entity: climate.glycol_thermostat
  #         # Nest Thermostat
  #         entity: climate.my_ecobee
  #     - action: notify.all
  #       data_template:
  #         message: >-
  #           Turning on HVAC while you drive home from a road trip

  # TODO change implementation
  - id: return_home_from_specific_location
    alias: return_home_from_specific_location
    trace:
      stored_traces: 10
    trigger:
      # - platform: state
      #   entity_id: device_tracker.bayesian_zeke_home
      #   from: 'Twin Cities'
      - trigger: zone
        entity_id: device_tracker.bayesian_zeke_home
        zone: zone.rochester
        event: leave
      - trigger: zone
        entity_id: device_tracker.bayesian_zeke_home
        zone: zone.allianzfield
        event: leave
      - trigger: zone
        entity_id: device_tracker.bayesian_zeke_home
        zone: zone.targetfield
        event: leave
    # condition:
    #   condition: template
    #   value_template: '{{ 110 <= sensor.zeke_direction <= 260 }}'
    action:
      # - action: nest.set_eta
      #   data_template:
      #     eta: '{{states.sensor.time_to_home.state}}'
      #     trip_id: "{{ states.input_select.trip_origin.state }}"
      # - action: climate.set_preset_mode
      #   entity_id: climate.my_ecobee
      #   data:
      #     preset_mode: "Home" # TODO set this to the correct schedule (Home or Sleep)
      - action: ecobee.resume_program
        data:
          resume_all: true
          entity_id: climate.my_ecobee
      - action: notify.all
        data:
          data:
            url: "/ryan-new-mushroom/climate"
          message: >-
            Turn off HVAC Away Mode. You {{trigger.event}} {{trigger.zone}} in direction {{ states('sensor.zeke_direction') }}. Setting Ecobee Home.

  - id: run_verified_departure
    alias: run_verified_departure
    description: Run the verified away transition only after the house is empty.
    mode: restart
    trace:
      stored_traces: 10
    trigger:
      - trigger: event
        id: departure_house_transition_signal
        event_type: zeke_departure
        event_data:
          person: zeke
    condition:
      - alias: "Only start departure integrity from Bayesian departure"
        condition: template
        value_template: "{{ trigger.event.data.source_trigger == 'bayesian_presence_off' }}"
      - alias: "Departure transition allowed when guest mode is off"
        condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
      # Gate on the canonical empty-house Bayesian signal, not the derived GPS
      # tracker: appdaemon/apps/tracker.py only moves the tracker out of the
      # home zone on a later GPS callback, so at bayesian_presence_off time the
      # tracker can still read `home`. Requiring the tracker to have left here
      # made the source check and the tracker check mutually exclusive, so the
      # away transition never ran (#110, Codex P1).
      - alias: "House is empty per the Bayesian presence signal"
        condition: state
        entity_id: binary_sensor.bayesian_zeke_home
        state: "off"
      - alias: "I'm driving away"
        enabled: false
        condition: state
        entity_id: sensor.wethop_activity
        state: "Automotive"
        # Todo add biking here?
    action:
      - action: script.departure_integrity
        data:
          reason: leave_home

  - alias: Update Bayesian Device tracker on start
    description: When HA starts up, update bayesian device tracker GPS items
    id: update_bayesian_device_tracker_on_start
    trace:
      stored_traces: 10
    trigger:
      - trigger: homeassistant
        event: start
    action:
      - delay: "00:01:00"
      - action: button.press
        target:
          entity_id: button.nigori_force_data_update
      - action: homeassistant.update_entity
        target:
          entity_id:
            - device_tracker.wethop
            - device_tracker.nigori_location_tracker
            - binary_sensor.arrival_sensor_presence
            - device_tracker.wethop_wifi

  - id: update_trip_origin
    alias: update_trip_origin
    trace:
      stored_traces: 10
    trigger:
      - trigger: state
        entity_id: device_tracker.bayesian_zeke_home
    condition:
      - condition: template
        value_template: >-
          {{
            as_timestamp(now(), default=now()) - as_timestamp(states.device_tracker.bayesian_zeke_home.last_changed, default=now()) |int > 72000
            or
            not is_state('device_tracker.bayesian_zeke_home', 'not_home')
          }}
    action:
      - action: input_select.select_option
        target:
          entity_id: input_select.trip_origin
        data:
          option: "{{ trigger.to_state.state }}"

  # - id: update_nest_eta
  #   alias: update_nest_eta
  #   trigger:
  #     - platform: zone
  #       entity_id: device_tracker.bayesian_zeke_home
  #       zone: zone.twincities
  #       event: enter
  #     - platform: state
  #       entity_id: device_tracker.bayesian_zeke_home
  #       to: "Twin Cities"
  #       from: "Away"
  #   action:
  #     # - action: nest.set_eta
  #     #   data_template:
  #     #     eta: '{{states.sensor.time_to_home.state}}'
  #     #     trip_id: "{{ states.input_select.trip_origin.state }}"
  #     - action: climate.set_temperature
  #       data:
  #         temperature: 70
  #         # Z-Wave Thermostat
  #         # entity: climate.glycol_thermostat
  #         # Nest Thermostat
  #         entity: climate.my_ecobee
  #     - action: notify.all
  #       data_template:
  #         message: >-
  #           Entering Twin Cities from direction {{ states('sensor.zeke_direction') }}. Turning off Away Mode. ETA to home {{ states('sensor.time_to_home') }}.

  - id: vacuum_return_home
    alias: vacuum_return_home
    trace:
      stored_traces: 10
    trigger:
      - trigger: event
        id: vacuum_return_arrival_signal
        event_type: zeke_arrival
        event_data:
          person: zeke
    action:
      - action: vacuum.return_to_base
        target:
          entity_id:
            - vacuum.valetudo_den
            - vacuum.x40_ultra
      - action: mqtt.publish
        data:
          topic: valetudo/upstairs-vacuum/BasicControlCapability/operation/set
          payload: HOME
      - action: switch.turn_off
        target:
          entity_id: switch.livingroom_motion_detection
      - action: switch.turn_off
        target:
          entity_id: switch.tiki_room_camera

  - id: vacuum_leave_home
    alias: vacuum_leave_home
    description: Run the main and upstairs levels on departure, plus the den when its door is closed.
    trace:
      stored_traces: 10
    trigger:
      - trigger: event
        id: vacuum_departure_signal
        event_type: zeke_departure
        event_data:
          person: zeke
    condition:
      - alias: "Only start departure vacuum from Bayesian departure"
        condition: template
        value_template: "{{ trigger.event.data.source_trigger == 'bayesian_presence_off' }}"
      - alias: "Departure vacuum allowed when guest mode is off"
        condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
    action:
      - action: script.vacuum_main_and_upstairs_levels
        continue_on_error: true
      - action: script.vacuum_den_pet_safe_start
        continue_on_error: true

########################
# Binary Sensors
########################
binary_sensor:
  # Working prior to 6/27/2022
  # - platform: bayesian
  #   prior: 0.1
  #   name: bayesian_zeke_home
  #   probability_threshold: 0.80
  #   observations:
  #     - entity_id: device_tracker.wethop
  #       prob_given_true: 0.80
  #       prob_given_false: 0.1
  #       platform: "state"
  #       to_state: "home"
  #     - entity_id: device_tracker.wethop_wifi
  #       prob_given_true: 0.70
  #       prob_given_false: 0.3
  #       platform: "state"
  #       to_state: "home"
  #     - entity_id: device_tracker.nigori_location_tracker
  #       prob_given_true: 0.80
  #       prob_given_false: 0.1
  #       platform: "state"
  #       to_state: "home"
  #     - entity_id: binary_sensor.arrival_sensor_presence
  #       prob_given_true: 0.99
  #       prob_given_false: 0.01
  #       platform: "state"
  #       to_state: "on"
  #     ### Try out the speed sensor
  #     - entity_id: sensor.zeke_speed
  #       platform: "numeric_state"
  #       below: 25
  #       prob_given_true: 0.60
  #     - platform: template
  #       prob_given_true: 0.95
  #       prob_given_false: 0.05
  #       value_template: >-
  #         {{ is_state('sensor.wethop_activity', 'Walking') and (states('sensor.zeke_speed')|float(default=0) <=5) and (is_state('device_tracker.bayesian_zeke_home', 'Twin Cities')) }}
  #     - platform: template
  #       prob_given_true: 0.95
  #       prob_given_false: 0.05
  #       value_template: >-
  #         {{ is_state('sensor.wethop_activity', 'Biking') and (states('sensor.zeke_speed')|float(default=0) <=5) and (is_state('device_tracker.bayesian_zeke_home', 'Twin Cities')) }}
  #     - platform: template
  #       prob_given_true: 0.05
  #       prob_given_false: 0.95
  #       value_template: >-
  #         {{ is_state('sensor.wethop_activity', 'Automotive') and (states('sensor.zeke_speed')|float(default=0) >=5) }}

  - platform: bayesian
    unique_id: bayesian_zeke_home
    prior: 0.92
    name: bayesian_zeke_home
    probability_threshold: 0.80
    observations:
      - entity_id: device_tracker.wethop
        prob_given_true: .995
        prob_given_false: 0.0005
        platform: state
        to_state: "home"
      - entity_id: sensor.wethop_ssid
        prob_given_true: 0.98
        prob_given_false: 0.60  # brief disconnects common at home; travel router guards false positives
        platform: state
        to_state: !secret home_ssid
      - entity_id: device_tracker.nigori_location_tracker
        prob_given_true: 0.95
        prob_given_false: 0.55  # car stays home when flying; trip observation guards the false positive
        platform: state
        to_state: "home"
      - entity_id: binary_sensor.arrival_sensor_presence
        prob_given_true: 0.999
        prob_given_false: 0.05  # sensor is in the car; car at home ≠ Zeke home; trip observation guards this
        platform: state
        to_state: "on"
      - entity_id: input_boolean.trip
        prob_given_true: 0.01   # almost never on a trip when home
        prob_given_false: 0.15  # most non-home time is daily away (work, errands), not a trip
        platform: state
        to_state: "on"

########################
# Device Trackers
########################
device_tracker: []

########################
# Input Booleans
########################
input_boolean:
  bayesian_zeke_home:

########################
# Input Numbers
########################
input_number: {}

########################
# Input Datetime
########################
input_datetime:
  contextual_arrival_last_empty_at:
    name: "Contextual Arrival Last Empty House"
    has_date: true
    has_time: true

########################
# Input Select
########################
input_select:
  trip_origin:
    name: "Trip Origin"
    options:
      - "MSP Airport"
      - "Owatonna Curling Club"
      - "St Paul Curling Club"
      - "Twin Cities"
