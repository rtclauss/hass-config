########################
# Scripts
########################
script:
  departure_integrity:
    alias: departure_integrity
    description: >-
      Apply the empty-house shutdown, retry available stragglers once, and
      send one actionable notification only when exceptions remain.
    mode: restart
    trace:
      stored_traces: 10
    fields:
      reason:
        description: Optional reason for the departure integrity run.
        example: leave_home
    variables:
      protected_departure_lights:
        - light.outside_front_hue
        - light.outside_north_west_garage
        - light.outside_south_west_garage
        - light.outside_front_door
      departure_media_off_targets:
        - media_player.lg_webos_smart_tv
        - media_player.basement
      departure_ma_targets:
        - media_player.ma_bedroom
        - media_player.ma_bathroom
        - media_player.ma_office
        - media_player.ma_den
        - media_player.ma_tiki_room
      departure_camera_targets:
        - switch.livingroom_motion_detection
        - switch.tiki_room_camera
    sequence:
      - alias: "Departure integrity is disabled while guest mode is active"
        condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
      # The Bayesian empty-house sensor is the canonical departure signal. The
      # derived GPS tracker can still read `home` at this point (it only leaves
      # the home zone on a later GPS callback), so gating on it here would stall
      # the away transition (#110, Codex P1).
      - alias: "Departure integrity requires an empty house"
        condition: state
        entity_id: binary_sensor.bayesian_zeke_home
        state: "off"
      - action: script.house_transition
        data:
          mode: away
          reason: "{{ reason | default('departure_integrity', true) }}"
          apply_trip_policy: true
      - delay:
          seconds: 10
      - alias: "Stop retry work if guest mode became active"
        condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
      - alias: "Stop retry work if the resident returned"
        condition: state
        entity_id: binary_sensor.bayesian_zeke_home
        state: "off"
      - variables:
          retry_lock: >-
            {{ states('lock.front_door_lock') not in ['locked', 'unknown', 'unavailable'] }}
          retry_garage: >-
            {{ states('cover.garage_door') not in ['closed', 'closing', 'unknown', 'unavailable'] }}
          retry_media_off_targets: >-
            {%- set ns = namespace(entities=[]) -%}
            {%- for entity_id in departure_media_off_targets -%}
              {%- if states(entity_id) not in ['off', 'unknown', 'unavailable'] -%}
                {%- set ns.entities = ns.entities + [entity_id] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.entities | join(', ') }}
          retry_ma_targets: >-
            {%- set ns = namespace(entities=[]) -%}
            {%- for entity_id in departure_ma_targets -%}
              {%- if states(entity_id) in ['playing', 'buffering'] -%}
                {%- set ns.entities = ns.entities + [entity_id] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.entities | join(', ') }}
          retry_camera_targets: >-
            {%- set ns = namespace(entities=[]) -%}
            {%- for entity_id in departure_camera_targets -%}
              {%- if states(entity_id) not in ['on', 'unknown', 'unavailable'] -%}
                {%- set ns.entities = ns.entities + [entity_id] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.entities | join(', ') }}
          fans_on: >-
            {{ states.fan | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | join(', ') }}
          interior_lights_on: >-
            {%- set opaque_group_members = {
              'light.outside_front_lights': [
                'light.outside_front_hue',
                'light.outside_north_west_garage',
                'light.outside_south_west_garage',
                'light.outside_front_door'
              ]
            } -%}
            {%- set ns = namespace(entities=[]) -%}
            {%- for light in states.light -%}
              {%- set runtime_members = state_attr(light.entity_id, 'entity_id') -%}
              {%- if runtime_members is iterable and runtime_members is not string -%}
                {%- set members = runtime_members | list -%}
              {%- elif light.entity_id in opaque_group_members -%}
                {%- set members = opaque_group_members[light.entity_id] -%}
              {%- else -%}
                {%- set members = [] -%}
              {%- endif -%}
              {%- set protected = light.entity_id in protected_departure_lights
                or (members | select('in', protected_departure_lights) | list | count > 0) -%}
              {%- if light.state == 'on' and not protected -%}
                {%- set ns.entities = ns.entities + [light.entity_id] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.entities | join(', ') }}
          departure_retry_needed: >-
            {{ retry_lock or retry_garage
               or retry_media_off_targets | trim != ''
               or retry_ma_targets | trim != ''
               or retry_camera_targets | trim != ''
               or fans_on | trim != ''
               or interior_lights_on | trim != '' }}
      - if:
          - condition: template
            value_template: "{{ departure_retry_needed }}"
        then:
          - alias: "Retry available departure failures once"
            parallel:
              - if:
                  - condition: template
                    value_template: "{{ retry_lock }}"
                then:
                  - continue_on_error: true
                    action: lock.lock
                    target:
                      entity_id: lock.front_door_lock
              - if:
                  - condition: template
                    value_template: "{{ retry_garage }}"
                then:
                  - continue_on_error: true
                    action: cover.close_cover
                    target:
                      entity_id: cover.garage_door
              - if:
                  - condition: template
                    value_template: "{{ retry_media_off_targets | trim != '' }}"
                then:
                  - continue_on_error: true
                    action: media_player.turn_off
                    target:
                      entity_id: "{{ retry_media_off_targets }}"
              - if:
                  - condition: template
                    value_template: "{{ retry_ma_targets | trim != '' }}"
                then:
                  - continue_on_error: true
                    action: media_player.media_pause
                    target:
                      entity_id: "{{ retry_ma_targets }}"
              - if:
                  - condition: template
                    value_template: "{{ retry_camera_targets | trim != '' }}"
                then:
                  - continue_on_error: true
                    action: switch.turn_on
                    target:
                      entity_id: "{{ retry_camera_targets }}"
              - if:
                  - condition: template
                    value_template: "{{ fans_on | trim != '' }}"
                then:
                  - continue_on_error: true
                    action: fan.turn_off
                    target:
                      entity_id: "{{ fans_on }}"
              - if:
                  - condition: template
                    value_template: "{{ interior_lights_on | trim != '' }}"
                then:
                  - continue_on_error: true
                    action: script.lights_off_except
                    data:
                      exclude_lights: "{{ protected_departure_lights }}"
                      transition: 0
          - delay:
              seconds: 15
      # Give a normally-slow garage door time to finish closing before the final
      # check; a door stalled in "closing" times out here and is then reported
      # by the closed-only verification below (#110, Codex P1).
      - alias: "Allow the garage door to finish closing before verification"
        wait_template: "{{ is_state('cover.garage_door', 'closed') }}"
        timeout:
          seconds: 30
        continue_on_timeout: true
      - alias: "Do not notify if guest mode became active"
        condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
      - alias: "Do not notify if the resident returned"
        condition: state
        entity_id: binary_sensor.bayesian_zeke_home
        state: "off"
      - variables:
          final_interior_lights_on: >-
            {%- set opaque_group_members = {
              'light.outside_front_lights': [
                'light.outside_front_hue',
                'light.outside_north_west_garage',
                'light.outside_south_west_garage',
                'light.outside_front_door'
              ]
            } -%}
            {%- set ns = namespace(entities=[]) -%}
            {%- for light in states.light -%}
              {%- set runtime_members = state_attr(light.entity_id, 'entity_id') -%}
              {%- if runtime_members is iterable and runtime_members is not string -%}
                {%- set members = runtime_members | list -%}
              {%- elif light.entity_id in opaque_group_members -%}
                {%- set members = opaque_group_members[light.entity_id] -%}
              {%- else -%}
                {%- set members = [] -%}
              {%- endif -%}
              {%- set protected = light.entity_id in protected_departure_lights
                or (members | select('in', protected_departure_lights) | list | count > 0) -%}
              {%- if light.state == 'on' and not protected -%}
                {%- set ns.entities = ns.entities + [light.entity_id] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.entities | join(', ') }}
          final_fans_on: >-
            {{ states.fan | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | join(', ') }}
          # Fans that are unknown/unavailable were never retried (only 'on' fans
          # are) and their turn-off could not be verified, so surface them so the
          # unavailable-target contract holds for bulk fan shutdown (#110, Codex).
          final_fans_unverified: >-
            {{ states.fan | selectattr('state', 'in', ['unavailable', 'unknown'])
               | map(attribute='entity_id') | join(', ') }}
          # Non-protected lights that are unknown/unavailable, same rationale as
          # the fans above; reuses the group-aware protected filter.
          final_interior_lights_unverified: >-
            {%- set opaque_group_members = {
              'light.outside_front_lights': [
                'light.outside_front_hue',
                'light.outside_north_west_garage',
                'light.outside_south_west_garage',
                'light.outside_front_door'
              ]
            } -%}
            {%- set ns = namespace(entities=[]) -%}
            {%- for light in states.light -%}
              {%- set runtime_members = state_attr(light.entity_id, 'entity_id') -%}
              {%- if runtime_members is iterable and runtime_members is not string -%}
                {%- set members = runtime_members | list -%}
              {%- elif light.entity_id in opaque_group_members -%}
                {%- set members = opaque_group_members[light.entity_id] -%}
              {%- else -%}
                {%- set members = [] -%}
              {%- endif -%}
              {%- set protected = light.entity_id in protected_departure_lights
                or (members | select('in', protected_departure_lights) | list | count > 0) -%}
              {%- if light.state in ['unavailable', 'unknown'] and not protected -%}
                {%- set ns.entities = ns.entities + [light.entity_id] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.entities | join(', ') }}
          departure_integrity_issues: >-
            {%- set ns = namespace(issues=[]) -%}
            {%- if not is_state('input_select.house_mode', 'away') -%}
              {%- set ns.issues = ns.issues + ['House mode is still ' ~ states('input_select.house_mode') ~ '.'] -%}
            {%- endif -%}
            {%- if states('lock.front_door_lock') != 'locked' -%}
              {%- set ns.issues = ns.issues + ['Front door lock is ' ~ states('lock.front_door_lock') ~ '.'] -%}
            {%- endif -%}
            {%- if states('cover.garage_door') != 'closed' -%}
              {%- set ns.issues = ns.issues + ['Garage door is ' ~ states('cover.garage_door') ~ '.'] -%}
            {%- endif -%}
            {%- if is_state('binary_sensor.any_egress_open', 'on') -%}
              {%- set names = state_attr('sensor.open_egress_points', 'friendly_names') | default('unknown egress point', true) -%}
              {%- set ns.issues = ns.issues + ['Door or window remains open: ' ~ names ~ '.'] -%}
            {%- elif states('binary_sensor.any_egress_open') in ['unknown', 'unavailable'] -%}
              {%- set ns.issues = ns.issues + ['Egress verification is ' ~ states('binary_sensor.any_egress_open') ~ '.'] -%}
            {%- endif -%}
            {%- set media_off_states = {'media_player.lg_webos_smart_tv': ['off', 'unavailable']} -%}
            {%- for entity_id in departure_media_off_targets -%}
              {%- set ok_states = media_off_states.get(entity_id, ['off']) -%}
              {%- if states(entity_id) not in ok_states -%}
                {%- set name = state_attr(entity_id, 'friendly_name') | default(entity_id, true) -%}
                {%- set ns.issues = ns.issues + [name ~ ' is ' ~ states(entity_id) ~ '.'] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- for entity_id in departure_ma_targets -%}
              {%- if states(entity_id) in ['playing', 'buffering', 'unknown', 'unavailable'] -%}
                {%- set name = state_attr(entity_id, 'friendly_name') | default(entity_id, true) -%}
                {%- set ns.issues = ns.issues + [name ~ ' is ' ~ states(entity_id) ~ '.'] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- for entity_id in departure_camera_targets -%}
              {%- if states(entity_id) != 'on' -%}
                {%- set name = state_attr(entity_id, 'friendly_name') | default(entity_id, true) -%}
                {%- set ns.issues = ns.issues + [name ~ ' is ' ~ states(entity_id) ~ '.'] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if final_interior_lights_on | trim != '' -%}
              {%- set ns.issues = ns.issues + ['Interior lights still on: ' ~ final_interior_lights_on ~ '.'] -%}
            {%- endif -%}
            {%- if final_interior_lights_unverified | trim != '' -%}
              {%- set ns.issues = ns.issues + ['Interior lights not verified off (unavailable/unknown): ' ~ final_interior_lights_unverified ~ '.'] -%}
            {%- endif -%}
            {%- if final_fans_on | trim != '' -%}
              {%- set ns.issues = ns.issues + ['Fans still on: ' ~ final_fans_on ~ '.'] -%}
            {%- endif -%}
            {%- if final_fans_unverified | trim != '' -%}
              {%- set ns.issues = ns.issues + ['Fans not verified off (unavailable/unknown): ' ~ final_fans_unverified ~ '.'] -%}
            {%- endif -%}
            {%- if is_state('input_boolean.trip', 'on') and not is_state('switch.vacation_simulation', 'on') -%}
              {%- set ns.issues = ns.issues + ['Vacation simulation is not on while trip mode is on.'] -%}
            {%- elif is_state('input_boolean.trip', 'off') and is_state('switch.vacation_simulation', 'on') -%}
              {%- set ns.issues = ns.issues + ['Vacation simulation is still on while trip mode is off.'] -%}
            {%- endif -%}
            {{ ns.issues | join('\n') }}
      - if:
          - condition: template
            value_template: "{{ departure_integrity_issues | trim != '' }}"
        then:
          - action: notify.all
            data:
              message: >-
                Departure integrity found exceptions{% if reason is defined and reason | string | trim %} ({{ reason }}){% endif %}:

                {{ departure_integrity_issues }}

  contextual_arrival_transition:
    alias: contextual_arrival_transition
    description: >-
      Apply absence-tiered arrival lighting and climate behavior before
      delegating to the shared house transition script.
    mode: restart
    trace:
      stored_traces: 10
    fields:
      requested_mode:
        description: "Arrival mode to pass to house_transition: home or night."
        example: home
      reason:
        description: Optional logbook reason for the arrival transition.
        example: default_arrive_home
      light_scene:
        description: Optional base scene for half-day arrivals.
        example: scene.cloudy_arrive_home
      light_transition:
        description: Optional base transition seconds.
        example: 30
      extra_scene:
        description: Optional extra scene for non-quick arrivals.
        example: scene.bedroom_prep
      notify_message:
        description: Optional notify.all message for the transition.
        example: Cloudy day arrival.
    variables:
      normalized_mode: >-
        {% set normalized = (requested_mode | default('home', true) | string | lower | trim) %}
        {{ 'night' if normalized == 'night' else 'home' }}
      last_empty_timestamp: >-
        {% set raw = states('input_datetime.contextual_arrival_last_empty_at') %}
        {% set parsed = as_timestamp(raw, default=none) %}
        {{ parsed if parsed is not none else as_timestamp(now()) }}
      absence_seconds: >-
        {{ [as_timestamp(now()) - (last_empty_timestamp | float(as_timestamp(now()))), 0] | max | int }}
      # An arrival automation can re-fire from its GPS zone trigger while the
      # house is still occupied (e.g. a GPS jitter re-enter). In that case the
      # house never emptied, so the persisted last_empty timestamp is stale and
      # would misclassify the re-entry as full/multi day. Treat presence that
      # has already been established (Bayesian "on" for more than the grace
      # window) as an occupied re-entry and force the minimal quick tier.
      seconds_since_presence: >-
        {% set lc = states.binary_sensor.bayesian_zeke_home.last_changed %}
        {{ (as_timestamp(now()) - as_timestamp(lc)) | int if lc is not none else 0 }}
      occupied_reentry: >-
        {{ is_state('binary_sensor.bayesian_zeke_home', 'on')
           and (seconds_since_presence | int(0)) > 300 }}
      arrival_tier: >-
        {% if occupied_reentry %}
          quick_errand
        {% elif absence_seconds < 3600 %}
          quick_errand
        {% elif absence_seconds < 28800 %}
          half_day
        {% elif absence_seconds < 86400 %}
          full_day
        {% else %}
          multi_day
        {% endif %}
      # Reached only when the caller passed no explicit light_scene (the
      # explicit case is handled first in tier_light_scene).
      base_light_scene: >-
        {% if normalized_mode == 'night' %}
          scene.night_arrive_home
        {% else %}
          scene.arrive_home
        {% endif %}
      # A caller that passes an explicit light_scene (e.g. the cloudy arrival,
      # whose whole purpose is a bright dark-house scene) wins over the absence
      # tier default. Absence tiering only picks the scene when the caller did
      # not specify one; climate gating below still varies by tier independently.
      tier_light_scene: >-
        {% if light_scene is defined and light_scene | string | trim %}
          {{ light_scene }}
        {% elif normalized_mode == 'night' and arrival_tier == 'quick_errand' %}
          scene.night_arrive_home_quick
        {% elif normalized_mode == 'home' and arrival_tier == 'quick_errand' %}
          scene.arrive_home_quick
        {% elif normalized_mode == 'home' and arrival_tier == 'full_day' %}
          scene.arrive_home_full_day
        {% elif normalized_mode == 'home' and arrival_tier == 'multi_day' %}
          scene.arrive_home_multi_day
        {% else %}
          {{ base_light_scene }}
        {% endif %}
      tier_light_transition: >-
        {% set base = light_transition | default(30, true) | int(30) %}
        {% if arrival_tier == 'quick_errand' %}
          5
        {% elif arrival_tier == 'multi_day' %}
          120
        {% elif arrival_tier == 'full_day' and base < 45 %}
          45
        {% else %}
          {{ base }}
        {% endif %}
      tier_extra_scene: >-
        {% if arrival_tier == 'quick_errand' %}
          none
        {% elif extra_scene is defined and extra_scene | string | trim %}
          {{ extra_scene }}
        {% else %}
          none
        {% endif %}
      tier_apply_climate: "{{ arrival_tier in ['full_day', 'multi_day'] }}"
      tier_notify_message: >-
        {% if notify_message is defined and notify_message | string | trim %}
          {{ notify_message }}
        {% else %}
          {{ '' }}
        {% endif %}
    sequence:
      - action: script.house_transition
        data:
          mode: "{{ normalized_mode }}"
          reason: "{{ reason | default('contextual_arrival', true) }}_{{ arrival_tier }}"
          light_scene: "{{ tier_light_scene }}"
          light_transition: "{{ tier_light_transition }}"
          extra_scene: "{{ tier_extra_scene }}"
          notify_message: "{{ tier_notify_message }}"
          apply_climate: "{{ tier_apply_climate }}"
  # update_nest_eta:
  #   sequence:
  #     - action: nest.set_eta
  #       data_template:
  #         eta: "{{states('sensor.time_to_home.state')}}"
  #         trip_id: "{{ states('input_select.trip_origin') }}"

