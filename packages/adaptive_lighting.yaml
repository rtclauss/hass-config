automation:
  - id: reconcile_owner_suite_adaptive_lighting
    alias: reconcile_owner_suite_adaptive_lighting
    description: >
      Reapply the Adaptive Lighting baselines after Home Assistant starts so
      kitchen, den, basement, dining-room, owner-suite, and vanity tuning survive
      restarts while preserving each room's intended scene and task-lighting behavior.
      The runtime dining-room Adaptive Lighting switch now uses the current dining-room entity id.
    mode: single
    trace:
      stored_traces: 10
    trigger:
      - trigger: homeassistant
        event: start
    action:
      - delay: "00:00:30"
      - action: adaptive_lighting.change_switch_settings
        data:
          entity_id: switch.dining_room_adaptive_lighting_dining_room
          use_defaults: current
          include_config_in_attributes: true
          take_over_control: true
          adapt_only_on_bare_turn_on: true
          only_once: false
          initial_transition: 1
          transition: 5
          detect_non_ha_changes: false
      - action: adaptive_lighting.change_switch_settings
        data:
          entity_id: switch.adaptive_lighting_kitchen
          use_defaults: current
          include_config_in_attributes: true
          take_over_control: true
          adapt_only_on_bare_turn_on: true
          only_once: true
          initial_transition: 1
          transition: 3
          detect_non_ha_changes: false
      - action: adaptive_lighting.change_switch_settings
        data:
          entity_id: switch.adaptive_lighting_den
          use_defaults: current
          include_config_in_attributes: true
          take_over_control: true
          adapt_only_on_bare_turn_on: true
          only_once: false
          initial_transition: 2
          transition: 2
          separate_turn_on_commands: true
          detect_non_ha_changes: false
      - action: adaptive_lighting.change_switch_settings
        data:
          entity_id: switch.adaptive_lighting_owner_suite
          use_defaults: current
          include_config_in_attributes: true
          take_over_control: true
          adapt_only_on_bare_turn_on: true
          only_once: false
          initial_transition: 2
          sleep_transition: 2
          transition: 5
          sleep_brightness: 1
          sleep_color_temp: 1000
          detect_non_ha_changes: false
      - action: adaptive_lighting.change_switch_settings
        data:
          entity_id: switch.adaptive_lighting_owner_suite_vanity
          use_defaults: current
          include_config_in_attributes: true
          take_over_control: true
          adapt_only_on_bare_turn_on: true
          only_once: true
          initial_transition: 1
          sleep_transition: 2
          transition: 5
          sleep_brightness: 1
          sleep_color_temp: 1000
          detect_non_ha_changes: false
      - action: adaptive_lighting.change_switch_settings
        data:
          entity_id: switch.adaptive_lighting_basement
          use_defaults: current
          include_config_in_attributes: true
          take_over_control: false
          adapt_only_on_bare_turn_on: false
          only_once: false
          initial_transition: 0
          sleep_transition: 1
          transition: 5
          min_brightness: 25
          max_brightness: 100
          min_color_temp: 2000
          max_color_temp: 5500
          sleep_brightness: 1
          sleep_color_temp: 1000
          detect_non_ha_changes: false
      # Signals that startup baseline reconciliation is complete. The Inovelli
      # LED-bar sync that previously consumed this event was removed (#832), so
      # it currently has no listeners. Kept intentionally as a documented
      # "reconcile complete" seam for future automations that must run only
      # after all room settings are restored.
      - event: adaptive_lighting_startup_reconciled

  - id: cap_automatic_bed_lightstrip_brightness
    alias: cap_automatic_bed_lightstrip_brightness
    description: >
      Keep automatic bed-strip brightness changes at or below 25% without
      constraining brightness changes made directly by a user. Change the
      bed_strip_automatic_max_brightness_percent variable to retune the cap later.
    mode: restart
    trace:
      stored_traces: 10
    variables:
      bed_strip_automatic_max_brightness_percent: 25
    trigger:
      - trigger: state
        entity_id: light.bed_lightstrip
        attribute: brightness
    condition:
      - condition: state
        entity_id: light.bed_lightstrip
        state: "on"
      - condition: template
        alias: "Bed strip is above the automatic brightness cap"
        value_template: >-
          {{ (state_attr('light.bed_lightstrip', 'brightness') | float(0) / 2.55)
             > (bed_strip_automatic_max_brightness_percent | float(25)) + 0.25 }}
      - condition: template
        alias: "Allow direct user brightness changes to override the cap"
        value_template: "{{ trigger.to_state.context.user_id is none }}"
    action:
      - action: light.turn_on
        target:
          entity_id: light.bed_lightstrip
        data:
          brightness_pct: "{{ bed_strip_automatic_max_brightness_percent }}"
          transition: 1

  - id: clear_hallway_adaptive_sleep_mode_when_house_sleep_ends
    alias: clear_hallway_adaptive_sleep_mode_when_house_sleep_ends
    description: >
      Explicitly release the hallway Adaptive Lighting sleep profile when the
      house sleep group turns off. The hallway sleep switch is currently a
      member of that UI-managed group, but this cleanup keeps the garage-entry
      safety path correct if group membership changes and after a restart.
    mode: restart
    trace:
      stored_traces: 10
    trigger:
      - trigger: state
        id: house-sleep-ended
        entity_id: switch.sleep_mode
        from: "on"
        to: "off"
      - trigger: homeassistant
        id: ha-start
        event: start
    action:
      - if:
          - condition: trigger
            id: ha-start
        then:
          - delay: "00:00:30"
      - condition: state
        entity_id: switch.sleep_mode
        state: "off"
      - condition: state
        entity_id: switch.adaptive_lighting_sleep_mode_hallway
        state: "on"
      - action: switch.turn_off
        target:
          entity_id: switch.adaptive_lighting_sleep_mode_hallway

  - id: apply_adaptive_lighting_on_arrival
    alias: apply_adaptive_lighting_on_arrival
    description: >
      Instantly correct color temperature and brightness for any lights that
      turn on as part of home-arrival automations. Fires for all transport
      modes (car, Uber, Lyft, walking) via the Bayesian presence sensor.
      A 2-second delay lets arrival-scene transitions begin before the
      adaptive apply fires. Empty-house arrivals can apply across all
      configured arrival switches; occupied-house arrivals only apply to
      configured lights that Adaptive Lighting has not marked as manually
      controlled. If the bed is occupied, only common-area arrival switches
      are eligible so the owner suite is not disturbed. Arrival only applies
      to switches that are already enabled; turn_on_lights=false keeps off
      lights undisturbed. Resolves #486.
    mode: single
    trace:
      stored_traces: 10
    trigger:
      - trigger: zone
        id: bayesian-device-entered-home
        entity_id: device_tracker.bayesian_zeke_home
        zone: zone.home
        event: enter
      - trigger: state
        id: bayesian-presence-turned-on
        entity_id: binary_sensor.bayesian_zeke_home
        from: "off"
        to: "on"
    action:
      - variables:
          arrival_home_was_empty: >-
            {{
              (
                trigger.id == 'bayesian-presence-turned-on'
                and trigger.from_state is not none
                and trigger.from_state.state == 'off'
              )
              or
              (
                trigger.id == 'bayesian-device-entered-home'
                and is_state('binary_sensor.bayesian_zeke_home', 'off')
              )
            }}
          arrival_common_adaptive_switches:
            - switch.adaptive_lighting_kitchen
            - switch.adaptive_lighting_den
            - switch.adaptive_lighting_hallway
          arrival_owner_suite_adaptive_switches:
            - switch.adaptive_lighting_owner_suite
      - variables:
          arrival_adaptive_switches: >-
            {{
              arrival_common_adaptive_switches
              + (
                arrival_owner_suite_adaptive_switches
                if is_state('binary_sensor.bayesian_bed_occupancy', 'off')
                else []
              )
            }}
      - variables:
          arrival_enabled_adaptive_switches: >-
            {% set enabled = namespace(switches=[]) %}
            {% for adaptive_switch in arrival_adaptive_switches %}
              {% if is_state(adaptive_switch, 'on') %}
                {% set enabled.switches = enabled.switches + [adaptive_switch] %}
              {% endif %}
            {% endfor %}
            {{ enabled.switches }}
      - delay:
          seconds: 2
      - choose:
          - alias: "Apply globally when this arrival starts from an empty house"
            conditions:
              - condition: template
                value_template: "{{ arrival_home_was_empty and arrival_enabled_adaptive_switches | count > 0 }}"
            sequence:
              - action: adaptive_lighting.apply
                data:
                  entity_id: "{{ arrival_enabled_adaptive_switches }}"
                  adapt_brightness: true
                  adapt_color: true
                  turn_on_lights: false
                  transition: 1
        default:
          - repeat:
              for_each: "{{ arrival_enabled_adaptive_switches }}"
              sequence:
                - variables:
                    configured_arrival_lights: >-
                      {% set configuration = state_attr(repeat.item, 'configuration') or {} %}
                      {{ configuration.get('lights', []) }}
                    manual_controlled_lights: >-
                      {{ state_attr(repeat.item, 'manual_control') or [] }}
                    eligible_arrival_lights: >-
                      {{
                        configured_arrival_lights
                        | reject('in', manual_controlled_lights)
                        | list
                      }}
                - if:
                    - condition: template
                      value_template: "{{ eligible_arrival_lights | count > 0 }}"
                  then:
                    - action: adaptive_lighting.apply
                      data:
                        entity_id: "{{ repeat.item }}"
                        lights: "{{ eligible_arrival_lights }}"
                        adapt_brightness: true
                        adapt_color: true
                        turn_on_lights: false
                        transition: 1

  - id: nightly_adaptive_lighting_cycle_reset
    alias: nightly_adaptive_lighting_cycle_reset
    description: >
      Every 4 hours, cycle every main adaptive lighting switch off then back on
      to unstick color or brightness matching that has drifted. A startup trigger
      acts as a recovery path: if HA restarts during the 10-second off window the
      next boot immediately re-enables all switches so they are never stranded off.
      Control switches (sleep_mode, adapt_brightness, adapt_color) are excluded to
      preserve their settings.
    mode: single
    trace:
      stored_traces: 50
    trigger:
      - trigger: time_pattern
        id: nightly-cycle
        hours: "/4"
      - trigger: homeassistant
        id: ha-start
        event: start
    variables:
      candidate_main_adaptive_switches:
        - switch.adaptive_lighting_basement
        - switch.adaptive_lighting_den
        - switch.adaptive_lighting_hallway
        - switch.adaptive_lighting_kitchen
        - switch.adaptive_lighting_owner_suite
        - switch.dining_room_adaptive_lighting_dining_room
        - switch.adaptive_control
      main_adaptive_switches: >-
        {% set ns = namespace(items=[]) %}
        {% for entity_id in candidate_main_adaptive_switches %}
          {% if states(entity_id) not in ['unknown', 'unavailable'] %}
            {% set ns.items = ns.items + [entity_id] %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}
    action:
      - if:
          - condition: trigger
            id: nightly-cycle
        then:
          - if:
              - condition: template
                value_template: "{{ main_adaptive_switches | count > 0 }}"
            then:
              - action: switch.turn_off
                target:
                  entity_id: "{{ main_adaptive_switches }}"
          - delay: "00:00:10"
      - if:
          - condition: template
            value_template: "{{ main_adaptive_switches | count > 0 }}"
        then:
          - action: switch.turn_on
            target:
              entity_id: "{{ main_adaptive_switches }}"

script:
  adaptive_light_turn_on:
    alias: Adaptive Light Turn On
    description: >
      Turn on Adaptive Lighting-managed lights with one atomic adaptive apply so
      brightness and color cannot arrive as competing Zigbee commands. Optional
      reset/ramp callers may lock manual control until their transition finishes;
      lights the user overrides mid-ramp retain that lock. Falls back to a plain
      light.turn_on when the Adaptive Lighting switch is unavailable so wall
      switches and motion paths keep working.
    mode: parallel
    max: 20
    trace:
      stored_traces: 10
    fields:
      adaptive_switch:
        description: Adaptive Lighting switch that owns the target light(s).
        required: true
        selector:
          entity:
            domain: switch
      lights:
        description: Optional list of lights to turn on. If omitted, the Adaptive Lighting switch applies to all configured lights.
        required: false
        selector:
          entity:
            domain: light
            multiple: true
      transition:
        description: Transition duration in seconds.
        required: false
        default: 1
        selector:
          number:
            min: 0
            max: 300
            step: 0.5
            unit_of_measurement: seconds
      reset_manual_control:
        description: Clear Adaptive Lighting manual-control state for the same lights after the transition completes.
        required: false
        default: false
        selector:
          boolean:
    variables:
      target_lights: "{{ lights | default([], true) }}"
      # expand() resolves Home Assistant light groups to their members so a
      # partially-on group still adapts its individual members; Z2M groups
      # expose no members and stay atomic, matching how Adaptive Lighting
      # treats them. unique dedupes overlapping group + member call sites.
      # Unavailable/unknown lights are handled by the fallback branch below.
      member_lights: "{{ expand(target_lights) | map(attribute='entity_id') | unique | list }}"
      off_lights: "{{ member_lights | select('is_state', 'off') | list }}"
      on_lights: "{{ member_lights | select('is_state', 'on') | list }}"
      # Targets that classify as neither off nor on (and group entities whose
      # members all dropped out of expand()): flapping Zigbee2MQTT devices,
      # entities still unknown after a restart. They get a best-effort plain
      # turn-on below so a recovering device still receives the command.
      unreachable_lights: "{{ (target_lights + member_lights) | unique | select('is_state', ['unavailable', 'unknown']) | list }}"
      apply_transition: "{{ transition | default(1, true) }}"
      should_reset_manual_control: "{{ reset_manual_control | default(false, true) }}"
      adaptive_switch_active: "{{ is_state(adaptive_switch, 'on') }}"
    sequence:
      # Reset/ramp callers need the manual-control lock. Owner-suite wake ramps
      # rely on this to keep interval adaptation from interrupting the long
      # transition.
      - if:
          - condition: template
            value_template: "{{ should_reset_manual_control and adaptive_switch_active and member_lights | count > 0 }}"
        then:
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: "{{ adaptive_switch }}"
              lights: "{{ member_lights }}"
              manual_control: true
      - choose:
          # Adaptive Lighting switch missing, not loaded, or intentionally
          # turned off: plain turn-on. Disabling a room's adaptive switch must
          # keep opting its paddles and motion paths out of adaptive
          # color/brightness, and a broken switch must not fail the run.
          - conditions:
              - condition: template
                value_template: "{{ not adaptive_switch_active and target_lights | count > 0 }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: "{{ target_lights }}"
                data:
                  transition: "{{ apply_transition }}"
          # No explicit lights: apply across the switch's configured lights.
          - conditions:
              - condition: template
                value_template: "{{ adaptive_switch_active and target_lights | count == 0 }}"
            sequence:
              - action: adaptive_lighting.apply
                data:
                  entity_id: "{{ adaptive_switch }}"
                  adapt_brightness: true
                  adapt_color: true
                  turn_on_lights: true
                  transition: "{{ apply_transition }}"
          # Apply brightness and color together in one service call. An empty
          # lights list must never reach apply — Adaptive Lighting treats it as
          # "all configured lights" — hence the explicit count guard;
          # unreachable-only targets are handled by the fallback step below.
          - conditions:
              - condition: template
                value_template: "{{ off_lights | count > 0 or on_lights | count > 0 }}"
            sequence:
              - action: adaptive_lighting.apply
                data:
                  entity_id: "{{ adaptive_switch }}"
                  lights: "{{ off_lights + on_lights }}"
                  adapt_brightness: true
                  adapt_color: true
                  turn_on_lights: true
                  transition: "{{ apply_transition }}"
      # Best-effort plain turn-on for unavailable/unknown targets, even when
      # other targets classified normally: Zigbee2MQTT still publishes the
      # command, so a flapping device that recovers picks it up. Skipped when
      # the adaptive switch is inactive because the first branch above already
      # sent every target a plain turn-on.
      - if:
          - condition: template
            value_template: "{{ adaptive_switch_active and unreachable_lights | count > 0 }}"
        then:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: "{{ unreachable_lights }}"
            data:
              transition: "{{ apply_transition }}"
      # Clear the manual-control marks the script set once the ramp has
      # finished. Clearing earlier would let set_manual_control force-adapt at
      # the switch's initial_transition and stomp the requested ramp. The wait
      # and clear run in a fire-and-forget helper so callers of this script are
      # not blocked for the ramp duration (the owner-suite wake ramp is 45 s
      # and its automation sets the auto-on flag right after this call).
      - variables:
          clear_candidates: >-
            {{ member_lights
               if should_reset_manual_control and adaptive_switch_active else [] }}
      - if:
          - condition: template
            value_template: "{{ clear_candidates | count > 0 }}"
        then:
          - action: script.turn_on
            target:
              entity_id: script.adaptive_light_clear_manual_control
            data:
              variables:
                adaptive_switch: "{{ adaptive_switch }}"
                clear_lights: "{{ clear_candidates }}"
                wait_seconds: "{{ apply_transition | float(0) }}"

  adaptive_light_clear_manual_control:
    alias: Adaptive Light Clear Manual Control
    description: >
      Deferred, guarded manual-control clear for script.adaptive_light_turn_on.
      Waits out the brightness ramp, then clears the Adaptive Lighting
      manual-control marks only for lights the user did not override mid-ramp.
      Invoked non-blocking via script.turn_on with the variables
      adaptive_switch, clear_lights, and wait_seconds.
    mode: parallel
    max: 20
    trace:
      stored_traces: 10
    sequence:
      - delay:
          seconds: "{{ wait_seconds | float(0) }}"
      # Only clear lights that are still on and still at the adaptive
      # brightness and color-temperature targets: a light the user turned
      # off, re-dimmed, or re-colored during the ramp keeps its
      # manual-control mark so the override survives (Adaptive Lighting
      # drops the mark itself on the next off). The color comparison clamps
      # the adaptive target to each bulb's supported range, so sleep-mode
      # targets below a bulb's minimum still match; a CT-capable light sitting
      # in an hs/rgb color mode reports no color_temp_kelvin and is treated as
      # overridden. The force-adapt that clearing triggers is a visual no-op
      # for lights that pass this guard because they already sit at the target.
      - variables:
          lights_to_clear: >-
            {% set target_brightness = (state_attr(adaptive_switch, 'brightness_pct') | float(-1)) * 2.55 %}
            {% set target_kelvin = state_attr(adaptive_switch, 'color_temp_kelvin') | int(0) %}
            {% set ns = namespace(items=[]) %}
            {% for light_id in clear_lights %}
              {% if is_state(light_id, 'on') %}
                {% set brightness = state_attr(light_id, 'brightness') %}
                {% set brightness_ok = brightness is none or target_brightness < 0
                      or (brightness | float - target_brightness) | abs <= 26 %}
                {% set modes = state_attr(light_id, 'supported_color_modes') or [] %}
                {% if 'color_temp' not in modes or target_kelvin <= 0 %}
                  {% set color_ok = true %}
                {% else %}
                  {% set light_kelvin = state_attr(light_id, 'color_temp_kelvin') %}
                  {% set min_kelvin = state_attr(light_id, 'min_color_temp_kelvin') | int(0) %}
                  {% set max_kelvin = state_attr(light_id, 'max_color_temp_kelvin') | int(0) %}
                  {% set floored = [target_kelvin, min_kelvin] | max %}
                  {% set expected_kelvin = [floored, max_kelvin] | min if max_kelvin > 0 else floored %}
                  {% set color_ok = light_kelvin is not none
                        and (light_kelvin | int - expected_kelvin) | abs <= 150 %}
                {% endif %}
                {% if brightness_ok and color_ok %}
                  {% set ns.items = ns.items + [light_id] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.items }}
      - if:
          - condition: template
            value_template: "{{ lights_to_clear | count > 0 }}"
        then:
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: "{{ adaptive_switch }}"
              lights: "{{ lights_to_clear }}"
              manual_control: false

switch:
  - platform: group
    name: Adaptive Control
    entities:
      - switch.adaptive_lighting_basement
      - switch.adaptive_lighting_den
      - switch.adaptive_lighting_hallway
      - switch.adaptive_lighting_kitchen
      - switch.adaptive_lighting_owner_suite
      - switch.adaptive_lighting_owner_suite_vanity
      - switch.adaptive_lighting_laundry_room
      - switch.dining_room_adaptive_lighting_dining_room
