################################################################
## Packages / Curling
################################################################

################################################
## Customize
################################################

homeassistant:
  customize:
    ################################################
    ## Node Anchors
    ################################################

    package.node_anchors:
      customize: &customize
        package: 'curling'

      expose: &expose
        <<: *customize
        haaska_hidden: false
        homebridge_hidden: false

    ################################################
    ## Automation
    ################################################

    automation.leave_home_for_curling:
      <<: *customize
      friendly_name: "Leave home for curling"
      icon: mdi:curling

    automation.return_home_from_OCC:
      <<: *customize
      friendly_name: "Return home from OCC"
      icon: mdi:curling

    automation.return_home_from_example_zone_08:
      <<: *customize
      friendly_name: "Return home from SPCC"
      icon: mdi:curling

    automation.display_curling_tab:
      <<: *customize
      friendly_name: "Display Curling tab"
      icon: mdi:curling

    automation.toggle_curling_automations_on_season_change:
      <<: *customize
      friendly_name: "Toggle Curling season automations"
      icon: mdi:curling

    automation.toggle_curling_tab:
      <<: *customize
      friendly_name: "Toggle Curling tab"
      icon: mdi:curling
      
    ################################################
    ## Binary Sensor
    ################################################

    binary_sensor.curling_season:
      <<: *customize
      friendly_name: "Curling Season"
      icon: mdi:calendar

    binary_sensor.away_from_curling:
      <<: *customize
      friendly_name: "Leaving Curling"
      icon: mdi:curling

    binary_sensor.test_home:
      <<: *customize
      friendly_name: "Test for heading home from curling"
      icon: mdi:curling

    ################################################
    ## Group
    ################################################

    group.curling_sensors:
      <<: *customize
      friendly_name: "Curling Sensors"

    group.curling_automations:
      <<: *customize
      friendly_name: "Curling Automations"

    ################################################
    ## Scripts
    ################################################
    script.toggle_curling_automation_on_curling_season:
      <<: *customize
      friendly_name: "Toggle Curling Automation Based on Boolean Sensor"

    ################################################
    ## Sensors
    ################################################

    sensor.example_zone_05_time:
      <<: *customize
      friendly_name: "Last change in OCC Dir"
      icon_template: mdi:clock

    sensor.example_zone_08_time:
      <<: *customize
      friendly_name: "Last Change in SPCC Dir"
      icon_template: mdi:clock

    sensor.example_zone_08_distance:
      <<: *customize
      friendly_name: "Distance to SPCC"
      icon: mdi:curling

    sensor.heading_example_zone_08:
      <<: *customize
      friendly_name: "Direction of SPCC"
      icon: mdi:curling

    sensor.heading_example_zone_05:
      <<: *customize
      friendly_name: "Direction of OCC"
      icon: mdi:curling

########################
# Automations
########################
automation:
  - id: leave_home_for_curling
    alias: leave_home_for_curling
    trigger:
    - entity_id: binary_sensor.bayesian_resident_home
      from: 'on'
      platform: state
      to: 'off'
    condition:
      condition: and
      conditions:
        - condition: time
          after: '17:00:00'
          before: '19:45:00'
          weekday:
          - tue
          - wed
        - condition: state
          entity_id: input_boolean.guest_mode
          state: 'off'
    action:
    - data:
        away_mode: true
        entity_id: all
      service: climate.set_away_mode
    - data:
        message: Good Curling!
      service: notify.all

  - id: return_home_from_example_zone_05
    alias: return_home_from_example_zone_05
    trigger:
      # - platform: state
      #   entity_id: device_tracker.bayesian_resident_home
      #   from: 'Example Zone 05'
      - platform: zone
        entity_id: device_tracker.bayesian_resident_home
        zone: zone.example_zone_05
        event: leave
    condition:
      condition: time
      weekday:
      - sun
      - mon
      - tue
    action:
    # - service: nest.set_eta
    #   data_template:
    #     eta: '{{states.sensor.time_to_home.state}}'
    #     trip_id: "{{ states.input_select.trip_origin.state }}"
    - service: climate.set_away_mode
      data:
        away_mode: 'off'
        entity_id: all
    - service: notify.all
      data_template:
        message: >-
          Sent ETA of {{ states.sensor.time_to_home.state }} to Nest, driving home from OCC

  - id: return_home_from_example_zone_08
    alias: return_home_from_example_zone_08
    trigger:
      - platform: zone
        entity_id: device_tracker.bayesian_resident_home
        zone: zone.example_zone_08
        event: leave
      # - platform: state
      #   entity_id: device_tracker.bayesian_resident_home
      #   from: "Example Zone 08"
      #   to: "Example Zone 10"
    condition:
      condition: time
      weekday:
      - sun
      - wed
      - thu
    action:
    # - service: nest.set_eta
    #   data_template:
    #     eta: '{{states.sensor.time_to_home.state}}'
    #     trip_id: "{{ states.input_select.trip_origin.state }}"
    - service: climate.set_away_mode
      data:
        away_mode: 'off'
        entity_id: all
    - service: notify.all
      data_template:
        message: >-
          Sent ETA of {{ states.sensor.time_to_home.state }} to Nest, driving home from SPCC

  - id: toggle_curling_automations_on_season_change
    alias: toggle_curling_automations_on_season_change
    trigger:
    - platform: state
      entity_id: binary_sensor.curling_season
    - platform: homeassistant
      event: start
    action:
    - service: script.toggle_curling_automation_on_curling_season
      data:
        entity_id: automation.return_home_from_OCC
    - service: script.toggle_curling_automation_on_curling_season
      data:
        entity_id: automation.leave_home_for_curling
    - service: script.toggle_curling_automation_on_curling_season
      data:
        entity_id: automation.return_home_from_example_zone_08

  - id: toggle_curling_tab
    alias: toggle_curling_tab
    trigger:
    - platform: state
      entity_id: binary_sensor.curling_season
    - platform: homeassistant
      event: start
    condition: []
    action:
    - delay: '00:00:{{ (range(1,60)|random|int) }}'
    - service: script.toggle_view
      data_template:
        view_id: curling
        visible: >-
          {{ is_state("binary_sensor.curling_season", 'on') | lower }}

########################
# Binary Sensors
########################
binary_sensor:
  - platform: template
    sensors:
      curling_season:
        entity_id: sensor.time
        value_template: >-
          {{ now().strftime("%m") |int in [1,2,3,4,10,11,12] }}
      away_from_curling:
        value_template: >
          {% if
            (((as_timestamp(now()) - as_timestamp(states.sensor.example_zone_10.last_changed))//60) > 10) and (states.sensor.example_zone_10.state=="away_from")
            or
            (((as_timestamp(now()) - as_timestamp(states.sensor.heading_example_zone_05.last_changed))//60) > 5) and (states.sensor.heading_example_zone_05.state=="away_from")
          %} true
          {% else %}
            false
          {% endif %}
        entity_id: sensor.time
        device_class: moving
      test_home:
        value_template: >
          {% if
            (((as_timestamp(now()) - as_timestamp(states.sensor.heading_example_zone_08.last_changed)) > 1200) and states.sensor.heading_example_zone_08.state=="away_from")
            or
            (((as_timestamp(now()) - as_timestamp(states.sensor.heading_example_zone_05.last_changed)) > 600) and states.sensor.heading_example_zone_05.state=="away_from")
          %} true
          {% else %}
            false
          {% endif %}

########################
# Groups
########################
group:
  curling_sensors:
    entities:
      - binary_sensor.curling_season
      - sensor.example_zone_05_time
      - sensor.heading_example_zone_05
      - sensor.example_zone_08_time
      - sensor.example_zone_08_distance
      - sensor.heading_example_zone_08
      - binary_sensor.away_from_curling
      - binary_sensor.test_home
  curling_automations:
    entities:
      - automation.leave_home_for_curling
      - automation.return_home_from_example_zone_05
      - automation.return_home_from_example_zone_08

########################
# Scripts
########################
script:
  toggle_curling_automation_on_curling_season:
    sequence:
      - service_template: >-
          {% if is_state("binary_sensor.curling_season", 'on') %}
            automation.turn_on
          {% else %}
            automation.turn_off
          {% endif %}
        data_template:
          entity_id: "{{ entity_id }}"

########################
# Sensors
########################
sensor:
  - platform: template
    sensors:
      example_zone_05_time:
        value_template: '{{ (as_timestamp(now()) - as_timestamp(states.sensor.heading_example_zone_05.last_changed)) | int //60 }}'
        entity_id: sensor.time
        unit_of_measurement: 'minutes'
      example_zone_08_time:
        value_template: '{{ (as_timestamp(now()) - as_timestamp(states.sensor.heading_example_zone_08.last_changed)) | int //60 }}'
        entity_id: sensor.time
        unit_of_measurement: 'minutes'
      example_zone_08_distance:
        value_template: '{{ states.proximity.example_zone_08.state }}'
        entity_id: sensor.time
        unit_of_measurement: 'mi'
      heading_example_zone_08:
        value_template: '{{ states.proximity.example_zone_08.attributes.dir_of_travel |default("unknown") }}'
      heading_example_zone_05:
        value_template: '{{ states.proximity.example_zone_05.attributes.dir_of_travel |default("unknown") }}'
