########################
# Sensor
########################
sensor:
  - platform: filter
    # Consumes the normalized-to-mm template sensor (below in the `template:`
    # section) rather than the raw ESPHome entity directly. The raw entity's
    # unit_of_measurement depends on HA's unit-system settings (a live
    # registry setting, not version-controlled), so every mm-scaled
    # threshold in this file would silently misinterpret its value if HA's
    # unit system ever reports it in `in` (as observed after the
    # VL53L0X -> VL53L1X hardware migration re-registered this entity).
    entity_id: sensor.water_softener_distance_normalized_mm
    name: "Water Softener Salt Level"
    filters:
      # No HA-side `outlier` filter here (deliberately -- see git history
      # for the version that had one): HA's outlier filter only expands its
      # comparison window with values it *accepts*, so a genuine step
      # change bigger than its radius -- exactly what a real salt refill
      # produces -- gets permanently rejected forever afterward, since
      # every subsequent (correct) reading keeps comparing against the
      # same stale pre-refill window. That would silently break refill
      # detection, the whole point of this sensor. Spike rejection lives
      # entirely in the firmware-side median filter instead (see
      # esphome/watersoftener.yaml), which has no such lockout: it just
      # recomputes over the latest raw samples every cycle, so it reflects
      # a real step change (like a refill) within seconds rather than
      # never (caught in review).
      #
      # No lowpass either. HA's lowpass is per state update (weight
      # 1/time_constant, no time term), so its effective time constant is
      # time_constant x the publish interval and silently changes whenever the
      # firmware cadence does: time_constant 120 was ~1.7h at the old ~50s
      # cadence and would be ~10h at a 5-minute cadence. Replaying the recorded
      # 2026-09/10 data showed it added ~1.6h of lag on top of the 6h average
      # while the average alone already cuts the ~1 mm per-sample noise to
      # ~0.01 mm -- far below the ~0.25 mm real daily wobble.
      #
      # The time-weighted 6h average is independent of publish cadence, and the
      # filter platform re-primes it from the recorder at startup.
      - filter: time_simple_moving_average
        window_size: "6:00"
        precision: 3

  # Restart-safe depletion rate, replacing four `derivative` sensors.
  #
  # Why: a derivative sensor keeps its window only in memory and divides by the
  # full window, so every HA restart (19 between 2026-09-15 and 2026-10-10)
  # silently under-reported the 7d rate for up to a week; a replay of the
  # recorded data with those restarts reproduces the recorded values exactly.
  # `statistics` reloads its buffer from the recorder at startup.
  #
  # Why a median of 24h changes rather than one long-window slope: a single
  # step (the 2026-09-16 refill, or the +20 mm slump on 2026-09-20) poisons a
  # 7d/14d endpoint slope for the whole window, but only one day of 24h-change
  # samples, which the 14-day median ignores. 24h differences also cancel the
  # ~0.25 mm daily wobble. On the recorded data this cut the day-to-day swing of
  # the days-until-low forecast from ~94 days to ~12 days.
  - platform: statistics
    name: Water Softener Level Change 24h
    unique_id: water_softener_level_change_24h
    entity_id: sensor.water_softener_salt_level
    state_characteristic: change
    max_age:
      hours: 24
    # salt_level updates a few hundred times a day; keep well above a day's worth.
    sampling_size: 5000
    precision: 3

  - platform: statistics
    name: Water Softener Level Change 24h Median 14d
    unique_id: water_softener_level_change_24h_median_14d
    entity_id: sensor.water_softener_level_change_24h
    state_characteristic: median
    max_age:
      days: 14
    sampling_size: 20000
    precision: 3

########################
# Template
########################
template:
  - sensor:
      - name: Water Softener Distance Normalized MM
        unique_id: water_softener_distance_normalized_mm
        icon: mdi:ruler
        # Deliberately NOT device_class: distance. HA's unit-system
        # conversion is keyed off device_class, not unit_of_measurement --
        # declaring "distance" here would make HA treat this sensor's own
        # native unit as convertible and silently re-convert its mm state
        # back to inches under an imperial unit system, reintroducing the
        # exact bug this sensor exists to fix one level downstream (caught
        # in review of the first version of this normalization sensor).
        state_class: measurement
        unit_of_measurement: "mm"
        # Normalizes the raw ESPHome VL53L1X entity to true millimeters
        # regardless of HA's unit-system display setting, so the
        # low-salt/refill thresholds elsewhere in this file (which are bare
        # numbers, not unit-aware) always compare like-for-like. Fixes the
        # entity reporting in `in` after the VL53L0X -> VL53L1X hardware
        # migration re-registered it without the old entity's manual mm
        # unit override. Kept at 0.1 mm resolution: the firmware publishes
        # 5-minute averages, which carry sub-millimetre information that whole-mm
        # rounding would throw away.
        availability: >-
          {{ states('sensor.watersoftener_my_water_softener_vl53l1x_sensor')
             not in ['unknown', 'unavailable'] }}
        state: >-
          {% set src = 'sensor.watersoftener_my_water_softener_vl53l1x_sensor' %}
          {% set value = states(src) | float(default=none) %}
          {% set unit = state_attr(src, 'unit_of_measurement') %}
          {% if value is none %}
            {{ none }}
          {% elif unit == 'mm' or unit is none %}
            {{ value | round(1) }}
          {% elif unit == 'cm' %}
            {{ (value * 10) | round(1) }}
          {% elif unit == 'm' %}
            {{ (value * 1000) | round(1) }}
          {% elif unit == 'in' %}
            {{ (value * 25.4) | round(1) }}
          {% elif unit == 'ft' %}
            {{ (value * 304.8) | round(1) }}
          {% else %}
            {{ none }}
          {% endif %}

      # Gate the restart-safe 14-day median of 24h changes on the depletion
      # floor: flat or negative rates (settling right after a refill, or an
      # idle softener) have no meaningful days-until-low projection. The
      # float(default=...) fallback only applies while the input_number is
      # transiently unknown/unavailable (e.g. HA startup before helpers load);
      # keep it in sync with that input_number's calibrated value (currently
      # 0.2), the same class of bug caught in review for the low-salt
      # threshold's fallbacks.
      - name: Water Softener Forecast Rate
        unique_id: water_softener_forecast_rate
        icon: mdi:chart-line
        state_class: measurement
        unit_of_measurement: mm/d
        availability: >-
          {% set minimum_rate = states('input_number.water_softener_minimum_depletion_rate_mm_per_day') | float(default=0.2) %}
          {% set rate = states('sensor.water_softener_level_change_24h_median_14d') | float(default=none) %}
          {{ rate is not none and rate > minimum_rate }}
        state: >-
          {{ states('sensor.water_softener_level_change_24h_median_14d') | float(default=0) | round(3) }}
      # The float(default=...) fallbacks below only apply while
      # input_number.water_softener_low_salt_threshold_mm is transiently
      # unknown/unavailable (e.g. during HA startup before helpers load).
      # Keep them in sync with that input_number's calibrated value
      # (currently 380mm) -- a stale fallback here would silently mask a
      # real low-salt state during that window (caught in review).
      - name: Water Softener Days Until Low Salt
        unique_id: water_softener_days_until_low_salt
        icon: mdi:calendar-clock
        state_class: measurement
        unit_of_measurement: d
        availability: >-
          {% set threshold = states('input_number.water_softener_low_salt_threshold_mm') | float(default=380) %}
          {% set level = states('sensor.water_softener_salt_level') | float(default=none) %}
          {% set rate = states('sensor.water_softener_forecast_rate') | float(default=none) %}
          {{ level is not none and (level >= threshold or (rate is not none and rate > 0)) }}
        state: >-
          {% set threshold = states('input_number.water_softener_low_salt_threshold_mm') | float(default=380) %}
          {% set level = states('sensor.water_softener_salt_level') | float(default=none) %}
          {% set rate = states('sensor.water_softener_forecast_rate') | float(default=none) %}
          {% if level is none %}
            {{ none }}
          {% elif level >= threshold %}
            0
          {% elif rate is none or rate <= 0 %}
            {{ none }}
          {% else %}
            {{ ((threshold - level) / rate) | round(1) }}
          {% endif %}
      - name: Water Softener Forecast Low Salt At
        unique_id: water_softener_forecast_low_salt_at
        icon: mdi:calendar-alert
        device_class: timestamp
        # Anchored to when the days-until value was computed, not now(): a
        # now()-based template re-renders every minute, so the projected date
        # crept forward one minute per minute between forecast updates and
        # wrote ~600 recorder rows a day.
        availability: >-
          {{ states('sensor.water_softener_days_until_low_salt') | float(default=none) is not none }}
        state: >-
          {% set days = states('sensor.water_softener_days_until_low_salt') | float(default=none) %}
          {% set computed_at = states.sensor.water_softener_days_until_low_salt.last_changed %}
          {{ (computed_at + timedelta(days=days)).isoformat() }}
      # Same float(default=...) note as Water Softener Days Until Low Salt
      # above -- keep in sync with the calibrated threshold (currently
      # 380mm).
      - name: Water Softener Forecast Status
        unique_id: water_softener_forecast_status
        icon: mdi:shaker-outline
        availability: >-
          {{ states('sensor.water_softener_salt_level') | float(default=none) is not none }}
        state: >-
          {% set threshold = states('input_number.water_softener_low_salt_threshold_mm') | float(default=380) %}
          {% set reminder_days = states('input_number.water_softener_refill_reminder_days') | float(default=14) %}
          {% set level = states('sensor.water_softener_salt_level') | float(default=none) %}
          {% set days = states('sensor.water_softener_days_until_low_salt') | float(default=none) %}
          {% if level is none %}
            unknown
          {% elif level >= threshold %}
            low_now
          {% elif days is not none and days > 0 and days <= reminder_days %}
            refill_soon
          {% elif days is not none %}
            ok
          {% else %}
            trend_unknown
          {% endif %}

