########################
# Alarm Panel
########################
alarm_control_panel: []

########################
## Automation
########################
automation:
  - id: notify_refill_salt
    alias: Notify Salt Low
    trace:
      stored_traces: 10
    trigger:
      - trigger: time
        at: "16:00:00"
    condition:
      - alias: "Salt Level Low"
        condition: numeric_state
        entity_id: sensor.water_softener_salt_level
        above: input_number.water_softener_low_salt_threshold_mm
    action:
      - alias: "Notify"
        action: notify.all
        data:
          title: Salt level low
          data:
            url: "/ryan-new-mushroom/cleaning-v2"
          message: >-
            Water softener salt is low at {{states('sensor.water_softener_salt_level')}} mm.

  - id: water_softener_forecast_refill_reminder
    alias: Water Softener Forecast Refill Reminder
    mode: restart
    trace:
      stored_traces: 10
    trigger:
      - trigger: state
        id: forecast_changed
        entity_id: sensor.water_softener_days_until_low_salt
      - trigger: time_pattern
        id: hourly_recheck
        minutes: "15"
      - trigger: homeassistant
        id: forecast_startup_recheck
        event: start
    action:
      - choose:
          - alias: "Track stable forecasts and notify once per refill cycle"
            conditions:
              - condition: numeric_state
                entity_id: sensor.water_softener_days_until_low_salt
                above: 0
                below: input_number.water_softener_refill_reminder_days
              - condition: numeric_state
                entity_id: sensor.water_softener_salt_level
                below: input_number.water_softener_low_salt_threshold_mm
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('input_datetime.water_softener_forecast_window_entered_at') | as_timestamp(default=0) <= 0 }}
                then:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.water_softener_forecast_window_entered_at
                    data:
                      timestamp: "{{ as_timestamp(now()) }}"
              - if:
                  - alias: "Reminder not already sent this refill cycle"
                    condition: state
                    entity_id: input_boolean.water_softener_refill_reminder_sent
                    state: "off"
                  - alias: "Forecast has stayed inside the reminder window for six hours"
                    condition: template
                    value_template: >-
                      {% set entered_at = states('input_datetime.water_softener_forecast_window_entered_at') | as_timestamp(default=0) %}
                      {{ entered_at > 0 and as_timestamp(now()) - entered_at >= 6 * 60 * 60 }}
                then:
                  - alias: "Mark reminder sent"
                    action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.water_softener_refill_reminder_sent
                  - alias: "Notify before salt is critical"
                    action: notify.all
                    data:
                      title: Softener salt forecast low
                      data:
                        url: "/ryan-new-mushroom/cleaning-v2"
                        tag: water-softener-forecast-low
                      message: >-
                        Water softener salt is forecast to reach the low threshold in
                        {{ states('sensor.water_softener_days_until_low_salt') }} days.
                        Current level is {{ states('sensor.water_softener_salt_level') }} mm
                        and there are {{ states('input_number.bags_of_salt_at_home') | int(default=0) }} bags at home.
          - alias: "Clear the forecast timer only after a known reading leaves the window"
            conditions:
              - condition: template
                value_template: >-
                  {% set days = states('sensor.water_softener_days_until_low_salt') | float(default=none) %}
                  {% set reminder_days = states('input_number.water_softener_refill_reminder_days') | float(default=none) %}
                  {{ days is not none and reminder_days is not none and not (0 < days < reminder_days) }}
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.water_softener_forecast_window_entered_at
                data:
                  timestamp: 0

  - id: water_softener_refill_reminder_reset
    alias: Water Softener Refill Reminder Reset
    mode: restart
    trace:
      stored_traces: 10
    trigger:
      # Fire on threshold crossings, not on every salt_level update. salt_level
      # changes hundreds of times a day and every run wrote an automation state
      # row + trace (47k rows between 2026-09-01 and 2026-10-10), while only a
      # crossing can change what this automation does. The hourly recheck still
      # drives the six-hour stability confirmation and the startup trigger
      # re-evaluates after restarts, so behaviour is unchanged. A crossing re-fired
      # by an unavailable blip is harmless: the window start is only written when
      # it is unset.
      - trigger: numeric_state
        id: salt_level_below_reset_threshold
        entity_id: sensor.water_softener_salt_level
        below: input_number.water_softener_refill_reset_threshold_mm
      - trigger: numeric_state
        id: salt_level_above_reset_threshold
        entity_id: sensor.water_softener_salt_level
        above: input_number.water_softener_refill_reset_threshold_mm
      - trigger: time_pattern
        id: hourly_recheck
        minutes: "45"
      - trigger: homeassistant
        id: refill_startup_recheck
        event: start
    action:
      - choose:
          - alias: "Track a stable refill and allow the next reminder cycle"
            conditions:
              - condition: numeric_state
                entity_id: sensor.water_softener_salt_level
                below: input_number.water_softener_refill_reset_threshold_mm
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('input_datetime.water_softener_refill_window_entered_at') | as_timestamp(default=0) <= 0 }}
                then:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.water_softener_refill_window_entered_at
                    data:
                      timestamp: "{{ as_timestamp(now()) }}"
              - if:
                  - alias: "Refill level has stayed stable for six hours"
                    condition: template
                    value_template: >-
                      {% set entered_at = states('input_datetime.water_softener_refill_window_entered_at') | as_timestamp(default=0) %}
                      {{ entered_at > 0 and as_timestamp(now()) - entered_at >= 6 * 60 * 60 }}
                then:
                  - if:
                      - alias: "Reminder has been sent"
                        condition: state
                        entity_id: input_boolean.water_softener_refill_reminder_sent
                        state: "on"
                    then:
                      - alias: "Allow next refill-cycle reminder"
                        action: input_boolean.turn_off
                        target:
                          entity_id: input_boolean.water_softener_refill_reminder_sent
                  - if:
                      - alias: "Stable refill has not already been recorded"
                        condition: template
                        value_template: >-
                          {% set entered_at = states('input_datetime.water_softener_refill_window_entered_at') | as_timestamp(default=0) %}
                          {% set last_refill_at = states('input_datetime.water_softener_last_refill_at') | as_timestamp(default=0) %}
                          {{ entered_at > last_refill_at }}
                    then:
                      - alias: "Record the stable refill"
                        action: input_datetime.set_datetime
                        target:
                          entity_id: input_datetime.water_softener_last_refill_at
                        data:
                          timestamp: >-
                            {{ states('input_datetime.water_softener_refill_window_entered_at') | as_timestamp(default=0) }}
          - alias: "Clear the refill timer only after a known reading leaves the window"
            conditions:
              - condition: template
                value_template: >-
                  {% set level = states('sensor.water_softener_salt_level') | float(default=none) %}
                  {% set reset_threshold = states('input_number.water_softener_refill_reset_threshold_mm') | float(default=none) %}
                  {{ level is not none and reset_threshold is not none and level >= reset_threshold }}
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.water_softener_refill_window_entered_at
                data:
                  timestamp: 0

  - id: buy_more_salt
    alias: buy_more_salt
    description: >-
      Prompt for a bag count when we are standing in a DIY store with the salt
      inventory low. Detection lives in sensor.diy_store_current (see
      packages/zone.yaml), whose state is which store we are at, because exact
      place-name matching missed real OSM names and parking-lot geocodes.

      There is deliberately no arrive-home backstop here, unlike the air-filter
      prompt in climate.yaml: two restock questions on a single arrival is worse
      than one missed bag of salt.
    mode: single
    max_exceeded: silent
    trace:
      stored_traces: 10
    trigger:
      - trigger: state
        id: at_diy_store
        entity_id: sensor.diy_store_current
    condition:
      - alias: "Salt Bag Inventory Low"
        condition: numeric_state
        entity_id: input_number.bags_of_salt_at_home
        below: 2
      - alias: "Store path only on a genuinely new store"
        condition: template
        value_template: >-
          {{ trigger.id != 'at_diy_store'
             or (trigger.to_state.state not in ['none', 'unknown', 'unavailable']
                 and trigger.to_state.state != trigger.from_state.state) }}
    action:
      - action: notify.mobile_app_wethop
        data:
          title: "Buy Softener Salt"
          message: >-
            "You only have {{states("input_number.bags_of_salt_at_home")| int}} salt bags at home. How many did you buy?"
          data:
            actions:
              - action: "BOUGHT_SALT"
                title: "Purchased salt"
                activationMode: background
                authenticationRequired: false
                destructive: false
                behavior: textInput
                textInputButtonTitle: Number of bags
                textInputPlaceholder: 3
                icon: sfsymbols:bag.badge.questionmark

  - id: salt_purchased
    alias: salt_purchased
    trace:
      stored_traces: 10
    trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: BOUGHT_SALT
    condition: []
    action:
      - variables:
          current_bags: >-
            {{ states("input_number.bags_of_salt_at_home") | int(default=0) }}
          purchased_text: >-
            {{ trigger.event.data.reply_text | default("", true) | trim }}
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ purchased_text | regex_match('^\d+$') }}
            sequence:
              - alias: Increase Number of salt bags in inventory
                action: input_number.set_value
                entity_id: input_number.bags_of_salt_at_home
                data:
                  value: >-
                    {{ current_bags + (purchased_text | int(default=0)) }}

  - id: temp_notify_place_name
    alias: temp_notify_place_name
    trace:
      stored_traces: 10
    trigger:
      - trigger: state
        enabled: false
        entity_id: sensor.zeke_place_place_name
        to:
    condition: []
    action:
      - alias: "Notify"
        action: notify.mobile_app_wethop
        data:
          message: >-
            At place_name: {{ states("sensor.zeke_place_place_name") }},
            of category: {{ states("sensor.zeke_place_place_category") }}

