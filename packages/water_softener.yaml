input_datetime:
  water_softener_forecast_window_entered_at:
    name: Water Softener Forecast Window Entered At
    has_date: true
    has_time: true
  water_softener_refill_window_entered_at:
    name: Water Softener Refill Window Entered At
    has_date: true
    has_time: true
  water_softener_last_refill_at:
    name: Water Softener Last Refill At
    has_date: true
    has_time: true

########################
# Input Numbers
########################
input_number:
  bags_of_salt_at_home:
    name: Bags of Softener Salt at Home
    icon: mdi:shaker-outline
    min: 0
    max: 20
    mode: box
    step: 1
  water_softener_low_salt_threshold_mm:
    name: Water Softener Low Salt Threshold
    icon: mdi:arrow-collapse-down
    min: 200
    max: 800
    mode: box
    step: 10
    unit_of_measurement: mm
    # Calibrated against the real sensor: confirmed empty (visually
    # verified brine with no salt pile at install, then reconfirmed via a
    # stable overnight baseline of ~451-452mm, stdev ~1.1-1.3mm) before a
    # 2026-09-16 refill. The prior default of 500 was never reachable on
    # this tank's actual mounting geometry -- above: 500 could never fire,
    # so the low-salt alert was silently dead from install. 440 sits ~10mm
    # below the confirmed-empty baseline as margin against residual
    # sensor jitter, so a single noisy sample at the once-daily 16:00
    # check can't skip a real low-salt day.
    #
    # NOTE: this `initial:` only seeds a brand-new helper -- it does NOT
    # retroactively update the live entity in an existing HA install. The
    # live value was set directly via input_number.set_value when this
    # was calibrated; keep this YAML value in sync with the live one if
    # it's ever recalibrated again (e.g. after seeing real full-tank
    # numbers), so a fresh deploy doesn't regress to a stale default.
    initial: 440
  water_softener_refill_reset_threshold_mm:
    name: Water Softener Refill Reset Threshold
    icon: mdi:arrow-expand-up
    min: 100
    max: 600
    mode: box
    step: 10
    unit_of_measurement: mm
    # Calibrated against the real sensor: a 2026-09-16 refill (4 bags)
    # brought the raw reading down from the confirmed-empty baseline
    # (~451mm, see water_softener_low_salt_threshold_mm's comment) to a
    # stable ~170-174mm within ~5 minutes of pouring, holding flat there
    # afterward -- no further settling observed. 300mm sits with generous
    # margin on both sides: ~150mm below the empty baseline (so normal
    # depletion or sensor jitter near-empty can never misfire this), and
    # ~128mm above today's specific fill level (so a lighter future
    # refill -- fewer bags, less full -- still gets correctly detected
    # rather than requiring this exact fill level again).
    #
    # NOTE: this `initial:` only seeds a brand-new helper -- it does NOT
    # retroactively update the live entity in an existing HA install (see
    # the matching note on water_softener_low_salt_threshold_mm).
    initial: 300
  water_softener_refill_reminder_days:
    name: Water Softener Refill Reminder Days
    icon: mdi:calendar-alert
    min: 1
    max: 45
    mode: box
    step: 1
    unit_of_measurement: d
    initial: 14
  water_softener_minimum_depletion_rate_mm_per_day:
    name: Water Softener Minimum Depletion Rate
    icon: mdi:speedometer-slow
    min: 0.1
    max: 25
    mode: box
    step: 0.1
    unit_of_measurement: mm/d
    initial: 0.5

