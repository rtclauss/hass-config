########################
input_datetime:
  water_softener_forecast_window_entered_at:
    name: Water Softener Forecast Window Entered At
    has_date: true
    has_time: true
  water_softener_refill_window_entered_at:
    name: Water Softener Refill Window Entered At
    has_date: true
    has_time: true
  water_softener_last_refill_at:
    name: Water Softener Last Refill At
    has_date: true
    has_time: true

########################
# Input Numbers
########################
input_number:
  bags_of_salt_at_home:
    name: Bags of Softener Salt at Home
    icon: mdi:shaker-outline
    min: 0
    max: 20
    mode: box
    step: 1
  water_softener_low_salt_threshold_mm:
    name: Water Softener Low Salt Threshold
    icon: mdi:arrow-collapse-down
    min: 200
    max: 800
    mode: box
    step: 10
    unit_of_measurement: mm
    # Calibrated as 75% depleted between the two real measured baselines
    # for this sensor: confirmed-just-refilled (~172mm, the 2026-09-16
    # refill) and confirmed-empty (~451mm, visually verified brine with no
    # salt pile at install, reconfirmed via a stable overnight baseline
    # stdev ~1.1-1.3mm). 172 + 0.75*(451-172) ~= 381, rounded to the
    # step:10 grid -> 380.
    #
    # This replaces an earlier 440 calibration (~10mm short of bare
    # water) that made "low salt" mean "almost completely out," with the
    # only lead time coming from the separate
    # water_softener_refill_reminder_days forecast window (14 days) --
    # too little buffer relative to how slowly this tank actually
    # depletes (well under 1mm/day once real multi-window data settled).
    # 380 gives a meaningfully earlier, percentage-anchored trigger
    # instead of forecasting all the way to bare water.
    #
    # NOTE: this `initial:` only seeds a brand-new helper -- it does NOT
    # retroactively update the live entity in an existing HA install. The
    # live value was set directly via input_number.set_value when this
    # was calibrated; keep this YAML value in sync with the live one if
    # it's ever recalibrated again, so a fresh deploy doesn't regress to
    # a stale default.
    initial: 380
  water_softener_refill_reset_threshold_mm:
    name: Water Softener Refill Reset Threshold
    icon: mdi:arrow-expand-up
    min: 100
    max: 600
    mode: box
    step: 10
    unit_of_measurement: mm
    # Calibrated against the real sensor: a 2026-09-16 refill (4 bags)
    # brought the raw reading down from the confirmed-empty baseline
    # (~451mm, see water_softener_low_salt_threshold_mm's comment) to a
    # stable ~170-174mm within ~5 minutes of pouring, holding flat there
    # afterward -- no further settling observed. 300mm sits with generous
    # margin on both sides: ~150mm below the empty baseline (so normal
    # depletion or sensor jitter near-empty can never misfire this), and
    # ~128mm above today's specific fill level (so a lighter future
    # refill -- fewer bags, less full -- still gets correctly detected
    # rather than requiring this exact fill level again).
    #
    # NOTE: this `initial:` only seeds a brand-new helper -- it does NOT
    # retroactively update the live entity in an existing HA install (see
    # the matching note on water_softener_low_salt_threshold_mm).
    initial: 300
  water_softener_refill_reminder_days:
    name: Water Softener Refill Reminder Days
    icon: mdi:calendar-alert
    min: 1
    max: 45
    mode: box
    step: 1
    unit_of_measurement: d
    initial: 14
  water_softener_minimum_depletion_rate_mm_per_day:
    name: Water Softener Minimum Depletion Rate
    icon: mdi:speedometer-slow
    min: 0.1
    max: 25
    mode: box
    step: 0.1
    unit_of_measurement: mm/d
    # Calibrated against real post-2026-09-16-refill data. The original 0.5
    # default was picked as a generic noise floor before any real depletion
    # data existed; the recorded steady rate turned out to be ~0.4-0.5
    # mm/day, right at that floor. 0.2 sits comfortably above the
    # pure-settling noise observed right after a refill (which ran negative,
    # -0.05 to -0.32mm/day, from the fresh pile still compacting) while
    # admitting genuinely slow-but-real depletion. (The 0.448 mm/day 7-day
    # reading that first prompted the change was itself depressed by the old
    # derivative sensors' restart amnesia; the floor holds on its own merits.)
    #
    # NOTE: this `initial:` only seeds a brand-new helper -- it does NOT
    # retroactively update the live entity in an existing HA install. The
    # live value was set directly via input_number.set_value when this was
    # calibrated.
    initial: 0.2

