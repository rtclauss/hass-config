# Owner-suite sleep-session analytics for issue #373.
#
# This observes the existing CPAP power and aggregate bed-presence signals. It
# does not alter the Allium-governed goodnight or wake-up routines. The score is
# a local continuity heuristic for trend review, not a medical sleep-quality or
# CPAP-adherence measurement.

input_boolean:
  sleep_session_active:
    name: Sleep session active
    icon: mdi:sleep

  sleep_session_bed_entry_pending:
    name: Sleep session bed entry pending
    icon: mdi:bed-clock

  sleep_session_cpap_stopped:
    name: Sleep session CPAP stopped
    icon: mdi:power-sleep

input_datetime:
  sleep_session_bed_in:
    name: Sleep session bed in
    has_date: true
    has_time: true

  sleep_session_cpap_on:
    name: Sleep session CPAP on
    has_date: true
    has_time: true

  sleep_session_cpap_off:
    name: Sleep session CPAP off
    has_date: true
    has_time: true

  sleep_session_bed_out:
    name: Sleep session bed out
    has_date: true
    has_time: true

input_number:
  sleep_session_bed_minutes:
    name: Latest sleep session bed time
    icon: mdi:bed-clock
    min: 0
    max: 1440
    step: 1
    unit_of_measurement: min
    mode: box

  sleep_session_cpap_minutes:
    name: Latest sleep session CPAP time
    icon: mdi:medical-bag
    min: 0
    max: 1440
    step: 1
    unit_of_measurement: min
    mode: box

  sleep_quality_score:
    name: Sleep continuity score (heuristic)
    icon: mdi:sleep
    min: 0
    max: 100
    step: 1
    unit_of_measurement: pts
    mode: box

counter:
  sleep_restlessness_events:
    name: Latest sleep session bed transitions
    icon: mdi:swap-horizontal
    minimum: 0
    maximum: 500
    step: 1
    restore: true

script:
  finalize_sleep_quality_session:
    alias: Finalize sleep quality session
    description: >-
      Persist the latest owner-suite bed/CPAP durations and bounded continuity
      heuristic after both CPAP and bed occupancy have stopped.
    mode: single
    trace:
      stored_traces: 10
    sequence:
      - variables:
          bed_in_ts: >-
            {{ state_attr('input_datetime.sleep_session_bed_in', 'timestamp') | float(0) }}
          cpap_on_ts: >-
            {{ state_attr('input_datetime.sleep_session_cpap_on', 'timestamp') | float(0) }}
          cpap_off_ts: >-
            {{ state_attr('input_datetime.sleep_session_cpap_off', 'timestamp') | float(0) }}
          bed_out_ts: >-
            {{ state_attr('input_datetime.sleep_session_bed_out', 'timestamp') | float(0) }}
      - alias: >-
          Only persist analytics for a complete, ordered session — but
          always clear the active-session flags below regardless, so an
          incomplete/out-of-order session (e.g. CPAP briefly used while the
          aggregate bed sensor never registered occupied) can't leave
          sleep_session_active latched on and silently block every future
          session from starting (Codex P2 on #373)
        if:
          - condition: template
            value_template: >-
              {{ bed_in_ts > 0
                 and cpap_on_ts >= bed_in_ts
                 and cpap_off_ts >= cpap_on_ts
                 and bed_out_ts >= bed_in_ts }}
        then:
          - variables:
              bed_minutes: >-
                {{ [1440, [0, ((bed_out_ts - bed_in_ts) / 60) | round(0)] | max] | min }}
              cpap_minutes: >-
                {{ [1440, [0, ((cpap_off_ts - cpap_on_ts) / 60) | round(0)] | max] | min }}
              bed_transitions: >-
                {{ states('counter.sleep_restlessness_events') | int(0) }}
              continuity_score: >-
                {% set cpap_points = [60, (cpap_minutes | float(0) / 480 * 60)] | min %}
                {% set bed_points = [40, (bed_minutes | float(0) / 480 * 40)] | min %}
                {% set transition_penalty = [20, bed_transitions | int(0)] | min %}
                {{ [100, [0, cpap_points + bed_points - transition_penalty] | max] | min | round(0) }}
          - action: input_number.set_value
            target:
              entity_id: input_number.sleep_session_bed_minutes
            data:
              value: "{{ bed_minutes }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.sleep_session_cpap_minutes
            data:
              value: "{{ cpap_minutes }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.sleep_quality_score
            data:
              value: "{{ continuity_score }}"
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.sleep_session_active
            - input_boolean.sleep_session_bed_entry_pending
            - input_boolean.sleep_session_cpap_stopped

automation:
  - id: sleep_quality_prepare_session
    alias: Sleep quality - prepare session
    description: >-
      Record the most recent nightly bed entry, then start a persistent session
      after sustained CPAP use without changing existing goodnight behavior.
    mode: queued
    max: 5
    trace:
      stored_traces: 10
    trigger:
      - trigger: state
        entity_id: binary_sensor.bed_presence_2d0670_bed_occupied_either
        from: "off"
        to: "on"
        id: bed_entry
      - trigger: numeric_state
        entity_id: sensor.owner_suite_cpap_plug_power
        above: 1.3
        for:
          seconds: 10
        id: cpap_start
    condition:
      - condition: state
        entity_id: input_boolean.sleep_session_active
        state: "off"
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: bed_entry
              - condition: time
                after: "18:00:00"
                before: "12:00:00"
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.sleep_session_bed_in
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.sleep_session_bed_entry_pending
          - conditions:
              - condition: trigger
                id: cpap_start
            sequence:
              - if:
                  - condition: state
                    entity_id: input_boolean.sleep_session_bed_entry_pending
                    state: "off"
                then:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.sleep_session_bed_in
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.sleep_session_cpap_on
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              - action: counter.reset
                target:
                  entity_id: counter.sleep_restlessness_events
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.sleep_session_cpap_stopped
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.sleep_session_active

  - id: sleep_quality_track_active_session
    alias: Sleep quality - track active session
    description: >-
      Count bed transitions during CPAP use, persist a guarded CPAP stop, and
      finalize once the aggregate owner-suite bed is empty.
    mode: queued
    max: 20
    trace:
      stored_traces: 10
    trigger:
      - trigger: state
        entity_id:
          - binary_sensor.bed_presence_2d0670_bed_occupied_left
          - binary_sensor.bed_presence_2d0670_bed_occupied_right
        from: "on"
        to: "off"
        id: bed_transition
      - trigger: state
        entity_id:
          - binary_sensor.bed_presence_2d0670_bed_occupied_left
          - binary_sensor.bed_presence_2d0670_bed_occupied_right
        from: "off"
        to: "on"
        id: bed_transition
      - trigger: numeric_state
        entity_id: sensor.owner_suite_cpap_plug_power
        below: 1.3
        for:
          minutes: 5
        id: cpap_stop
      - trigger: state
        entity_id: binary_sensor.bed_presence_2d0670_bed_occupied_either
        from: "on"
        to: "off"
        for:
          minutes: 5
        id: bed_exit
    condition:
      - condition: state
        entity_id: input_boolean.sleep_session_active
        state: "on"
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: bed_transition
              - condition: numeric_state
                entity_id: sensor.owner_suite_cpap_plug_power
                above: 1.3
            sequence:
              - action: counter.increment
                target:
                  entity_id: counter.sleep_restlessness_events
          - conditions:
              - condition: trigger
                id: cpap_stop
            sequence:
              - alias: >-
                  Timestamp the actual power-drop, not this delayed
                  callback — now() here is ~5 minutes late (the trigger's
                  for: duration), over-reporting cpap_minutes every session
                  (Codex P2 on #373). as_local() is required:
                  trigger.to_state.last_changed is UTC, and formatting it
                  without converting first gets interpreted as local time
                  by input_datetime.set_datetime, shifting every timestamp
                  by the UTC offset (Codex P1 follow-up on #373)
                action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.sleep_session_cpap_off
                data:
                  datetime: "{{ as_local(trigger.to_state.last_changed).strftime('%Y-%m-%d %H:%M:%S') }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.sleep_session_cpap_stopped
              - alias: >-
                  Wait for the bed's own 5-minute debounce, not just its raw
                  current state — if CPAP drops first and the bed empties
                  during this branch's debounce, the bed_exit branch hasn't
                  written bed_out yet, so finalizing here would read a
                  stale/prior bed_out, reject the session, and clear
                  sleep_session_active before bed_exit's own guarded call
                  ever runs, silently dropping a real completed session
                  (Codex P2 follow-up on #373). Matching bed_exit's own
                  for: duration guarantees bed_out is already written by
                  the time this fires; otherwise leave it to bed_exit's
                  symmetric cpap_stopped-gated call.
                if:
                  - condition: state
                    entity_id: binary_sensor.bed_presence_2d0670_bed_occupied_either
                    state: "off"
                    for:
                      minutes: 5
                then:
                  - action: script.finalize_sleep_quality_session
          - conditions:
              - condition: trigger
                id: bed_exit
            sequence:
              - alias: >-
                  Timestamp the actual bed-exit, not this delayed callback —
                  now() here is ~5 minutes late (the trigger's for:
                  duration), over-reporting bed_minutes every session
                  (Codex P2 on #373). as_local() is required:
                  trigger.to_state.last_changed is UTC, and formatting it
                  without converting first gets interpreted as local time
                  by input_datetime.set_datetime, shifting every timestamp
                  by the UTC offset (Codex P1 follow-up on #373)
                action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.sleep_session_bed_out
                data:
                  datetime: "{{ as_local(trigger.to_state.last_changed).strftime('%Y-%m-%d %H:%M:%S') }}"
              - if:
                  - condition: state
                    entity_id: input_boolean.sleep_session_cpap_stopped
                    state: "on"
                  - condition: numeric_state
                    entity_id: sensor.owner_suite_cpap_plug_power
                    below: 1.3
                then:
                  - action: script.finalize_sleep_quality_session

  - id: sleep_quality_reconcile_cpap_stop_after_restart
    alias: Sleep quality - reconcile CPAP stop after restart
    description: >-
      A pending numeric_state/state `for:` debounce (cpap_start, cpap_stop,
      or bed_exit, above) is discarded on an HA restart *or* an automation
      reload — it does not resume merely because the underlying condition
      stays true, only if the entity changes state again (Codex P2
      follow-up on #373: a plain reload doesn't emit homeassistant.start,
      so that alone missed the reload case). Three independent debounces
      can each be lost this way, so all three are reconciled here, in
      order: (1) if CPAP was already running before the gap and its own
      10-second debounce never got to run, no session ever started; (2) if
      CPAP had already dropped before the gap and its stop debounce never
      ran, sleep_session_cpap_stopped is stuck off; (3) if CPAP's own
      debounce already completed (cpap_stopped is on) but the bed's
      separate bed_exit debounce was the one in flight when the gap hit,
      sleep_session_bed_out is left stale. Each branch re-checks its
      underlying condition has held for the SAME full debounce duration the
      normal trigger requires, not just its instantaneous state, so a
      reload moments after a genuine transition can't fast-track past a
      debounce a normal trigger would still be waiting out (Codex P2
      follow-up on #373).
    trace:
      stored_traces: 10
    trigger:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    action:
      - alias: >-
          Reconcile a lost cpap_start debounce: no session is active, but
          CPAP has genuinely been running continuously for its own
          10-second debounce — sleep_quality_prepare_session's cpap_start
          branch never got to run because that debounce was discarded
          mid-flight, and without another threshold crossing it never
          re-arms on its own (Codex P2 follow-up on #373).
        if:
          - condition: state
            entity_id: input_boolean.sleep_session_active
            state: "off"
          - condition: numeric_state
            entity_id: sensor.owner_suite_cpap_plug_power
            above: 1.3
            for:
              seconds: 10
        then:
          - if:
              - condition: state
                entity_id: input_boolean.sleep_session_bed_entry_pending
                state: "off"
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.sleep_session_bed_in
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.sleep_session_cpap_on
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - action: counter.reset
            target:
              entity_id: counter.sleep_restlessness_events
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sleep_session_cpap_stopped
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sleep_session_active
      - alias: >-
          Reconcile a lost cpap_stop debounce. Exact power-drop time is
          unknown (the debounce that would have recorded it was
          discarded) — restart/reload time is the best available
          approximation. Requires CPAP to have genuinely read below
          threshold for its own full 5-minute debounce, not just its
          instantaneous state (Codex P2 follow-up on #373).
        if:
          - condition: state
            entity_id: input_boolean.sleep_session_active
            state: "on"
          - condition: state
            entity_id: input_boolean.sleep_session_cpap_stopped
            state: "off"
          - condition: numeric_state
            entity_id: sensor.owner_suite_cpap_plug_power
            below: 1.3
            for:
              minutes: 5
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.sleep_session_cpap_off
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sleep_session_cpap_stopped
      - alias: >-
          Reconcile a lost bed_exit debounce: cpap_stopped may already be
          on (either from before the gap, or just reconciled above) while
          the bed has genuinely been empty for its own full 5-minute
          debounce (same reasoning as the cpap_stop branch above), but
          sleep_session_bed_out is older than the bed sensor's own most
          recent off-transition. Comparing against the sensor's own
          last_changed (rather than sleep_session_bed_in) also catches a
          later exit within the SAME session whose debounce was lost after
          an earlier, already-recorded exit-then-reentry — bed_out from
          that earlier exit is still newer than bed_in and so was missed
          by a prior-session-only staleness check (Codex P2 follow-up on
          #373). Exact bed-exit time is unknown for the same reason as
          cpap_off above — restart/reload time is the best available
          approximation.
        if:
          - condition: state
            entity_id: input_boolean.sleep_session_active
            state: "on"
          - condition: state
            entity_id: binary_sensor.bed_presence_2d0670_bed_occupied_either
            state: "off"
            for:
              minutes: 5
          - condition: state
            entity_id: input_boolean.sleep_session_cpap_stopped
            state: "on"
          - condition: template
            value_template: >-
              {{ (state_attr('input_datetime.sleep_session_bed_out', 'timestamp') | float(0))
                 < as_timestamp(states.binary_sensor.bed_presence_2d0670_bed_occupied_either.last_changed) }}
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.sleep_session_bed_out
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - if:
          - condition: state
            entity_id: input_boolean.sleep_session_active
            state: "on"
          - condition: state
            entity_id: binary_sensor.bed_presence_2d0670_bed_occupied_either
            state: "off"
          - condition: state
            entity_id: input_boolean.sleep_session_cpap_stopped
            state: "on"
        then:
          - action: script.finalize_sleep_quality_session
