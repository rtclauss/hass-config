# High-traffic Inovelli LED bars show the highest-priority active house-state
# signal. Effects go through script.publish_inovelli_z2m_led_effect so the
# Zigbee2MQTT payload is defined once and restored/unavailable targets are skipped.
# Values mirror the retired blueprint mapping: Red=0, Orange=8, Cyan=127,
# level = brightness * 10, duration 255 = Forever.

script:
  # Priority 1: an actionable exterior-door security state.
  inovelli_house_state_front_door_unlocked:
    alias: Inovelli house state - front door needs attention
    mode: restart
    trace:
      stored_traces: 10
    sequence:
      - action: script.publish_inovelli_z2m_led_effect
        data:
          entity_ids: &house_state_led_targets
            - light.hall_transition_switch
            - light.laundry_wall_switch
            - light.garage_overhead_switch
          effect: pulse # Z2M name for the blueprint's "Pulse"
          color: 0 # Red
          level: 40 # brightness 4
          duration: 255 # Forever

  # Priority 2: the garage is open or moving open.
  inovelli_house_state_garage_open:
    alias: Inovelli house state - garage open
    mode: restart
    trace:
      stored_traces: 10
    sequence:
      - action: script.publish_inovelli_z2m_led_effect
        data:
          entity_ids: *house_state_led_targets
          effect: pulse # blueprint "Open Close" maps to Z2M pulse
          color: 8 # Orange
          level: 30 # brightness 3
          duration: 255

  # Priority 3: mail is waiting to be collected.
  inovelli_house_state_mail_waiting:
    alias: Inovelli house state - mail waiting
    mode: restart
    trace:
      stored_traces: 10
    sequence:
      - action: script.publish_inovelli_z2m_led_effect
        data:
          entity_ids: *house_state_led_targets
          effect: solid
          color: 127 # Cyan
          level: 20 # brightness 2
          duration: 255

  inovelli_house_state_clear:
    alias: Inovelli house state - clear
    mode: restart
    trace:
      stored_traces: 10
    sequence:
      - action: script.publish_inovelli_z2m_led_effect
        data:
          entity_ids: *house_state_led_targets
          effect: clear_effect
          color: 0
          level: 281
          duration: 0

  apply_inovelli_house_state_notification:
    alias: Apply Inovelli house-state notification
    description: >
      Show the highest-priority active door, garage, or mail signal on the
      selected high-traffic Inovelli LED bars. Trip mode owns all LEDs while
      active, so this coordinator exits without changing them during a trip.
    mode: restart
    trace:
      stored_traces: 10
    sequence:
      - condition: state
        entity_id: input_boolean.trip
        state: "off"
      - choose:
          - alias: Front door needs attention
            conditions:
              - condition: state
                entity_id: lock.front_door_lock
                state:
                  - unlocked
                  - unlocking
                  - open
                  - opening
                  - jammed
            sequence:
              - action: script.inovelli_house_state_front_door_unlocked
          - alias: Garage door needs attention
            conditions:
              - condition: state
                entity_id: cover.garage_door
                state:
                  - open
                  - opening
            sequence:
              - action: script.inovelli_house_state_garage_open
          - alias: Mail is waiting
            conditions:
              - condition: state
                entity_id: input_boolean.mail_delivered
                state: "on"
            sequence:
              - action: script.inovelli_house_state_mail_waiting
        default:
          - action: script.inovelli_house_state_clear

automation:
  - id: sync_inovelli_house_state_notification
    alias: Sync Inovelli house-state notification
    description: >
      Re-evaluate the deterministic house-state LED priority whenever a source
      changes or Home Assistant starts.
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - lock.front_door_lock
          - cover.garage_door
          - input_boolean.mail_delivered
      - trigger: state
        entity_id: input_boolean.trip
        to: "off"
      - trigger: state
        entity_id: script.reset_inovelli_switches
        to: "off"
        id: reset_completed
    actions:
      - if:
          - condition: trigger
            id: reset_completed
        then:
          - delay: "00:10:00"
      - action: script.apply_inovelli_house_state_notification
    mode: restart
    trace:
      stored_traces: 10
