########################
# Alarm Panel
########################
alarm_control_panel:

########################
## Automation
########################
automation:
  - id: tv_paused
    alias: tv_paused
    initial_state: true
    hide_entity: true
    trigger:
      - platform: state
        entity_id: media_player.living_room_firetv
        from: playing
        to: paused
      - platform: state
        entity_id: media_player.vizio_smartcast
        #TODO Temporary hack: ADB showing wrong values
        from: paused
        to: playing
      - platform: state
        entity_id: media_player.living_room_firetv
        #TODO Temporary hack: ADB showing wrong values
        from: paused
        to: standby
    condition:
      condition: and
      conditions:
      - condition: time
        after: '19:30:00'
        before: '23:59:00'
      - condition: state
        entity_id: input_boolean.guest_mode
        state: 'off'
    action:
      - service: scene.turn_on
        entity_id: scene.tv_paused

  - id: tv_resumed
    alias: tv_resumed
    initial_state: true
    hide_entity: true
    trigger:
      - platform: state
        entity_id: media_player.living_room_firetv
        #TODO Temporary hack: ADB showing wrong values
        from: playing
        to: paused
      - platform: state
        entity_id: media_player.living_room_firetv
        #TODO Temporary hack: ADB showing wrong values
        from: standby
        to: paused
      - platform: state
        entity_id: media_player.vizio_smartcast
        to: playing
    condition:
      condition: and
      conditions:
        - condition: time
          after: '19:30:00'
          before: '23:59:00'
        - condition: state
          entity_id: input_boolean.guest_mode
          state: 'off'
    action:
      - service: scene.turn_on
        entity_id: scene.tv_resumed

