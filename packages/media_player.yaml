########################
# Media Player
########################
media_player:
  - platform: plex
    entity_namespace: 'plex'

  - platform: androidtv
    name: Living Room FireTV
    host: 192.168.1.38
    adb_server_ip: 127.0.0.1

  - platform: spotify
    client_id: !secret spotify_client_id
    client_secret: !secret spotify_client_secret

