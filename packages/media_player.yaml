########################
# Scripts
########################
script:
  music_assistant_pause_house_audio:
    alias: "Pause whole-home MA audio"
    trace:
      stored_traces: 50
    sequence:
      - action: media_player.media_pause
        continue_on_error: true
        target:
          entity_id:
            - media_player.bedroom_sonos_2
            - media_player.bathroom_sonos_2
            - media_player.office_sonos_2
            - media_player.den_sonos_2
            - media_player.tiki_room_2

  music_assistant_sync_group_migration_stub:
    alias: "Log disabled Music Assistant sync-group migration helper"
    trace:
      stored_traces: 50
    fields:
      caller_entity_id:
        description: "Deprecated helper script entity that was called"
    sequence:
      - action: logbook.log
        data:
          name: "Sync Group Migration"
          message: "{{ caller_entity_id | default(this.entity_id) }} called but disabled — targeting sync groups directly now"
          domain: script

  music_assistant_prepare_bedroom_group:
    alias: "Prepare bedroom Music Assistant group"
    mode: restart
    # TODO: Remove once Music Assistant sync group verified working in production
    # sequence: (commented out — replaced by targeting sync group entities directly)
    trace:
      stored_traces: 50
    sequence:
      - action: script.music_assistant_sync_group_migration_stub
        data:
          caller_entity_id: script.music_assistant_prepare_bedroom_group

  music_assistant_try_join_bedroom_group_after_play:
    alias: "Try joining bedroom Music Assistant followers after playback"
    mode: restart
    # TODO: Remove once Music Assistant sync group verified working in production
    # sequence: (commented out — replaced by targeting sync group entities directly)
    trace:
      stored_traces: 50
    sequence:
      - action: script.music_assistant_sync_group_migration_stub
        data:
          caller_entity_id: script.music_assistant_try_join_bedroom_group_after_play

  music_assistant_prepare_arrival_group:
    alias: "Prepare arrival Music Assistant group"
    # TODO: Remove once Music Assistant sync group verified working in production
    # sequence: (commented out — replaced by targeting sync group entities directly)
    trace:
      stored_traces: 50
    sequence:
      - action: script.music_assistant_sync_group_migration_stub
        data:
          caller_entity_id: script.music_assistant_prepare_arrival_group

  music_assistant_prepare_house_party_group:
    alias: "Prepare house party Music Assistant group"
    # TODO: Remove once Music Assistant sync group verified working in production
    # sequence: (commented out — replaced by targeting sync group entities directly)
    trace:
      stored_traces: 50
    sequence:
      - action: script.music_assistant_sync_group_migration_stub
        data:
          caller_entity_id: script.music_assistant_prepare_house_party_group

  music_assistant_play_item:
    alias: "Play Music Assistant item"
    trace:
      stored_traces: 50
    fields:
      entity_id:
        description: "Music Assistant media_player entity"
      media_item:
        description: "Music Assistant URI, open.spotify.com URL, or plain item name"
      media_type:
        description: "Optional Music Assistant media type"
      enqueue:
        description: "Music Assistant enqueue mode"
    variables:
      raw_item: "{{ media_item | trim }}"
      raw_media_type: "{{ media_type | default('') | trim }}"
      raw_enqueue: "{{ enqueue | default('replace') }}"
      normalized_item: >-
        {%- set s = ('spotify:' ~ raw_item.split(':')[3] ~ ':' ~ raw_item.split(':')[4]) if (raw_item.startswith('spotify:user:') and (raw_item.split(':') | length) == 5) else raw_item -%}
        {{ s }}
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ raw_media_type != '' }}"
            sequence:
              - action: music_assistant.play_media
                continue_on_error: true
                target:
                  entity_id: "{{ entity_id }}"
                data:
                  media_id: "{{ normalized_item }}"
                  media_type: "{{ raw_media_type }}"
                  enqueue: "{{ raw_enqueue }}"
        default:
          - action: music_assistant.play_media
