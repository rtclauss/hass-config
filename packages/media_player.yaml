########################
# Scenes
########################
scene:
  - name: tv_playing_media
    entities:
      light.living_room_all_except_tv:
        state: "off"
        transition: 20
      light.kitchen_sink:
        state: "off"
      light.kitchen_table:
        state: "off"
        transition: 20
      light.lava_lamp:
        state: "off"
      light.office_ceiling:
        state: "off"
        transition: 20
      light.office_lamp:
        state: "off"
        transition: 20
      light.hallway_light:
        state: "off"
        transition: 20
      light.tv:
        state: "on"
        brightness_pct: 75
        transition: 20
      light.guest_bedroom:
        state: "off"
        transition: 20
      switch.christmas_tree:
        state: "off"
      switch.deck:
        state: "off"
      switch.deck_led_string:
        state: "off"
      switch.front_door:
        state: "off"
      switch.stairs:
        state: "off"

  - name: tv_paused
    entities:
      light.living_room_all_except_tv:
        state: "on"
        brightness_pct: 50
      light.kitchen_sink:
        state: "on"
        brightness_pct: 100
      switch.stairs:
        state: "on"

  - name: tv_resumed
    entities:
      light.living_room_all_except_tv:
        state: "off"
      light.kitchen_sink:
        state: "off"
      light.kitchen_table:
        state: "off"
      light.lava_lamp:
        state: "off"
      light.office_ceiling:
        state: "off"
      light.office_lamp:
        state: "off"
      light.hallway_light:
        state: "off"
      light.tv:
        state: "on"
        brightness_pct: 25
      light.guest_bedroom:
        state: "off"
      switch.christmas_tree:
        state: "off"
      switch.deck:
        state: "off"
      switch.deck_led_string:
        state: "off"
      switch.front_door:
        state: "off"
      switch.stairs:
        state: "off"

