# Home Assistant package for Tesla, charging, and garage-adjacent car automations.
# Complex areas: it blends trip timing, charging policy, location, and garage device recovery so the car behaves correctly before departures and after arrivals.

################################################################
## Packages / Car
################################################################

################################################
## Customize
################################################

homeassistant:
  customize:
    ################################################
    ## Node Anchors
    ################################################

    package.node_anchors:
      customize: &customize
        package: "car"

      expose: &expose
        <<: *customize
        haaska_hidden: false
        homebridge_hidden: false

    ################################################
    ## Alarm Panels
    ################################################

    ################################################
    ## Automations
    ################################################

    ################################################
    ## Binary Sensors
    ################################################

    ################################################
    ## Cameras
    ################################################

    ################################################
    ## Covers
    ################################################

    ################################################
    ## Device Trackers
    ################################################

    ################################################
    ## Groups
    ################################################

    ################################################
    ## Input Boolean
    ################################################
    # input_boolean.car_in_motion:
    #   <<: *customize
    #   icon: mdi:car
    #   class: motion

    ################################################
    ## Input Numbers
    ################################################

    ################################################
    ## Input Select
    ################################################

    ################################################
    ## iOS
    ################################################

    ################################################
    ## Light
    ################################################

    ################################################
    ## Scripts
    ################################################

    ################################################
    ## Sensors
    ################################################
    sensor.charge_complete:
      <<: *customize
      icon: mdi:robot-vacuum
      friendly_name: "Tesla Charge Complete Estimate"
    sensor.waze_next_trip_distance:
      <<: *customize
      icon: mdi:robot-vacuum
      friendly_name: "Distance to next destination"

################################################
## Thermostats
################################################

################################################
## Zone
################################################

########################
# Alarm Panel
########################
alarm_control_panel: []

########################
## Automation
########################
automation:
  - id: hydrate_home_address_input_text
    alias: hydrate_home_address_input_text
    trace:
      stored_traces: 10
    trigger:
      - trigger: homeassistant
        event: start
    action:
      - action: input_text.set_value
        target:
          entity_id: input_text.home_address
        data:
          value: !secret home_address

  - id: tesla_departure_planner_apply
    alias: tesla_departure_planner_apply
    mode: restart
    trace:
      stored_traces: 10
    trigger:
      - trigger: time
        at: "21:35:00"
        id: nightly
      - trigger: time
        at: "04:30:00"
        id: early_morning
      - trigger: homeassistant
        event: start
        alias: Planner startup reconciliation
        id: startup
      - trigger: state
        entity_id: binary_sensor.upcoming_trip_charging
        id: trip_change
      - trigger: state
        entity_id: binary_sensor.upcoming_trip_charging
        attribute: start_time
        id: trip_details_change
      - trigger: state
        entity_id: binary_sensor.upcoming_trip_charging
        attribute: all_day
        id: trip_details_change
      - trigger: state
        entity_id: binary_sensor.upcoming_trip_charging
        attribute: distance_mi
        id: trip_details_change
      - trigger: state
        entity_id:
          - input_boolean.weekday_alarm_on
          - input_boolean.weekend_alarm_on
          - input_boolean.long_range_travel
          - input_datetime.weekday_alarm
          - input_datetime.weekend_alarm
          - select.daily_ev_charging
          - select.hourly_ev_charging
          - input_number.ev_electrical_rate
        id: planner_input
      - trigger: state
        entity_id: binary_sensor.nigori_parking_brake
        to: "on"
        for:
          minutes: 5
        id: parked_home
      - trigger: state
        entity_id:
          - person.ryan
          - device_tracker.nigori_location_tracker
        to: "home"
        id: home_reconciliation
      - trigger: numeric_state
        entity_id: sensor.outside_temperature
        below: 20
        id: cold_snap
      - trigger: numeric_state
        entity_id: sensor.outside_temperature
        above: 20
        id: warm_snap
    condition:
      - condition: state
        entity_id: binary_sensor.nigori_parking_brake
        state: "on"
      - condition: state
        entity_id: device_tracker.nigori_location_tracker
        state: "home"
    action:
      - alias: Delay planner startup reconciliation
        choose:
          - conditions:
              - condition: trigger
                id: startup
            sequence:
              - delay: "00:00:30"
      - variables:
          tesla_plan_json: >-
            {% set manual_override = is_state('input_boolean.long_range_travel', 'on') %}
            {% set weekday_alarm_enabled = is_state('input_boolean.weekday_alarm_on', 'on') %}
            {% set weekend_alarm_enabled = is_state('input_boolean.weekend_alarm_on', 'on') %}
            {% if weekday_alarm_enabled %}
              {% set alarm_time_raw = states('input_datetime.weekday_alarm') %}
              {% set alarm_source = 'weekday alarm' %}
            {% elif weekend_alarm_enabled %}
              {% set alarm_time_raw = states('input_datetime.weekend_alarm') %}
              {% set alarm_source = 'weekend alarm' %}
            {% else %}
              {% set alarm_time_raw = '' %}
              {% set alarm_source = 'alarm' %}
            {% endif %}
            {% set alarm_enabled = alarm_time_raw not in ['', 'unknown', 'unavailable', 'none', 'None'] %}
            {% set outside_temp_f = states('sensor.outside_temperature') | float(default=999) %}
            {% set outside_temp_known = states('sensor.outside_temperature') not in ['unknown', 'unavailable'] %}
            {% set cold_weather = outside_temp_f <= 20 %}
            {% set trip_entry = state_attr('binary_sensor.upcoming_trip_charging', 'entry') | default('', true) %}
            {% set trip_furthest_entry = state_attr('binary_sensor.upcoming_trip_charging', 'furthest_entry') | default('', true) %}
            {% set trip_distance_mi = state_attr('binary_sensor.upcoming_trip_charging', 'distance_mi') | float(default=0) %}
            {% set trip_duration_raw = state_attr('binary_sensor.upcoming_trip_charging', 'duration_min') %}
            {% if trip_duration_raw is number %}
              {% set trip_duration = timedelta(minutes=trip_duration_raw) %}
            {% elif trip_duration_raw is string and trip_duration_raw | trim not in ['', 'unknown', 'unavailable', 'none', 'None'] %}
              {% set trip_duration = trip_duration_raw | as_timedelta %}
            {% else %}
              {% set trip_duration = timedelta() %}
            {% endif %}
            {% set trip_duration_min = (trip_duration.days * 1440) + (trip_duration.seconds // 60) %}
            {% set trip_start_raw = state_attr('binary_sensor.upcoming_trip_charging', 'start_time') %}
            {% set trip_all_day = state_attr('binary_sensor.upcoming_trip_charging', 'all_day') in [true, 'true', 'True', 'on'] %}
            {% set has_calendar_departure = trip_start_raw not in [none, '', 'None'] %}
            {% set has_upcoming_trip = is_state('binary_sensor.upcoming_trip_charging', 'on') and has_calendar_departure %}
            {% if states('select.daily_ev_charging') not in ['unknown', 'unavailable'] %}
              {% set tariff = states('select.daily_ev_charging') %}
            {% else %}
              {% set tariff = states('select.hourly_ev_charging') %}
            {% endif %}
            {% set electrical_rate = states('input_number.ev_electrical_rate') | float(default=0) %}
            {% set location_name = states('device_tracker.nigori_location_tracker') | default('', true) | lower %}
            {% set location_label = location_name | replace('_', ' ') | title %}
            {% set preserve_default_charging_schedule = location_name in ['home', 'parents', 'occ', 'spcc'] %}
            {% set resident_home = is_state('person.ryan', 'home') %}
            {% set tariff_name = tariff | lower %}
            {% set tariff_display = tariff | replace('_', '-') | title %}
            {% set high_tariff = tariff_name in ['on_peak', 'on-peak', 'onpeak'] or electrical_rate >= 0.13 %}
            {% set tpms_reminder_threshold_psi = states('input_number.tesla_tpms_air_threshold_psi') | float(default=38) %}
            {% set tpms_readings = [
              {'label': 'front left', 'psi': states('sensor.nigori_tpms_front_left') | float(default=999)},
              {'label': 'front right', 'psi': states('sensor.nigori_tpms_front_right') | float(default=999)},
              {'label': 'rear left', 'psi': states('sensor.nigori_tpms_rear_left') | float(default=999)},
              {'label': 'rear right', 'psi': states('sensor.nigori_tpms_rear_right') | float(default=999)}
            ] %}
            {% set tpms_ns = namespace(low=[]) %}
            {% for reading in tpms_readings %}
              {% if reading.psi < tpms_reminder_threshold_psi %}
                {% set tpms_ns.low = tpms_ns.low + [reading.label ~ ' ' ~ (reading.psi | round(0) | int) ~ ' psi'] %}
              {% endif %}
            {% endfor %}
            {% set low_tpms = tpms_ns.low | count > 0 %}
            {% set low_tpms_summary = tpms_ns.low | join(', ') %}
            {% set departure_dt = none %}
            {% if has_calendar_departure %}
              {% set trip_start_dt = trip_start_raw | as_datetime | as_local %}
              {% set trip_buffer_min = 20 + (10 if cold_weather else 0) %}
              {% set departure_dt = trip_start_dt - trip_duration - timedelta(minutes=trip_buffer_min) %}
            {% elif alarm_enabled %}
              {% set alarm_base_dt = today_at(alarm_time_raw[:5]) %}
              {% set prep_buffer_min = 45 + (10 if cold_weather else 0) %}
              {% set candidate_departure = alarm_base_dt + timedelta(minutes=prep_buffer_min) %}
              {% if candidate_departure < now() + timedelta(minutes=15) %}
                {% set departure_dt = candidate_departure + timedelta(days=1) %}
              {% else %}
                {% set departure_dt = candidate_departure %}
              {% endif %}
            {% endif %}
            {% if has_upcoming_trip and trip_distance_mi >= 90 %}
              {% set charge_limit = 100 %}
            {% elif has_upcoming_trip %}
              {% set charge_limit = 90 %}
            {% elif has_calendar_departure %}
              {% set charge_limit = 80 %}
            {% elif alarm_enabled and cold_weather %}
              {% set charge_limit = 90 %}
            {% elif alarm_enabled and not high_tariff %}
              {% set charge_limit = 85 %}
            {% elif alarm_enabled %}
              {% set charge_limit = 80 %}
            {% else %}
              {% set charge_limit = 80 %}
            {% endif %}
            {% if manual_override %}
              {% set charge_limit = 100 %}
            {% endif %}
            {% set manage_tesla_schedule = (not preserve_default_charging_schedule) or charge_limit != 80 %}
            {% set departure_window_open = departure_dt is not none and departure_dt > now() %}
            {% set precondition = has_calendar_departure and departure_window_open and resident_home and location_name == 'home' %}
            {% if trip_all_day %}
              {% set precondition = false %}
            {% endif %}
            {% set active = manual_override or has_calendar_departure or alarm_enabled %}
            {% if has_upcoming_trip %}
              {% set source = 'calendar trip' %}
            {% elif has_calendar_departure %}
              {% set source = 'calendar departure' %}
            {% elif alarm_enabled %}
              {% set source = alarm_source %}
            {% elif manual_override %}
              {% set source = 'manual override' %}
            {% else %}
              {% set source = 'default' %}
            {% endif %}
            {% if departure_dt is not none %}
              {% set departure_label = departure_dt.strftime('%a %I:%M %p') %}
              {% set departure_time = departure_dt.isoformat() %}
            {% else %}
              {% set departure_label = '' %}
              {% set departure_time = '' %}
            {% endif %}
            {% if manual_override and not has_upcoming_trip and not alarm_enabled %}
              {% set summary = 'Manual max-range override is on. Keep the Tesla at 100% charge.' %}
            {% elif has_upcoming_trip %}
              {% set summary = 'Plan Tesla for ' ~ (trip_entry if trip_entry else 'upcoming trip') ~ '. Set charge limit to ' ~ charge_limit ~ '% and ' ~ ('enable' if precondition else 'skip') ~ ' preconditioning for ' ~ departure_label ~ '. Distance ' ~ (trip_distance_mi | round(0)) ~ ' mi. EV tariff ' ~ tariff_display ~ ' at $' ~ ('%.4f' | format(electrical_rate)) ~ '/kWh.' %}
            {% elif has_calendar_departure %}
              {% set summary = 'Plan Tesla for ' ~ (trip_entry if trip_entry else 'upcoming calendar departure') ~ '. Keep the default ' ~ charge_limit ~ '% charge limit and ' ~ ('enable' if precondition else 'skip') ~ ' preconditioning for ' ~ departure_label ~ '. Distance ' ~ (trip_distance_mi | round(0)) ~ ' mi. EV tariff ' ~ tariff_display ~ ' at $' ~ ('%.4f' | format(electrical_rate)) ~ '/kWh.' %}
            {% elif alarm_enabled %}
              {% if charge_limit == 80 and high_tariff and not cold_weather %}
                {% set charge_limit_phrase = 'Keep the default 80% charge limit because the current EV tariff is higher' %}
              {% else %}
                {% set charge_limit_phrase = 'Set charge limit to ' ~ charge_limit ~ '%' %}
              {% endif %}
              {% if precondition %}
                {% set precondition_phrase = 'enable preconditioning for ' ~ departure_label %}
              {% else %}
                {% set precondition_phrase = 'skip cabin preconditioning until a real next-day departure is scheduled' %}
              {% endif %}
              {% set summary = 'Plan Tesla for ' ~ source ~ '. ' ~ charge_limit_phrase ~ ' and ' ~ precondition_phrase ~ '.' ~ (' Outside ' ~ (outside_temp_f | round(0) | int) ~ 'F.' if outside_temp_known else '') ~ ' EV tariff ' ~ tariff_display ~ ' at $' ~ ('%.4f' | format(electrical_rate)) ~ '/kWh.' %}
            {% else %}
              {% set summary = 'No next-day departure plan detected. Restore the Tesla default charge limit to 80%.' %}
            {% endif %}
            {% if preserve_default_charging_schedule %}
              {% set summary = summary ~ ' Preserve the Tesla app charging schedule at ' ~ location_label ~ '.' %}
            {% endif %}
            {% if preserve_default_charging_schedule and not manage_tesla_schedule and departure_time != '' %}
              {% set summary = summary ~ ' No extra home charging override is needed.' %}
            {% endif %}
            {% if has_calendar_departure and trip_furthest_entry and trip_furthest_entry != trip_entry %}
              {% set summary = summary ~ " Charge target reflects today's furthest stop: " ~ trip_furthest_entry ~ '.' %}
            {% endif %}
            {% if has_calendar_departure and not resident_home %}
              {% set summary = summary ~ ' Cabin preconditioning is suppressed because Ryan is away.' %}
            {% endif %}
            {% if precondition and low_tpms %}
              {% set summary = summary ~ ' Tire pressure is low: ' ~ low_tpms_summary ~ '. Get air before you leave.' %}
            {% endif %}
            {{ {
              'active': active,
              'source': source,
              'charge_limit': charge_limit,
              'precondition': precondition and departure_time != '',
              'departure_time': departure_time,
              'summary': summary,
              'low_tpms': low_tpms,
              'low_tpms_summary': low_tpms_summary,
              'location': location_name,
              'preserve_default_charging_schedule': preserve_default_charging_schedule,
              'manage_tesla_schedule': manage_tesla_schedule,
              'tariff': tariff,
              'electrical_rate': electrical_rate,
              'trip_distance_mi': trip_distance_mi,
              'trip_duration_min': trip_duration_min,
              'outside_temp_f': outside_temp_f,
              'high_tariff': high_tariff,
              'has_calendar_departure': has_calendar_departure,
              'resident_home': resident_home
            } | to_json }}
          tesla_plan: "{{ tesla_plan_json | from_json }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('number.nigori_charge_limit') | int(default=-1) != tesla_plan.charge_limit | int(default=80) }}"
            sequence:
              - action: number.set_value
                target:
                  entity_id: number.nigori_charge_limit
                data:
                  value: "{{ tesla_plan.charge_limit }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ tesla_plan.precondition and tesla_plan.departure_time != '' }}"
            sequence:
              - action: script.tesla_set_precondition_schedule_time
                data:
                  departure_time: "{{ tesla_plan.departure_time }}"
                  reason: "{{ tesla_plan.summary }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.tesla_managed_departure_ts
                data:
                  value: "{{ tesla_plan.departure_time | as_timestamp(default=0) | int(0) }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.tesla_managed_departure_active
        default:
          # Keep tracking an HA-managed departure until the Tesla schedule is
          # actually cleared. The disable path refuses to send enable:false at a
          # protected location while the Tesla app's scheduled/off-peak charging
          # is active; dropping the helpers anyway left the preconditioning
          # schedule armed on the car with nothing on the HA side to retry it.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state('input_boolean.tesla_managed_departure_active', 'on') }}"
                sequence:
                  - action: script.tesla_set_precondition_schedule_time
                    data:
                      enabled: false
                      force_disable: "{{ not tesla_plan.resident_home or tesla_plan.location != 'home' }}"
                      reason: "{{ tesla_plan.summary }}"
                    response_variable: tesla_schedule_result
                  - if:
                      - condition: template
                        value_template: "{{ tesla_schedule_result.cleared | default(false) in [true, 'true', 'True'] }}"
                    then:
                      - action: input_boolean.turn_off
                        target:
                          entity_id: input_boolean.tesla_managed_departure_active
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.tesla_managed_departure_ts
                        data:
                          value: 0
                    else:
                      - action: logbook.log
                        data:
                          entity_id: script.tesla_set_precondition_schedule_time
                          domain: script
                          name: Tesla scheduled departure planner
                          message: >-
                            Kept the HA-managed departure tracked: the Tesla schedule could not be cleared yet.
      - choose:
          - conditions:
              - condition: or
                conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'nightly' and tesla_plan.active }}"
                  # trip_change has no attribute filter (it exists to catch
                  # the sensor flipping on/off at all), so it also fires on
                  # every attribute-only recompute — e.g. distance_mi/
                  # duration_min drifting a little with live Waze traffic on
                  # every 15-minute tick while a trip stays active all night.
                  # Only notify here when the on/off value itself changed;
                  # trip_details_change already covers metadata refinement
                  # without re-notifying. Require both sides to be a real
                  # on/off value (not unknown/unavailable) so recovering from
                  # a transient unavailability (HA restart, template reload)
                  # back to the same "on" state doesn't read as a fresh
                  # activation and restart the notification storm.
                  - condition: template
                    value_template: >-
                      {{ trigger.id == 'trip_change' and tesla_plan.active and
                         trigger.from_state is not none and
                         trigger.to_state is not none and
                         trigger.from_state.state in ['on', 'off'] and
                         trigger.to_state.state in ['on', 'off'] and
                         trigger.from_state.state != trigger.to_state.state }}
                  - condition: template
                    value_template: "{{ trigger.id == 'early_morning' and tesla_plan.precondition and tesla_plan.low_tpms }}"
            sequence:
              - continue_on_error: true
                action: notify.notify_all
                data:
                  data:
                    url: "/ryan-new-mushroom/tesla-v2"
                  message: "{{ tesla_plan.summary }}"

  - id: tesla_departure_cancel_when_home_context_ends
    alias: tesla_departure_cancel_when_home_context_ends
    mode: restart
    trace:
      stored_traces: 10
    trigger:
      # "home -> anything" would include home -> unavailable/unknown, which a
      # Tesla API hiccup or an integration reload produces while the car has not
      # moved. That read as "left home" and force-cleared a live schedule, so
      # only a known non-home state counts as leaving (see #904/#907).
      - trigger: state
        entity_id:
          - person.ryan
          - device_tracker.nigori_location_tracker
        from: "home"
        not_to:
          - "unknown"
          - "unavailable"
        id: home_context_left
      # The Tesla API command can return before the integration publishes the
      # new departure timestamp. If the owner leaves during that window, the
      # first protected-location clear safely declines because it cannot prove
      # the live schedule is HA-managed. Retry as soon as Tesla reports the
      # timestamp, but only while the owner or vehicle is still away.
      - trigger: state
        entity_id: binary_sensor.nigori_scheduled_departure
        attribute: Departure timestamp
        id: tesla_schedule_synced
    condition:
      - condition: state
        entity_id: input_boolean.tesla_managed_departure_active
        state: "on"
      - condition: or
        conditions:
          - condition: trigger
            id: home_context_left
          # Only a *known* non-home state means away. `not is_state(x, 'home')`
          # is also true for unknown/unavailable, so the Tesla integration
          # publishing the departure timestamp at startup — while the trackers
          # were still restoring — passed this check and force-cleared the
          # schedule the planner had just armed. The planner could not re-arm it
          # either: its own condition needs the tracker to read `home`.
          - condition: template
            value_template: >-
              {{ states('person.ryan') not in ['home', 'unknown', 'unavailable'] or
                 states('device_tracker.nigori_location_tracker') not in ['home', 'unknown', 'unavailable'] }}
    action:
      - action: script.tesla_set_precondition_schedule_time
        data:
          enabled: false
          force_disable: true
          reason: >-
            Cancel the Home Assistant-managed Tesla departure because Ryan or Nigori left home.
        response_variable: tesla_schedule_result
      # Only stop tracking once the Tesla schedule is actually gone; otherwise a
      # later planner run still has the helpers set and can retry the clear.
      - if:
          - condition: template
            value_template: "{{ tesla_schedule_result.cleared | default(false) in [true, 'true', 'True'] }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.tesla_managed_departure_active
          - action: input_number.set_value
            target:
              entity_id: input_number.tesla_managed_departure_ts
            data:
              value: 0

  - id: tesla_departure_schedule_cleanup
    alias: tesla_departure_schedule_cleanup
    mode: single
    trace:
      stored_traces: 10
    trigger:
      - trigger: template
        id: departure_passed
        value_template: >-
          {% set stored_departure_ts = states('input_number.tesla_managed_departure_ts') | int(0) %}
          {{ is_state('input_boolean.tesla_managed_departure_active', 'on') and stored_departure_ts > 0 and stored_departure_ts | timestamp_local | as_datetime <= now() }}
      - trigger: homeassistant
        event: start
        alias: Cleanup startup reconciliation
        id: startup
    action:
      - alias: Delay cleanup startup reconciliation
        choose:
          - conditions:
              - condition: trigger
                id: startup
            sequence:
              - delay: "00:00:30"
      - variables:
          stored_departure_ts: "{{ states('input_number.tesla_managed_departure_ts') | int(0) }}"
          cleanup_reason: >-
            {% if stored_departure_ts > 0 %}
              Tesla-managed schedule for {{ stored_departure_ts | timestamp_custom('%a %I:%M %p', true) }} has passed.
            {% else %}
              Tesla-managed schedule has passed.
            {% endif %}
      - condition: template
        value_template: >-
          {{ is_state('input_boolean.tesla_managed_departure_active', 'on') and stored_departure_ts > 0 and stored_departure_ts | timestamp_local | as_datetime <= now() }}
      - action: script.tesla_set_precondition_schedule_time
        data:
          enabled: false
          reason: "{{ cleanup_reason }}"
        response_variable: tesla_schedule_result
      # A passed departure that could not be cleared (Tesla-app scheduled or
      # off-peak charging active at a protected location) stays tracked, so the
      # next planner run retries instead of leaving the car armed forever.
      - if:
          - condition: template
            value_template: "{{ tesla_schedule_result.cleared | default(false) in [true, 'true', 'True'] }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.tesla_managed_departure_active
          - action: input_number.set_value
            target:
              entity_id: input_number.tesla_managed_departure_ts
            data:
              value: 0

  - id: do_restart_garage_door_esp
    alias: do_restart_garage_door_esp
    # Restarts the garage door ESPHome device daily at 04:00 to keep its
    # MQTT connection fresh.
    # Fixed: added continue_on_error: true so that a timeout (e.g. when the
    # ESP is briefly offline or has already been restarted) does not mark the
    # automation as errored. The restart is best-effort — if the device is
    # unreachable the automation should simply complete cleanly.
    trace:
      stored_traces: 10
    trigger:
      - trigger: time
        at: "04:00:00"
    condition: []
    action:
      - action: rest_command.restart_garage_opener
        continue_on_error: true

  - id: set_charging_rate
    alias: set_charging_rate
    trace:
      stored_traces: 10
    trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        id: max_range
        event_data:
          action: MAX_RANGE
      - trigger: event
        event_type: mobile_app_notification_action
        id: normal_range
        event_data:
          action: NORMAL_RANGE
      - trigger: state
        id: max_range
        entity_id: input_boolean.long_range_travel
        from: "off"
        to: "on"
      - trigger: state
        id: normal_range
        entity_id: input_boolean.long_range_travel
        from: "on"
        to: "off"
    condition: []
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: max_range
            sequence:
              - action: number.set_value
                target:
                  entity_id: number.nigori_charge_limit
                data:
                  value: >-
                    100
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.long_range_travel
          - conditions:
              - condition: trigger
                id: normal_range
            sequence:
              - action: number.set_value
                target:
                  entity_id: number.nigori_charge_limit
                data:
                  value: >-
                    80
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.long_range_travel

