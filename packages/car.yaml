########################
# Scripts
########################
script:
  tesla_set_precondition_schedule_time:
    alias: Tesla Set Precondition Schedule Time
    mode: restart
    trace:
      stored_traces: 10
    fields:
      enabled:
        description: Whether Tesla scheduled departure should be enabled or disabled.
        example: true
      departure_time:
        description: Desired Tesla departure time from home in ISO datetime format.
        example: "2026-03-21T08:05:00-05:00"
      reason:
        description: Optional reason to include in the logbook entry.
        example: "Weekday alarm departure plan"
      force_disable:
        description: Disable the managed departure even at a protected location, such as when Ryan or Nigori leaves home.
        example: true
    sequence:
      - variables:
          schedule_enabled: "{{ enabled | default(true) not in [false, 'false', 'False', 'off', 0, '0'] }}"
          requested_departure_text: "{{ departure_time | default('', true) | string | trim }}"
          location_name: "{{ states('device_tracker.nigori_location_tracker') | default('', true) | lower }}"
          location_label: >-
            {% if location_name not in ['', 'unknown', 'unavailable', 'none', 'None'] %}
              {{ location_name | replace('_', ' ') | title }}
            {% else %}
              current location
            {% endif %}
          effective_departure_text: >-
            {% if requested_departure_text != '' %}
              {{ (requested_departure_text | as_datetime | as_local).isoformat() }}
            {% elif state_attr('binary_sensor.upcoming_trip_charging', 'start_time') not in [none, '', 'None'] %}
              {% set upcoming_start = state_attr('binary_sensor.upcoming_trip_charging', 'start_time') | as_datetime | as_local %}
              {% set travel_duration_raw = state_attr('binary_sensor.upcoming_trip_charging', 'duration_min') %}
              {% if travel_duration_raw is number %}
                {% set travel_duration = timedelta(minutes=travel_duration_raw) %}
              {% elif travel_duration_raw is string and travel_duration_raw | trim not in ['', 'unknown', 'unavailable', 'none', 'None'] %}
                {% set travel_duration = travel_duration_raw | as_timedelta %}
              {% else %}
                {% set travel_duration = timedelta() %}
              {% endif %}
              {% set fallback_departure = upcoming_start - travel_duration - timedelta(minutes=19) %}
              {% if upcoming_start > now() and fallback_departure > now() %}
                {{ fallback_departure.isoformat() }}
              {% else %}
                {{ '' }}
              {% endif %}
            {% else %}
              {{ '' }}
            {% endif %}
          effective_reason: "{{ reason | default('Tesla departure planner', true) }}"
          departure_offset_from_midnight: >-
            {% if effective_departure_text != '' %}
              {% set effective_departure_dt = effective_departure_text | as_datetime | as_local %}
              {{ (effective_departure_dt.hour * 60) + effective_departure_dt.minute }}
            {% else %}
              0
            {% endif %}
          preserve_default_charging_schedule: "{{ location_name in ['home', 'parents', 'occ', 'spcc'] }}"
          stored_managed_departure_ts: "{{ states('input_number.tesla_managed_departure_ts') | int(0) }}"
          stored_managed_departure_active: "{{ is_state('input_boolean.tesla_managed_departure_active', 'on') }}"
          tesla_departure_ts: "{{ state_attr('binary_sensor.nigori_scheduled_departure', 'Departure timestamp') | int(0) }}"
          tesla_scheduled_charging_active: "{{ is_state('binary_sensor.nigori_scheduled_charging', 'on') }}"
          tesla_off_peak_charging_enabled: "{{ state_attr('binary_sensor.nigori_scheduled_departure', 'Off peak charging enabled') in [true, 'true', 'True', 'on'] }}"
          tesla_managed_departure_matches: >-
            {{ stored_managed_departure_active in [true, 'true', 'True', 'on'] and stored_managed_departure_ts > 0 and tesla_departure_ts > 0 and ((stored_managed_departure_ts - tesla_departure_ts) | abs) <= 300 }}
          force_disable_requested: "{{ force_disable | default(false) in [true, 'true', 'True', 'on', 1, '1'] }}"
          safe_to_clear_tesla_schedule: >-
            {{ preserve_default_charging_schedule not in [true, 'true', 'True'] or (tesla_managed_departure_matches in [true, 'true', 'True'] and (force_disable_requested in [true, 'true', 'True'] or (tesla_scheduled_charging_active not in [true, 'true', 'True'] and tesla_off_peak_charging_enabled not in [true, 'true', 'True']))) }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ not schedule_enabled }}"
            sequence:
              - action: logbook.log
                data:
                  entity_id: script.tesla_set_precondition_schedule_time
                  domain: script
                  name: Tesla scheduled departure planner
                  message: >-
                    {{ effective_reason }}{% if safe_to_clear_tesla_schedule in [true, 'true', 'True'] %} Clearing Tesla scheduled departure.{% elif tesla_managed_departure_matches not in [true, 'true', 'True'] %} Preserve the Tesla app charging schedule at {{ location_label }} and skip clearing Tesla schedule state because the live Tesla schedule does not match the last HA-managed protected-location departure.{% else %} Preserve the Tesla app charging schedule at {{ location_label }} and skip clearing Tesla schedule state because scheduled or off-peak charging is active.{% endif %}
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ safe_to_clear_tesla_schedule in [true, 'true', 'True'] }}"
                    sequence:
                      - action: tesla_custom.api
                        data:
                          command: SCHEDULED_DEPARTURE
                          parameters:
                            path_vars:
                              vehicle_id: "{{ state_attr('binary_sensor.nigori_online', 'id') }}"
                            enable: false
                            wake_if_asleep: true
        default:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ requested_departure_text == '' }}"
                sequence:
                  - alias: Check if this is not an all-day event
                    condition: state
                    entity_id: binary_sensor.upcoming_trip_charging
                    attribute: all_day
                    state: off
          - alias: Check that a departure time exists
            condition: template
            value_template: "{{ effective_departure_text != '' }}"
          - action: logbook.log
            data:
              entity_id: script.tesla_set_precondition_schedule_time
              domain: script
              name: Tesla scheduled departure planner
              message: >-
                {% set effective_departure_dt = effective_departure_text | as_datetime | as_local %}
                {{ effective_reason }} Departure at {{ effective_departure_dt.strftime('%a %H:%M') }}.{% if preserve_default_charging_schedule in [true, 'true', 'True'] %} Preserve the Tesla app charging schedule at {{ location_label }}.{% endif %}
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ preserve_default_charging_schedule in [true, 'true', 'True'] }}"
                sequence:
                  - alias: Set Scheduled Departure Time Without Touching Tesla-App Charging Defaults
                    action: tesla_custom.api
                    data:
                      command: SCHEDULED_DEPARTURE
                      parameters:
                        path_vars:
                          vehicle_id: "{{ state_attr('binary_sensor.nigori_online', 'id') }}"
                        enable: true
                        departure_time: "{{ departure_offset_from_midnight }}"
                        preconditioning_enabled: true
                        preconditioning_weekdays_only: false
                        wake_if_asleep: true
            default:
              - alias: Set Scheduled Departure Time With HA-Managed Off-Peak Charging
                action: tesla_custom.api
                data:
                  command: SCHEDULED_DEPARTURE
                  parameters:
                    path_vars:
                      vehicle_id: "{{ state_attr('binary_sensor.nigori_online', 'id') }}"
                    enable: true
                    departure_time: "{{ departure_offset_from_midnight }}"
                    preconditioning_enabled: true
                    preconditioning_weekdays_only: false
                    off_peak_charging_enabled: true
                    off_peak_charging_weekdays_only: true
                    end_off_peak_time: 360
                    wake_if_asleep: true
      # Report whether the Tesla schedule was actually cleared so callers only
      # drop the HA tracking helpers when there is nothing left to retry. Both
      # values are read at the top sequence level, where they are set — a value
      # set inside a choose/then sub-script is not visible here.
      - variables:
          tesla_schedule_result:
            cleared: >-
              {{ (not schedule_enabled) and safe_to_clear_tesla_schedule in [true, 'true', 'True'] }}
            skipped_disable: >-
              {{ (not schedule_enabled) and safe_to_clear_tesla_schedule not in [true, 'true', 'True'] }}
      - stop: "Tesla departure planner finished"
        response_variable: tesla_schedule_result

  # tesla_set_charge_limit_soc:
  #   alias: Tesla Set Charge Limit SOC
  #   mode: restart
  #   sequence:
  #     - action: tesla_custom.api
  #       data:
  #         command: CHANGE_CHARGE_LIMIT
  #         parameters:
  #           path_vars:
  #             vehicle_id: "{{ state_attr('binary_sensor.nigori_online', 'id') }}"
  #           percent: "{{ states('input_number.nigori_charge_limit') | int(default=90) }}"
  #           wake_if_asleep: true

########################
# Sensor
########################
sensor: []

########################
# Template
########################
template:
  # Enumerates every candidate event across the personal, curling, and work
  # calendars (via calendar.get_events, not each calendar entity's own single
  # pinned "current event" attribute) so a same-day all-day entry (e.g. a
  # recurring "Replace Contacts" reminder) can never shadow a real timed event
  # for the rest of the day (#see docs/tesla_departure_planner.md). Every
  # candidate beyond the "local trip" threshold gets a live Waze distance via
  # waze_travel_time.get_travel_times; charge limit is sized off the FURTHEST
  # qualifying event in the next 24h, while departure/preconditioning timing
  # follows whichever qualifying event is soonest.
  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/15"
      - trigger: state
        entity_id:
          - calendar.ryan_claussen
          - calendar.curling
          - binary_sensor.work_trip_today
          - input_number.tesla_local_trip_threshold_mi
    action:
      - variables:
          lookahead_start: >-
            {{ now().isoformat() }}
          lookahead_end: >-
            {{ (now() + timedelta(hours=24)).isoformat() }}
          local_trip_threshold_mi: >-
            {{ states('input_number.tesla_local_trip_threshold_mi') | float(default=10) }}
          planner_home_address: >-
            {{ states('input_text.home_address') }}
          personal_event_window: null
          curling_event_window: null
      - action: calendar.get_events
        continue_on_error: true
        target:
          entity_id: calendar.ryan_claussen
        data:
          start_date_time: "{{ lookahead_start }}"
          end_date_time: "{{ lookahead_end }}"
        response_variable: personal_event_window
      - action: calendar.get_events
        continue_on_error: true
        target:
          entity_id: calendar.curling
        data:
          start_date_time: "{{ lookahead_start }}"
          end_date_time: "{{ lookahead_end }}"
        response_variable: curling_event_window
      - variables:
          personal_events: >-
            {% if personal_event_window is mapping and personal_event_window.events is defined %}
              {{ personal_event_window.events | to_json }}
            {% elif personal_event_window is mapping and personal_event_window['calendar.ryan_claussen'] is defined and personal_event_window['calendar.ryan_claussen'].events is defined %}
              {{ personal_event_window['calendar.ryan_claussen'].events | to_json }}
            {% else %}
              {{ [] | to_json }}
            {% endif %}
          curling_events: >-
            {% if curling_event_window is mapping and curling_event_window.events is defined %}
              {{ curling_event_window.events | to_json }}
            {% elif curling_event_window is mapping and curling_event_window['calendar.curling'] is defined and curling_event_window['calendar.curling'].events is defined %}
              {{ curling_event_window['calendar.curling'].events | to_json }}
            {% else %}
              {{ [] | to_json }}
            {% endif %}
      - variables:
          personal_events_list: "{{ (personal_events | default('[]', true) | string | trim | from_json) }}"
          curling_events_list: "{{ (curling_events | default('[]', true) | string | trim | from_json) }}"
      - variables:
          candidates_json: >-
            {% from 'flight.jinja' import skip_charging_event %}
            {% set should_skip_charging_event = skip_charging_event | as_function %}
            {% set now_local = now() %}
            {% set horizon = now_local + timedelta(hours=24) %}
            {% set ns = namespace(items=[]) %}
            {% for event in personal_events_list %}
              {% set summary = event.summary | default('', true) | string %}
              {% set description = event.description | default('', true) | string %}
              {% set location = event.location | default('', true) | string %}
              {% set start_raw = event.start.dateTime | default(event.start.date, true) | default(event.start, true) %}
              {% set all_day = ('T' not in (start_raw | string)) %}
              {% set start_dt = (start_raw | as_datetime | as_local) if start_raw not in [none, ''] else none %}
              {% if start_dt is not none and start_dt > now_local and start_dt < horizon and not all_day and not should_skip_charging_event(summary, description, location) %}
                {% set ns.items = ns.items + [{'source': 'Personal', 'message': summary, 'start': start_dt.isoformat(), 'location': location}] %}
              {% endif %}
            {% endfor %}
            {% for event in curling_events_list %}
              {% set summary = event.summary | default('', true) | string %}
              {% set description = event.description | default('', true) | string %}
              {% set location = event.location | default('', true) | string %}
              {% set start_raw = event.start.dateTime | default(event.start.date, true) | default(event.start, true) %}
              {% set all_day = ('T' not in (start_raw | string)) %}
              {% set start_dt = (start_raw | as_datetime | as_local) if start_raw not in [none, ''] else none %}
              {% if start_dt is not none and start_dt > now_local and start_dt < horizon and not all_day and not should_skip_charging_event(summary, description, location) %}
                {% set ns.items = ns.items + [{'source': 'Curling', 'message': summary, 'start': start_dt.isoformat(), 'location': location}] %}
              {% endif %}
            {% endfor %}
            {% set work_start_raw = state_attr('binary_sensor.work_trip_today', 'start_time') %}
            {% set work_message = state_attr('binary_sensor.work_trip_today', 'message') | default('', true) %}
            {% set work_location = state_attr('binary_sensor.work_trip_today', 'location') | default('', true) %}
            {% set work_description = state_attr('binary_sensor.work_trip_today', 'description') | default('', true) %}
            {% set work_all_day = state_attr('binary_sensor.work_trip_today', 'all_day') in [true, 'true', 'True', 'on'] %}
            {% if work_start_raw not in [none, '', 'None'] and not work_all_day and not should_skip_charging_event(work_message, work_description, work_location) %}
              {% set work_start = work_start_raw | as_datetime | as_local %}
              {% if work_start is not none and work_start > now_local and work_start < horizon %}
                {% set ns.items = ns.items + [{'source': 'Work', 'message': work_message, 'start': work_start.isoformat(), 'location': work_location}] %}
              {% endif %}
            {% endif %}
            {{ ns.items | to_json }}
      - variables:
          candidates: "{{ (candidates_json | default('[]', true) | string | trim | from_json) }}"
          scored_candidates: []
      - repeat:
          for_each: "{{ candidates }}"
          sequence:
            - variables:
                candidate_waze_result: null
                candidate_distance_mi: 0
                candidate_duration_min: 0
            - if:
                - condition: template
                  value_template: "{{ (repeat.item.location | default('', true) | string | trim) != '' }}"
              then:
                - action: waze_travel_time.get_travel_times
                  continue_on_error: true
                  data:
                    origin: "{{ planner_home_address }}"
                    destination: "{{ repeat.item.location }}"
                    region: us
                    units: imperial
                  response_variable: candidate_waze_result
                - variables:
                    candidate_distance_mi: >-
                      {{ (candidate_waze_result.routes[0].distance | float(0)) if (candidate_waze_result is mapping and (candidate_waze_result.routes | default([]) | count) > 0) else 0 }}
                    candidate_duration_min: >-
                      {{ (candidate_waze_result.routes[0].duration | float(0)) if (candidate_waze_result is mapping and (candidate_waze_result.routes | default([]) | count) > 0) else 0 }}
            - variables:
                scored_candidates: >-
                  {{ scored_candidates + [ dict(repeat.item, distance_mi=candidate_distance_mi, duration_min=candidate_duration_min) ] }}
      - variables:
          trip_plan_json: >-
            {% set ns2 = namespace(next=none, furthest=none) %}
            {% for c in scored_candidates %}
              {% if c.distance_mi >= local_trip_threshold_mi %}
                {% if ns2.next is none or (c.start | as_datetime) < (ns2.next.start | as_datetime) %}
                  {% set ns2.next = c %}
                {% endif %}
                {% if ns2.furthest is none or c.distance_mi > ns2.furthest.distance_mi %}
                  {% set ns2.furthest = c %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% if ns2.next is none %}
              {{ {'entry': '', 'start_time': '', 'all_day': false, 'location': '', 'distance_mi': 0, 'duration_min': 0, 'furthest_entry': '', 'active': false} | to_json }}
            {% else %}
              {{ {
                'entry': ns2.next.source ~ ': ' ~ ns2.next.message,
                'start_time': ns2.next.start,
                'all_day': false,
                'location': ns2.next.location,
                'distance_mi': ns2.furthest.distance_mi,
                'duration_min': ns2.next.duration_min,
                'furthest_entry': ns2.furthest.source ~ ': ' ~ ns2.furthest.message,
                'active': true
              } | to_json }}
            {% endif %}
    binary_sensor:
      - name: upcoming_trip_charging
        unique_id: upcoming_trip_charging
        state: >-
          {{ (trip_plan_json | from_json).active | default(false) }}
        attributes:
          entry: >-
            {{ (trip_plan_json | from_json).entry | default('', true) }}
          start_time: >-
            {{ (trip_plan_json | from_json).start_time | default('', true) }}
          all_day: >-
            {{ (trip_plan_json | from_json).all_day | default(false) }}
          location: >-
            {{ (trip_plan_json | from_json).location | default('', true) }}
          distance_mi: >-
            {{ (trip_plan_json | from_json).distance_mi | default(0) }}
          duration_min: >-
            {{ (trip_plan_json | from_json).duration_min | default(0) }}
          furthest_entry: >-
            {{ (trip_plan_json | from_json).furthest_entry | default('', true) }}
  - binary_sensor:
      - default_entity_id: binary_sensor.tesla_daily_plan_active
        unique_id: tesla_daily_plan_active
        name: Tesla Daily Plan Active
        state: >-
          {{ is_state('input_boolean.long_range_travel', 'off') }}
  - sensor:
      - name: charge_complete
        unique_id: charge_complete
        device_class: timestamp
        availability: >-
          {% set charge_time_left_raw = state_attr('sensor.nigori_charging_rate','time_left') %}
          {{ states.sensor.nigori_charging_rate.last_updated is defined and charge_time_left_raw not in [none, '', 'None', 'unknown', 'unavailable'] }}
        state: >-
          {% set charge_time_left_raw = state_attr('sensor.nigori_charging_rate','time_left') %}
          {% if states.sensor.nigori_charging_rate.last_updated is defined and charge_time_left_raw not in [none, '', 'None', 'unknown', 'unavailable'] %}
            {% if charge_time_left_raw is number %}
              {% set charge_time_left = timedelta(hours=charge_time_left_raw) %}
            {% else %}
              {% set charge_time_left = charge_time_left_raw | as_timedelta %}
            {% endif %}
            {{ (states.sensor.nigori_charging_rate.last_updated + charge_time_left).isoformat() }}
          {% else %}
            {{ now().isoformat() }}
          {% endif %}
      # I don't think this is used by anything.
      # - name: next_trip_distance
      #   unit_of_measurement: "mi"
      #   availability: >-
      #     {{ state_attr("sensor.waze_next_trip_distance", "distance") != None }}
      #   state: >-
      #     {{ state_attr("sensor.waze_next_trip_distance", "distance") | int }}
      - default_entity_id: sensor.calendar_destination
        unique_id: calendar_destination
        name: Next Calendar Destination
        state: >-
          {% set loc = state_attr('binary_sensor.upcoming_trip_charging', 'location') | default('', true) | string | trim %}
          {{ loc if loc != '' else states('input_text.home_address') }}
########################
# Zone
########################
zone: {}
