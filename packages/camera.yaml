# Home Assistant package for camera motion and health workflows.
# It ties together camera entities, motion-triggered snapshots, and camera status groupings used for notifications and dashboard cards.

################################################################
## Packages / Camera
################################################################

################################################
## Customize
################################################

homeassistant:
  customize:
    ################################################
    ## Node Anchors
    ################################################

    package.node_anchors:
      customize: &customize
        package: "camera"

      expose: &expose
        <<: *customize
        haaska_hidden: false
        homebridge_hidden: false

    ################################################
    ## Automations
    ################################################

    ################################################
    ## Binary Sensors
    ################################################
    binary_sensor.livingroom_motion_sensor:
      <<: *customize
      device_class: motion
      friendly_name: "Living Room Camera Motion"

    binary_sensor.tikiroomcam_motionsensor:
      <<: *customize
      device_class: motion
      friendly_name: "Tiki Room Camera Motion"

    ################################################
    ## Cameras
    ################################################
    camera.livingroom_motion_snapshot:
      <<: *customize
      friendly_name: "Living Room Motion Snapshot"
      icon: mdi:cctv

    ################################################
    ## Device Trackers
    ################################################

    ################################################
    ## Groups
    ################################################
    group.all_cameras:
      <<: *customize
      friendly_name: All Camera Info

    group.tikiroom_camera_status:
      <<: *customize
      friendly_name: TikiRoom Camera Status

    group.livingroom_camera_status:
      <<: *customize
      friendly_name: Living Room Camera Status

    ################################################
    ## Input Boolean
    ################################################

    ################################################
    ## Input Numbers
    ################################################

    ################################################
    ## Light
    ################################################

    ################################################
    ## Scripts
    ################################################

    ################################################
    ## Sensors
    ################################################

    ################################################
    ## Switches
    ################################################
    switch.livingroom_blue_led:
      <<: *customize
      friendly_name: "Living Room Blue LED"

    switch.livingroom_ir_filter:
      <<: *customize
      friendly_name: "Living Room IR Filter"

    switch.livingroom_ir_led:
      <<: *customize
      friendly_name: "Living Room IR LED"

    switch.livingroom_motion_detection:
      <<: *customize
      friendly_name: "Living Room Motion Detection"

    switch.livingroom_motion_tracking:
      <<: *customize
      friendly_name: "Living Room Motion Tracking"

    switch.livingroom_night_mode:
      <<: *customize
      friendly_name: "Living Room Night Mode"

    switch.livingroom_yellow_led:
      <<: *customize
      friendly_name: "Living Room Yellow LED"

    ################################################
    ## Thermostats
    ################################################

    ################################################
    ## Zone
    ################################################

################################################
## Automation
################################################
automation:
  - id: living_room_camera_animal_detected_notify
    alias: "Dining Room Camera — Notify on animal/pet detection"
    description: >
      Scrypted's Home Assistant integration exposes object detections as an
      event entity whose event_type is the detected class. Notify when the
      Dining Room camera (legacy "living room" entity ids; see
      docs/security_dashboard.md) reports an animal or common pet class. The cooldown
      keeps a lingering pet from spamming notifications. Transitions out of
      unavailable/unknown (Scrypted reconnects restore the cached last event)
      are ignored so they do not look like new detections.
    trace:
      stored_traces: 100
    triggers:
      - trigger: state
        entity_id: event.living_room_camera_object_detected
        id: detection
    conditions:
      - condition: template
        value_template: >
          {{ trigger.from_state is not none
             and trigger.from_state.state not in ['unavailable', 'unknown']
             and trigger.to_state is not none
             and trigger.to_state.attributes.event_type | default('')
                 in ['animal', 'dog', 'cat'] }}
    actions:
      - action: notify.notify_all
        data:
          title: "Pet spotted"
          message: >
            Dining Room camera detected
            {{ trigger.to_state.attributes.label
               | default(trigger.to_state.attributes.event_type, true) }}.
          data:
            tag: living_room_camera_animal
            group: camera
      - delay: "00:05:00"
    mode: single

########################
# Binary Sensors
########################
binary_sensor: []

########################
# Cameras
########################
camera:
  - platform: ffmpeg
    name: tikiroomcamera
    input: !secret tikiroom_cam_ffmpeg_command

  - platform: ffmpeg
    name: livingroomcamera
    input: !secret livingroom_ffmpeg_command

########################
# Device Trackers
########################
device_tracker: []

########################
# Groups
########################
group:
  all_cameras:
    entities:
      - group.livingroom_camera_status
      - camera.livingroomcamera
      - camera.tikiroomcamera
      - camera.livingroom_motion_snapshot
      - camera.tikiroomcam_tikiroom_motion_snapshot

  tikiroom_camera_status:
    entities:
      - switch.tiki_room_camera
      - switch.tikiroomcam_tikiroom_motion_detection
      - switch.tikiroomcam_tikiroom_motion_tracking
      - switch.tikiroomcam_tikiroom_night_mode
      - switch.tikiroomcam_tikiroom_night_mode_auto
      - switch.tikiroomcam_tikiroom_ir_filter
      - switch.tikiroomcam_tikiroom_ir_led
      - switch.tikiroomcam_tikiroom_rtsp_server
      - switch.tikiroomcam_tikiroom_blue_led
      - switch.tikiroomcam_tikiroom_yellow_led
      - cover.tikiroomcam_tikiroom_move_left_right
      - cover.tikiroomcam_tikiroom_move_up_down

  livingroom_camera_status:
    entities:
      - switch.livingroom_motion_detection
      - switch.livingroom_motion_tracking
      - switch.livingroom_night_mode
      - switch.livingroom_auto_night_detection
      - switch.livingroom_ir_filter
      - switch.livingroom_ir_led
      - switch.livingroom_rtsp_server
      - switch.livingroom_blue_led
      - switch.livingroom_yellow_led
      - cover.livingroom_move_left_right
      - cover.livingroom_move_up_down

########################
# Input Booleans
########################
input_boolean: {}

########################
# Input Numbers
########################
input_number: {}

########################
# Light
########################
light: []

########################
# MQTT
########################
mqtt: {}

########################
# Scenes
########################
scene: []

########################
# Scripts
########################
script: {}

########################
# Sensor
########################
sensor: []

########################
# Switches
########################
switch: []

########################
# Zone
########################
zone: {}
