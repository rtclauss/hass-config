# Living room tile include for the main Lovelace dashboard.
# Complex areas: this room mixes light controls, scenes, and graphs, so it is split into its own include to keep the main view maintainable.

type: custom:vertical-stack-in-card
title: Living Room
cards:
  - type: horizontal-stack
    cards:
      - type: entity-button
        entity: light.living_room_lamps_except_tv
        state_color: true
        name: " "
        icon: mdi:sofa
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - type: entity-button
        entity: light.tv
        state_color: true
        name: " "
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - type: entity-button
        entity: light.pendant_lamp
        state_color: true
        name: " "
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - type: entity-button
        entity: fan.living_room_fan
        state_color: true
        name: " "
        icon: mdi:fan
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - type: entity-button
        entity: light.living_room_fan_light
        state_color: true
        name: "Light"
        icon: mdi:fan
        tap_action:
          action: toggle
        hold_action:
          action: more-info
  - type: horizontal-stack
    title: Scenes and Activities
    show_header_toggle: false
    cards:
      - type: entity-button
        entity: script.reset_basement
        name: " "
        icon: mdi:backup-restore
        show_state: false
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.reset_basement
  - type: horizontal-stack
    cards:
      - type: custom:mini-graph-card
        name: Temp
        group: false
        #align_state: center
        entities:
          - sensor.living_room_temperature
        color_thresholds:
          - value: 68
            color: "red"
          - value: 65
            color: "orange"
          - value: 62
            color: "yellow"
          - value: 55
            color: "blue"
        graph: line
        show:
          name: false
      - type: custom:mini-graph-card
        name: Humidity
        #align_state: center
        entities:
          - sensor.living_room_humidity
        graph: line
        show:
          name: false
  # Native media tiles cover this room's existing playback and TV-volume
  # controls. Source remains hidden for parity with the prior cards, and the
  # live entities do not expose sound modes. Sonos group controls elsewhere
  # still require mini-media-player, so its dashboard resource remains loaded.
  - type: tile
    entity: media_player.basement
    features_position: bottom
    features:
      - type: media-player-playback
        controls:
          - turn_on
          - media_play_pause
          - media_stop
          - turn_off
  - type: tile
    entity: media_player.lg_webos_smart_tv
    features_position: bottom
    features:
      - type: media-player-playback
        controls:
          - media_play_pause
          - media_stop
          - turn_off
      - type: media-player-volume-buttons
        step: 5
        show_mute_button: true
