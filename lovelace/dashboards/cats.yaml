# Cats dashboard (YAML mode), registered in configuration.yaml as `db-cats`.
# Data comes from the Smart Cat integration (docs/smartcat.md). Kept separate
# from the storage-mode Calm dashboard so it can be iterated on without touching
# that owner-approved layout. Adding a cat: copy the Splashy section and change
# the `splashy` object ids.
title: Cats
views:
  - title: Cats
    path: cats
    icon: mdi:cat
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Splashy
            icon: mdi:cat
          - type: markdown
            content: "{{ state_attr('sensor.splashy_insight', 'summary') or 'Waiting for Smart Cat data.' }}"
          - type: tile
            entity: sensor.splashy_insight
            name: Pattern
          - type: tile
            entity: binary_sensor.splashy_needs_attention
            name: Needs attention
          - type: tile
            entity: sensor.splashy_daily_visits
            name: Visits today
          - type: tile
            entity: sensor.splashy_last_visit
            name: Last visit
          - type: tile
            entity: sensor.splashy_average_visit_duration
            name: Avg visit (7 d)
          - type: tile
            entity: sensor.splashy_typical_weight
            name: Weight (7 d)
          - type: tile
            entity: sensor.splashy_weight_trend
            name: Weight trend

      - type: grid
        cards:
          - type: heading
            heading: Patterns
            icon: mdi:chart-bar
          # Native cards only: apexcharts-card overflowed the section on
          # phones and drew the hourly counts as a smoothed line (#1254).
          - type: markdown
            title: Time of visits (last 30 days)
            content: |-
              {% set hist = state_attr('sensor.splashy_daily_visits', 'hourly_histogram_30d') or [] %}
              {% if hist | length != 24 or hist | sum == 0 %}
              No visits recorded yet.
              {% else %}
              {% set labels = ['12–3a', '3–6a', '6–9a', '9a–12p', '12–3p', '3–6p', '6–9p', '9p–12a'] %}
              {% set ns = namespace(bins=[]) %}
              {% for i in range(8) %}{% set ns.bins = ns.bins + [hist[i * 3:(i + 1) * 3] | sum] %}{% endfor %}
              {% set top = ns.bins | max %}
              ```
              {% for n in ns.bins -%}
              {{ '%-6s' | format(labels[loop.index0]) }} {{ ('█' * ((n * 14 / top) | round(0, 'ceil') | int)) if n else '·' }} {{ n }}
              {% endfor -%}
              ```
              {% endif %}
          - type: statistics-graph
            title: Visits per day (14 days)
            entities:
              - smartcat:splashy_visits
            stat_types: [change]
            period: day
            days_to_show: 14
            chart_type: bar
          - type: statistics-graph
            title: Visits per week
            entities:
              - smartcat:splashy_visits
            stat_types: [change]
            period: week
            days_to_show: 365
            chart_type: bar
          - type: statistics-graph
            title: Weight
            entities:
              - smartcat:splashy_weight
            stat_types: [mean]
            period: week
            days_to_show: 1460
            chart_type: line

      - type: grid
        cards:
          - type: heading
            heading: Litter-Robots
            icon: mdi:robot
          - type: tile
            entity: sensor.laundry_room_main_level_waste_drawer_full_forecast
            name: Main Level drawer full
          - type: tile
            entity: sensor.laundry_room_main_level_litter_refill_forecast
            name: Main Level litter refill
          - type: tile
            entity: sensor.laundry_room_main_level_cycles_per_day
            name: Main Level cycles/day
          - type: tile
            entity: sensor.basement_great_room_basement_waste_drawer_full_forecast
            name: Basement drawer full
          - type: tile
            entity: sensor.basement_great_room_basement_litter_refill_forecast
            name: Basement litter refill
          - type: tile
            entity: sensor.basement_great_room_basement_cycles_per_day
            name: Basement cycles/day
          - type: tile
            entity: binary_sensor.smart_cat_new_cat_suspected
            name: New cat suspected
          - type: tile
            entity: sensor.smart_cat_unassigned_visits_7_days
            name: Unassigned visits (7 d)
