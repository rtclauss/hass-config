hallway_lights_turn_on:
  alias: Hallway and stairway lights on
  description: >-
    Turn on both circulation groups through their own Adaptive Lighting profiles.
    The stairway switch's receiving endpoint does not forward automation commands
    through its paddle binding, so address the bulb group explicitly.
  mode: parallel
  max: 20
  fields:
    transition:
      description: Transition duration in seconds.
      default: 1
      selector:
        number:
          min: 0
          max: 300
          step: 0.5
          unit_of_measurement: seconds
  sequence:
    - action: script.adaptive_light_turn_on
      data:
        adaptive_switch: switch.adaptive_lighting_hallway
        lights:
          - light.hall_all
        transition: "{{ transition | default(1) }}"
    - action: script.adaptive_light_turn_on
      data:
        adaptive_switch: switch.adaptive_lighting_stairway
        lights:
          - light.hall_stairway_bulbs
        transition: "{{ transition | default(1) }}"

leave_home_transition:
  alias: Leave home transition
  description: >-
    Apply the stable leave-home scene, then turn off optional media and
    seasonal targets only when Home Assistant has a usable state for them.
  mode: restart
  sequence:
    - continue_on_error: true
      action: scene.turn_on
      target:
        entity_id: scene.leave_home
    - variables:
        optional_shutdown_targets:
          - action: media_player.turn_off
            entity_id: media_player.lg_webos_smart_tv
    - repeat:
        for_each: "{{ optional_shutdown_targets }}"
        sequence:
          - condition: template
            value_template: "{{ has_value(repeat.item.entity_id) }}"
          - continue_on_error: true
            action: "{{ repeat.item.action }}"
            target:
              entity_id: "{{ repeat.item.entity_id }}"
    - continue_on_error: true
      action: script.turn_off_christmas_lights
