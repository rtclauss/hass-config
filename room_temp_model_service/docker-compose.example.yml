services:
  room-temp-model:
    build: .
    # or: image: room-temp-model:latest
    restart: unless-stopped
    environment:
      MQTT_HOST: REDACTED          # broker reachable from this host
      MQTT_PORT: "1883"
      MQTT_USERNAME: room_temp_model
      MQTT_PASSWORD: change-me
      MQTT_BASE_TOPIC: room_temp_model
      MQTT_DISCOVERY_PREFIX: homeassistant
      INFLUXDB_HOST: REDACTED
      INFLUXDB_PORT: "8086"
      INFLUXDB_DATABASE: home_assistant
      LATITUDE: "REDACTED"
      LONGITUDE: "REDACTED"
      MIN_TRAINING_SAMPLES: "500"
      ROOMS_FILE: /config/rooms.json
    volumes:
      - ./models:/models
      - ./rooms.json:/config/rooms.json:ro
